<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"/>
<meta name="theme-color" content="#0b1122"/>
<meta name="color-scheme" content="dark light"/>
<meta name="description" content="Мат-Бум: Дуэль 3.0 — изометрическая головоломка Match-3 на поле 7×7 с тремя правилами матчинга: 3 одинаковых, 3 подряд и «Собери 10». Собирай линии из чисел, обыгрывай Хоруса, открывай фигурки в музее."/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Мат-Бум: Дуэль 3.0</title>
<style>/* =====================================================================
   МАТ-БУМ ДУЭЛЬ 2.0 — оформление
   ===================================================================== */
:root{
  --gold:#f3c969; --gold-2:#e2a83c; --blue:#6cb6ff; --blue-2:#3d7fd6;
  --ink:#eae6d9; --mut:#93a2c4; --dim:#7688ad;
  --panel:rgba(17,25,46,.72); --panel-2:rgba(24,34,60,.6); --panel-b:rgba(243,201,105,.22);
  --card:linear-gradient(160deg,#1b2544,#0e1428 70%); --card-b:rgba(243,201,105,.35);
  --btnbg:rgba(24,33,58,.85); --btnb:rgba(243,201,105,.35);
  --bg1:#0b1122; --bg2:#070b16; --bg3:#04060d;
  --hint:#c9d5ef; --good:#5fe3a1; --bad:#ff8080;
  --shadow:0 18px 50px rgba(0,0,0,.5);
  --chrome-h:52px;
}
[data-theme="light"]{
  --ink:#222a3d; --mut:#5a6a8c; --dim:#6d7c9e;
  --panel:rgba(255,255,255,.78); --panel-2:rgba(255,255,255,.6); --panel-b:rgba(140,104,20,.25);
  --card:linear-gradient(160deg,#ffffff,#eef2fb 70%); --card-b:rgba(140,104,20,.35);
  --btnbg:rgba(255,255,255,.9); --btnb:rgba(140,104,20,.35);
  --bg1:#eef2fb; --bg2:#e3e9f7; --bg3:#d8e0f2;
  --hint:#31406b; --shadow:0 18px 40px rgba(40,60,110,.22);
  --gold:#b98314; --gold-2:#a06d0a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--ink);
  user-select:none;-webkit-user-select:none;
  background:
    radial-gradient(1200px 520px at 50% -12%, rgba(255,205,120,.10), transparent 62%),
    radial-gradient(900px 620px at 50% 112%, rgba(80,160,255,.10), transparent 62%),
    linear-gradient(var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column;
}
[data-theme="light"] body{
  background:
    radial-gradient(1200px 520px at 50% -12%, rgba(255,190,90,.22), transparent 62%),
    radial-gradient(900px 620px at 50% 112%, rgba(70,130,235,.12), transparent 62%),
    linear-gradient(var(--bg1),var(--bg2) 55%,var(--bg3));
}
body::after{
  content:"";position:fixed;inset:-24%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(46% 38% at 16% 8%, rgba(108,142,255,.20), transparent 70%),
    radial-gradient(44% 40% at 86% 18%, rgba(158,104,255,.16), transparent 70%),
    radial-gradient(58% 44% at 50% 106%, rgba(56,206,224,.14), transparent 72%),
    radial-gradient(34% 26% at 78% 88%, rgba(255,196,110,.10), transparent 70%);
  animation:aurora 28s ease-in-out infinite alternate;
}
[data-theme="light"] body::after{
  background:
    radial-gradient(46% 38% at 16% 8%, rgba(96,138,255,.16), transparent 70%),
    radial-gradient(44% 40% at 86% 18%, rgba(158,104,255,.10), transparent 70%),
    radial-gradient(58% 44% at 50% 106%, rgba(38,196,218,.12), transparent 72%);
}
@keyframes aurora{from{transform:translate3d(-2%,-1.5%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.08)}}
button{font-family:inherit;cursor:pointer;color:var(--ink);border:1px solid var(--btnb);
  background:var(--btnbg);border-radius:13px;padding:9px 16px;font-size:14px;font-weight:800;letter-spacing:.6px;
  transition:filter .15s,transform .06s}
button:active{transform:scale(.96)}
button.primary{background:linear-gradient(#ffe6a2,#e0a532);color:#3a2a05;border-color:#ffe6a2;
  box-shadow:0 0 22px rgba(255,214,120,.35),inset 0 1px 0 rgba(255,255,255,.6)}
button.ghost{background:transparent}
button.small{padding:6px 10px;font-size:12px}
button[hidden]{display:none!important}
button:disabled{opacity:.42;cursor:default;filter:saturate(.4)}
@media (hover:hover){button:hover:not(:disabled){filter:brightness(1.14)}}

/* ------------------------------- chrome ------------------------------ */
#chrome{display:flex;justify-content:center;align-items:center;height:var(--chrome-h);padding:8px 12px 0;z-index:20}
.chrome-c{display:flex;gap:6px;align-items:center;margin-left:auto}
.ico-btn{min-width:40px;position:relative;display:inline-flex;align-items:center;justify-content:center}
.ico{width:20px;height:20px;vertical-align:middle;pointer-events:none}
.ico-btn.off img.ico{opacity:.4}
.mute-slash{display:none;position:absolute;left:9px;top:50%;width:21px;height:3px;background:#ff6a6a;transform:rotate(-45deg);border-radius:2px}
.ico-btn.off .mute-slash{display:block}

/* ------------------------------- screens ----------------------------- */
.screen{position:absolute;left:0;right:0;bottom:0;top:var(--chrome-h);display:none;flex-direction:column;z-index:1}
.screen.on{display:flex}
.screen-scroll{flex:1;overflow:auto;padding:8px 18px 28px;-webkit-overflow-scrolling:touch}
.center{max-width:980px;margin:0 auto;text-align:center}
h2.scr-title{color:var(--gold);letter-spacing:.14em;font-size:clamp(19px,3.6vw,28px);text-align:center;margin:10px 0 4px;font-weight:900}
.sub{color:var(--mut);font-size:13px;text-align:center;line-height:1.4}
.ver{margin-top:18px;color:var(--dim);font-size:11.5px;letter-spacing:.08em}

/* ------------------------------- start ------------------------------- */
.start-tri{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:10px 0 20px}
.side{display:none}
.mid{width:100%;max-width:420px}
.logo{font-weight:900;letter-spacing:.06em;font-size:clamp(38px,9vw,64px);color:var(--gold);line-height:1;
  text-shadow:0 0 26px rgba(243,201,105,.45),0 3px 0 rgba(0,0,0,.35)}
[data-theme="light"] .logo{text-shadow:0 2px 0 #fff,0 0 20px rgba(180,130,20,.3)}
.h1sub{font-size:clamp(17px,4vw,26px);letter-spacing:.34em;color:var(--ink);font-weight:800;margin-top:8px;opacity:.92}
.h1sub b{color:var(--blue)}
.tagline{margin-top:10px;color:var(--mut);font-size:13px;letter-spacing:.02em}
.menu-actions{display:flex;flex-direction:column;gap:11px;margin:26px auto 0;max-width:330px}
.menu-actions button{font-size:16px;padding:14px 18px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.menu-actions .primary{font-size:18px}
.menu-actions .lbl{letter-spacing:.1em}

/* ------------------------------ duel select -------------------------- */
.diffrow{display:flex;gap:8px;justify-content:center;margin:14px auto 4px;flex-wrap:wrap}
.diff{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:104px;padding:8px 12px;border-radius:14px;
  background:var(--panel);border:1px solid var(--panel-b);font-size:13px;color:var(--hint);font-weight:800}
.diff small{font-size:10.5px;color:var(--dim);letter-spacing:.06em;font-weight:700}
.diff.on{background:linear-gradient(#2a3a68,#18233f);border-color:var(--gold);color:#fff;box-shadow:0 0 16px rgba(243,201,105,.25)}
[data-theme="light"] .diff.on{background:linear-gradient(#fff7e2,#ffecc0);color:#3a2a05}
.diff.on small{color:var(--gold)}
.rivals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:900px;margin:16px auto 0}
.rival{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--card-b);border-radius:18px;padding:12px 10px 10px;text-align:center;
  transition:transform .15s,box-shadow .15s}
.rival:active{transform:scale(.97)}
@media(hover:hover){.rival:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.35)}}
.rival .fig{width:72px;height:72px;border-radius:14px;object-fit:cover;display:block;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.rival .nm{font-weight:900;font-size:15px;letter-spacing:.02em}
.rival .style{font-size:11px;color:var(--mut);min-height:26px;line-height:1.25}
.rival .rec{font-size:10.5px;color:var(--gold);letter-spacing:.03em;font-weight:800}
.rival .best{font-size:11px;color:var(--dim)}
.rival .winbadge{position:absolute;top:8px;right:8px;background:rgba(95,227,161,.16);border:1px solid rgba(95,227,161,.5);
  color:var(--good);font-size:10.5px;font-weight:900;border-radius:9px;padding:2px 6px}
.rival.locked .fig{filter:grayscale(.55) brightness(.65)}
.rival .go{margin-top:2px;width:100%;padding:7px 10px;font-size:12px;letter-spacing:.08em}

/* ------------------------------ hall / museum ------------------------ */
.hallwrap{max-width:620px;margin:16px auto 0;display:flex;flex-direction:column;gap:10px}
.hcard{background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;padding:12px 14px}
.hcard h3{color:var(--gold);font-size:12px;letter-spacing:.14em;margin-bottom:8px}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05)}
.hrow:first-of-type{border-top:none}
.hrow img{width:34px;height:34px;border-radius:9px;object-fit:cover}
.hrow .nm{flex:1;font-size:13.5px;color:var(--hint)}
.hrow .sc{font-weight:900;color:var(--gold);font-size:15px}
.hrow .rk{width:20px;color:var(--dim);font-weight:800;font-size:12px}
.statrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px auto 0}
.chip{background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;padding:7px 14px;font-size:12.5px;color:var(--hint)}
.chip b{color:var(--gold);font-size:15px}
@media (max-width:640px){.musgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 8px 14px}.dome img{width:56px;height:56px}.lockico{width:50px;height:50px;font-size:22px}.muscard .base{width:72px}}
.musgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;max-width:820px;margin:18px auto 30px;padding:16px 14px 18px;
  border:1px solid rgba(243,201,105,.16);border-radius:20px;
  background:linear-gradient(180deg,rgba(120,160,255,.07),rgba(255,255,255,.02) 34%,rgba(0,0,0,.18));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 36px rgba(0,0,0,.3)}
.muscard{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border:none;background:transparent;cursor:pointer;transition:transform .15s}
.muscard:hover{transform:translateY(-3px)}
.dome{padding:6px;border-radius:16px 16px 10px 10px;border:1px solid rgba(190,215,255,.2);
  background:linear-gradient(180deg,rgba(190,215,255,.13),rgba(190,215,255,.02) 72%)}
.dome img{width:72px;height:72px;border-radius:10px;object-fit:cover;display:block}
.muscard .base{width:92px;height:13px;margin-top:7px;border-radius:3px 3px 6px 6px;
  background:linear-gradient(180deg,#a5813f,#5d4620 70%,#40300f);box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,230,160,.5)}
.muscard .plate{margin-top:8px;font-size:10.5px;line-height:1.3;color:var(--gold);text-align:center;min-height:28px}
.muscard.locked .dome img{filter:grayscale(1) brightness(.4)}
.muscard.locked .base{filter:grayscale(.65) brightness(.75)}
.muscard.locked .plate{color:var(--dim)}
.lockico{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.5}

/* ------------------------------- help -------------------------------- */
.helpwrap{max-width:660px;margin:0 auto}
.helpwrap .card{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:13px 16px;margin-top:11px;text-align:left}
.helpwrap h2{color:var(--gold);font-size:15px;letter-spacing:.08em;margin-bottom:5px}
.helpwrap p{color:var(--hint);font-size:13.5px;line-height:1.5}
.helpwrap b{color:var(--gold)}

/* ------------------------------- game -------------------------------- */
#scr-game{z-index:2}
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;padding:2px 10px 0;z-index:6}
.duelist{position:relative;display:grid;grid-template-columns:54px 1fr;grid-template-rows:auto auto;gap:0 10px;
  background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;padding:8px 12px 10px;min-width:0}
.duelist .ava{grid-row:1/3;align-self:center;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:25px;color:#3a2a05;background:linear-gradient(#ffe6a2,#d99f2f);box-shadow:0 0 16px rgba(243,201,105,.35)}
.duelist.blue .ava{background:linear-gradient(#a8d6ff,#3f7fd6);color:#071a33;box-shadow:0 0 16px rgba(108,182,255,.35);overflow:hidden}
.duelist .ava img{width:100%;height:100%;object-fit:cover}
.duelist .who{display:flex;flex-direction:column;justify-content:center;min-width:0}
.duelist .who b{font-size:clamp(15px,4.3vw,21px);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duelist .who span{font-size:13px;color:var(--dim);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duelist .pts{position:absolute;right:12px;top:6px;font-size:clamp(30px,7.4vw,44px);font-weight:900;color:#fff;line-height:1;
  text-shadow:0 2px 8px rgba(0,0,0,.4)}
[data-theme="light"] .duelist .pts{color:#223}
.duelist.gold .pts{color:var(--gold)} .duelist.blue .pts{color:var(--blue)}
.duelist .pbar{grid-column:2;height:8px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:5px;margin-right:76px}
.duelist .pbar i{display:block;height:100%;width:0;border-radius:3px;transition:width .35s ease}
.duelist.gold .pbar i{background:linear-gradient(90deg,#a97a17,var(--gold))}
.duelist.blue .pbar i{background:linear-gradient(90deg,#2c5c9c,var(--blue))}
.duelist.gold.turn{border-color:rgba(243,201,105,.85);box-shadow:0 0 20px rgba(243,201,105,.22)}
.duelist.blue.turn{border-color:rgba(108,182,255,.85);box-shadow:0 0 20px rgba(108,182,255,.22)}
.center-hud{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:136px}
.center-hud .target{font-size:19px;letter-spacing:.08em;color:var(--dim);font-weight:800;white-space:nowrap}
.center-hud .target b{color:var(--gold);font-size:29px}
.turn{font-size:18px;letter-spacing:.08em;font-weight:900;padding:6px 13px;border-radius:12px;white-space:nowrap;
  border:1px solid var(--panel-b);background:var(--panel-2);color:var(--hint)}
.turn.p{color:#3a2a05;background:linear-gradient(#ffe6a2,#e0a532);border-color:#ffe6a2;animation:tpulse 1.6s ease-in-out infinite}
.turn.ai{color:#eaf4ff;background:linear-gradient(#3f7fd6,#25518f);border-color:#6cb6ff;animation:apulse 1.4s ease-in-out infinite}
.turn.busy{opacity:.85}
@keyframes tpulse{50%{box-shadow:0 0 20px rgba(255,214,120,.7)}}
@keyframes apulse{50%{box-shadow:0 0 20px rgba(108,182,255,.65)}}
#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:clamp(8px,3.2vh,28px);transform:translate(-50%,-14px);opacity:0;pointer-events:none;
  background:rgba(8,12,24,.88);border:1px solid var(--panel-b);color:var(--hint);font-size:19px;font-weight:800;
  padding:10px 18px;border-radius:14px;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;z-index:5;line-height:1.25}
#toast.on{opacity:1;transform:translate(-50%,0)}
#trainPlate{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);max-width:min(92%,560px);
  background:rgba(8,12,24,.9);border:1px solid var(--panel-b);border-radius:14px;padding:9px 14px;z-index:6;
  font-size:12.5px;line-height:1.35;color:var(--hint);text-align:center}
#trainPlate b{display:block;color:var(--gold);font-size:10.5px;letter-spacing:.14em;margin-bottom:3px}
[data-theme="light"] #trainPlate,[data-theme="light"] #toast{background:rgba(255,255,255,.94);color:#31406b}
#actions{display:flex;gap:10px;justify-content:center;align-items:center;padding:8px 12px 14px;z-index:6}
.action{position:relative;display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:17px;
  background:var(--panel);border:1px solid var(--panel-b);font-size:20px;letter-spacing:.02em;font-weight:800}
.action .ai{font-size:13px;font-weight:900;letter-spacing:.06em;color:#3a2a05;background:linear-gradient(#ffe6a2,#e0a532);
  border-radius:7px;padding:2px 7px}
.action .cnt{color:var(--gold);font-size:20px;font-weight:900}
.action:disabled .ai{background:#555f7a;color:#c9d3ea}
.action .ico2{font-size:25px;line-height:1}

/* ------------------------------ overlays ----------------------------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:rgba(4,6,12,.62);backdrop-filter:blur(4px);padding:16px}
.overlay.on{display:flex}
.obox{position:relative;background:var(--card);border:1px solid var(--card-b);border-radius:22px;
  padding:22px 26px;text-align:center;max-width:min(92vw,440px);width:100%;
  box-shadow:0 0 70px rgba(61,220,132,.18),var(--shadow);animation:cardIn .45s cubic-bezier(.2,1.5,.4,1);max-height:90vh;overflow:auto}
@keyframes cardIn{from{transform:scale(.72);opacity:0}}
.overlay h1{color:var(--gold);letter-spacing:.12em;font-size:24px;font-weight:900}
.overlay p{margin:7px 0;color:var(--hint);font-size:14px;line-height:1.4}
.overlay p b{color:#fff}
[data-theme="light"] .overlay p b{color:#223}
.overlay .btns{display:flex;gap:9px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.overlay .btns button{flex:1 1 auto;min-width:110px}
.fin-vs{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 6px}
.fin-vs .sc{font-size:36px;font-weight:900;line-height:1}
.fin-vs .sc.gold{color:var(--gold)} .fin-vs .sc.blue{color:var(--blue)}
.fin-vs .sep{color:var(--dim);font-size:18px;font-weight:800}
.fin-fig{width:112px;height:112px;border-radius:18px;object-fit:cover;display:block;margin:10px auto 4px;
  box-shadow:0 10px 36px rgba(0,0,0,.5);animation:figb 3.2s ease-in-out infinite}
@keyframes figb{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.bigfig{width:min(64vw,280px);height:auto;border-radius:20px;display:block;margin:6px auto;
  box-shadow:0 14px 46px rgba(0,0,0,.55);animation:figb 3.2s ease-in-out infinite}
#fig-name{color:var(--gold);font-weight:900;font-size:17px;margin-top:8px}
.tutbox{max-width:460px}
.tutbox h1{font-size:20px;letter-spacing:.1em;margin-bottom:6px}
.tut-step{font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:900;margin-bottom:8px}
.tut-art{height:74px;display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 10px}
.tut-tile{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:22px;box-shadow:0 6px 14px rgba(0,0,0,.4);transition:transform .4s}
.tut-tile.g{background:linear-gradient(#ffe6a2,#d99f2f);color:#4a3208}
.tut-tile.b{background:linear-gradient(#a8d6ff,#3f7fd6);color:#f2f9ff}
.tut-tile.hl{outline:2px solid var(--gold);box-shadow:0 0 18px rgba(243,201,105,.8)}
#tut-text{font-size:14px;line-height:1.5;min-height:76px;margin:0 0 6px;color:var(--hint)}
/* ad overlay */
.adbox{max-width:380px}
.ad-screen{height:150px;border-radius:16px;margin:12px 0;display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 12px,rgba(255,255,255,.02) 12px 24px),#101728;
  border:1px dashed rgba(255,255,255,.18);font-size:13px;letter-spacing:.2em;color:var(--dim)}
.ad-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.09);overflow:hidden;margin-top:6px}
.ad-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--blue));transition:width .25s linear}
/* ------- built-in svg icons ------- */
svg.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ------------------------------ responsive --------------------------- */
/* 2.6: узкие экраны — имена не наезжают на счёт, кнопки действий влезают в ширину */

@media (min-width:1100px){
  .start-tri{display:grid;grid-template-columns:300px minmax(340px,440px) 300px;gap:22px;align-items:center;justify-items:center}
  .mid{max-width:none}
  .side{display:block;width:100%;background:var(--panel);border:1px solid var(--panel-b);border-radius:18px;padding:14px;text-align:left}
  .side h3{color:var(--gold);font-size:11px;letter-spacing:.14em;margin-bottom:9px}
  .minigrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .minigrid img{width:100%;aspect-ratio:1;border-radius:9px;object-fit:cover}
  .minigrid img.lk{filter:grayscale(1) brightness(.4)}
  .srow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--hint);margin:5px 0}
  .srow .sc{margin-left:auto;color:var(--gold);font-weight:900}
  .srow .rk{color:var(--dim);font-weight:800}
  .side .sub{text-align:left;font-size:11.5px;margin-top:8px}
  #scr-game.on{display:grid;grid-template-rows:auto 1fr auto}
}

/* ================= 2.3 ================= */
/* правило над доской */
#gameHint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-top,54px) + 2px);
  width:min(96vw,720px);max-width:min(96vw,720px);text-align:center;pointer-events:none;z-index:6;opacity:0;
  transition:opacity .28s ease}
#gameHint.on{opacity:1}
/* 2.5: легенда цветов — у каждого игрока своя мини-фишка с номером */
#legend{position:absolute;left:8px;right:8px;top:calc(var(--safe-top,54px) + 2px);display:flex;
  justify-content:center;gap:12px;pointer-events:none;z-index:6;opacity:0;transition:opacity .28s ease}
#legend.on{opacity:1}
/* 2.6: плашки-легенды — по центру под панелью очков, мини-фишка размером с настоящую */
.lgchip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px 4px;border-radius:14px;
  background:rgba(8,12,24,.74);border:1px solid var(--panel-b);border-top:3px solid var(--gold,#f3c969);
  color:var(--txt,#eae6d9);font-size:16px;font-weight:800;letter-spacing:.01em;line-height:1.1;
  box-shadow:0 4px 14px rgba(0,0,0,.3);width:max-content;max-width:53%}
.lgchip.opp{border-top-color:var(--blue,#4fd1a0)}
.lgchip b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lgtile{flex:0 0 auto;width:var(--tw,46px);height:var(--th,39px);border-radius:calc(var(--th,39px)*.20);
  display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:calc(var(--th,39px)*.52);font-weight:900;color:var(--tn,#2a2105);
  background:linear-gradient(160deg,var(--tg1,#f3c969),var(--tg2,#d8a244));
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.35)}
[data-theme="light"] #legend .lgchip{background:rgba(255,255,255,.92);border-color:rgba(20,26,38,.12);
  border-top-color:var(--gold,#d99f2f);color:#31406b}
[data-theme="light"] #legend .lgchip.opp{border-top-color:var(--blue,#2a9c74)}
[data-theme="light"] #gameHint span{color:#141a26;background:rgba(255,255,255,.88);border-color:rgba(20,26,38,.14);box-shadow:0 6px 16px rgba(20,30,50,.10)}
#gameHint span{display:inline-block;padding:8px 15px;border-radius:16px;font-size:clamp(14px,3.1vw,19px);
  line-height:1.22;font-weight:700;letter-spacing:.01em;color:#eaf3ff;
  background:rgba(6,12,24,.62);border:1px solid rgba(255,255,255,.10);
  box-shadow:0 6px 18px rgba(0,0,0,.35);backdrop-filter:blur(6px)}

/* режимы */
.moderow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:2px 0 12px}
.modebtn{display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:14px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:inherit;
  font:inherit;font-weight:800;font-size:13px;letter-spacing:.02em;transition:.18s}
.modebtn svg{width:16px;height:16px;flex:0 0 auto}
.modebtn.on{background:linear-gradient(180deg,rgba(243,201,105,.22),rgba(243,201,105,.08));
  border-color:rgba(243,201,105,.62);color:var(--gold,#f3c969);
  box-shadow:0 8px 22px rgba(243,201,105,.16), inset 0 1px 0 rgba(255,255,255,.14)}
.modebtn small{font-weight:600;opacity:.72;font-size:11px}
.boardline{text-align:center;font-size:12px;opacity:.62;margin:0 0 10px}
.boardline b{color:var(--gold,#f3c969)}
.card .bchip{position:absolute;top:10px;right:10px;width:9px;height:9px;border-radius:50%;
  box-shadow:0 0 8px currentColor}

/* доска (3 варианта) */
body[data-board="jade"] .stage-wrap{background:radial-gradient(ellipse at 50% 12%,#16322b 0%,#0a1512 62%,#050807 100%)}
body[data-board="amethyst"] .stage-wrap{background:radial-gradient(ellipse at 50% 12%,#2a1d44 0%,#140e22 62%,#08060c 100%)}
body[data-board="abyss"] .stage-wrap{background:radial-gradient(ellipse at 50% 12%,#122238 0%,#0a1420 62%,#04070c 100%)}

/* хотсит-плашки */
#hud.hot .p-side b{color:var(--gold,#f3c969)}
#hud.hot.turn-2 .a-side b{color:var(--blue,#6cb6ff)}
#hud.hot:not(.turn-2) .a-side{opacity:.42}
#hud.hot.turn-2 .p-side{opacity:.42}

/* туториал — нижняя карточка, доска остаётся видимой */
.tutwrap{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tutwrap.on{display:block;animation:tutIn .3s ease both}
@keyframes tutIn{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.tutsheet{margin:0 auto;max-width:520px;border-radius:15px;padding:8px 12px 9px;
  background:linear-gradient(180deg,rgba(10,16,30,.96),rgba(6,10,20,.98));
  border:1px solid rgba(255,255,255,.13);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.tut-head{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.tut-badge{flex:0 0 auto;display:grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:8px;
  background:linear-gradient(180deg,rgba(243,201,105,.28),rgba(243,201,105,.1));
  border:1px solid rgba(243,201,105,.5);color:var(--gold,#f3c969);font-weight:900;font-size:13px}
.tut-title{font-size:12.5px;letter-spacing:.07em;font-weight:900;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tutsheet p{margin:0 0 7px;font-size:15px;line-height:1.3;opacity:.96}
.tutsheet .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tutsheet .btns button{padding:7px 14px;font-size:15px}
.tutwrap.fin .tutsheet{padding:7px 12px 8px}
.tutwrap.fin #tut-text{min-height:0}   /* 2.6: на финале одна строка — карточка ниже */
.tutwrap.fin .tutsheet p{margin:0 0 6px;font-size:15px}
.tutwrap.fin .tutsheet .btns{flex-wrap:nowrap;gap:6px}
.tutwrap.fin .tutsheet .btns button{flex:1 1 0;min-width:0;padding:6px 8px;font-size:13px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tutsheet .btns button{min-width:0}
/* 2.6: во время обучения легенда и правило скрыты — текст шага и так всё объясняет,
   а доска получает всё свободное место; карточка обучения её не закрывает */
body.tut-on #legend, body.tut-on #gameHint{display:none}
@media (max-height:680px){
  .tutsheet p{font-size:13.5px;line-height:1.24}
  .tutsheet{padding:7px 10px 8px}
  .tutsheet .btns button{padding:6px 11px;font-size:14px}
}
/* в туториале кнопка, которую нужно нажать, пульсирует */
body.tut-step1 #actions{opacity:0;pointer-events:none}
body.tut-step2 #b-hint, body.tut-step3 #b-shuffle{animation:btnPulse 1.15s ease-in-out infinite}
@keyframes btnPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(243,201,105,0);border-color:var(--panel-b)}
  50%{box-shadow:0 0 0 4px rgba(243,201,105,.30),0 0 22px rgba(243,201,105,.35);border-color:rgba(243,201,105,.85)}}

/* онлайн-оверлей */
.mpmain{max-width:520px}
#mp-body .btns button{display:flex;align-items:center;justify-content:center;gap:8px}
#mp-body p{font-size:13px;line-height:1.45;opacity:.9;margin:0 0 9px}
#mp-body .mplist{display:flex;flex-direction:column;gap:7px;max-height:40vh;overflow:auto;margin:6px 0 2px}
#mp-body .mprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;
  border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-size:13px}
#mp-body .mpcode{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:.24em;
  font-weight:800;color:var(--gold,#f3c969)}
#mp-body input{width:100%;padding:10px 12px;border-radius:12px;font:inherit;font-size:15px;letter-spacing:.2em;
  text-transform:uppercase;text-align:center;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.14);color:inherit;margin:4px 0 9px}
#mp-body .mphi{font-size:11.5px;opacity:.6;text-align:center;margin:2px 0 0}

/* финал: подписи сторон */
.fin-vs{display:flex;align-items:center;justify-content:center;gap:12px}
.fin-side{display:flex;flex-direction:column;align-items:center;gap:2px}
.fin-side small{font-size:10px;letter-spacing:.12em;font-weight:900;opacity:.62;text-transform:uppercase;
  max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* выбор доски */
.boardrow{display:flex;gap:7px;justify-content:center;margin:0 0 10px}
.bcard{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border-radius:13px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:inherit;
  font:inherit;font-weight:800;font-size:11px;transition:.18s}
.bcard:hover{background:rgba(255,255,255,.08)}
.bcard.on{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.10);
  box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.16)}
.bpair{display:inline-flex;gap:2px}
.bpair i{width:13px;height:13px;border-radius:4px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.bcard .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ======= адаптив: в конце файла, чтобы перекрывать базовые правила 2.3–2.6 ======= */
@media (max-width:720px){
  #actions{position:sticky;bottom:0;background:linear-gradient(transparent,rgba(6,9,18,.55))}
  [data-theme="light"] #actions{background:linear-gradient(transparent,rgba(240,244,252,.6))}
  #hud{padding:0 6px;gap:5px}
  .duelist{grid-template-columns:42px 1fr;padding:7px 9px 9px;border-radius:13px}
  .duelist .ava{width:42px;height:42px;font-size:20px}
  .duelist .who b{font-size:clamp(14px,4.2vw,17px)}
  .duelist .who span{display:none}
  .duelist .pts{font-size:clamp(26px,7vw,34px);right:9px;top:5px}
  .duelist .pbar{margin-right:56px;height:6px}
  .center-hud{min-width:104px}
  .center-hud .target{font-size:16px}
  .center-hud .target b{font-size:23px}
  .turn{font-size:16px;padding:5px 9px}
  #actions{padding:6px 8px 10px;gap:8px}
  .action{padding:12px 15px;font-size:17px;gap:8px}
  .action .cnt{font-size:17px}
  .action .ico2{font-size:21px}
  .lgchip{font-size:14px;padding:4px 8px 5px}
  .tutsheet p{font-size:14px;line-height:1.28}
  .screen-scroll{padding:6px 12px 24px}
  .rivals{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .rival .fig{width:60px;height:60px}
  .rival .nm{font-size:13.5px}
}

@media (max-width:430px){
  #hud{grid-template-columns:1fr 1fr;grid-template-areas:"p a" "c c";gap:5px 6px}
  #p-side{grid-area:p} #a-side{grid-area:a}
  .center-hud{grid-area:c;flex-direction:row;gap:10px;min-width:0;padding:1px 0 0}
  .duelist{grid-template-columns:36px 1fr;gap:0 7px;padding:6px 8px 8px}
  .duelist .ava{width:36px;height:36px;font-size:18px}
  .duelist .who{padding-right:30px}
  .duelist .pts{font-size:clamp(22px,6.2vw,28px);right:7px;top:6px}
  .duelist .pbar{margin-right:38px}
  /* в обучении счёт 0:0 не нужен — вся высота HUD уходит доске */
  #hud.train{display:none}
  .action .ai{display:none}   /* 2.6: без бейджа «AD» подписи кнопок влезают целиком */
  #actions{padding:5px 8px 9px;gap:6px;flex-wrap:nowrap}
  .action{flex:1 1 0;min-width:0;padding:11px 9px;font-size:17px;gap:6px;justify-content:center}
  .action svg{flex:0 0 auto;width:1.15em;height:1.15em}
  .action .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .action .cnt{font-size:16px}
  .action .ico2{font-size:19px}
  .action .ai{font-size:11px;padding:1px 5px}
  .lgchip{font-size:15px}
  /* финал обучения: кнопки в столбик во всю ширину — «Повторить обучение?» не обрезается */
  .tutwrap.fin .tutsheet .btns{flex-wrap:wrap;gap:6px}
  .tutwrap.fin .tutsheet .btns button{flex:1 1 100%;font-size:16px;padding:9px 10px}
}
/* 2.6: на финальном шаге обучения кнопки подсказки и перемешивания не нужны */
body.tut-fin #actions{display:none}

@media (max-width:378px){
  /* кнопки действий: чуть меньше отступы, чтобы подписи влезали при 17 px */
  .action{padding:11px 6px;gap:5px}
  .duelist .who{padding-right:28px}
}
@media (max-width:355px){
  .lgchip{padding:4px 6px}
  .action{font-size:15.5px;padding:10px 4px;gap:4px}
  .action .cnt{font-size:14px}
  .action .ai{font-size:10px;padding:1px 4px}
  .duelist .who{padding-right:26px}
  .duelist .pts{font-size:22px}
  .lgchip{font-size:14px}
}

@media (max-height:560px){
  .menu-actions{margin-top:14px;gap:8px}
  .menu-actions button{padding:10px 14px;font-size:14px}
  .logo{font-size:34px}
  .h1sub{font-size:15px}
  .tagline{display:none}
  #actions{padding:2px 8px 6px}
}

/* ============================== 2.9 =============================== */
/* 12 цветов фишек: сетка образцов */
.colorbox{width:min(94vw,460px)}
.colpair{display:flex;gap:10px;justify-content:center;margin:2px 0 10px;flex-wrap:wrap}
.colpair .lgchip{font-size:13px;padding:4px 9px 5px}
.colpair .lgchip b{font-size:12.5px}
.colgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:2px 0 12px}
.csw{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px 6px;border-radius:13px;
  border:1px solid var(--panel-b);background:rgba(255,255,255,.03);color:inherit;cursor:pointer;
  font:inherit;font-weight:800;font-size:11.5px;transition:.16s;min-width:0}
.csw span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.86}
.csw:hover{background:rgba(255,255,255,.08)}
.csw.on{border-color:rgba(255,255,255,.62);background:rgba(255,255,255,.10);
  box-shadow:0 0 0 1px rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.3)}
.csw-t{width:34px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-weight:900;font-size:16px;color:var(--tn,#231a08);
  background:linear-gradient(160deg,var(--c1,#eee),var(--c2,#bbb));
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.24),0 3px 7px rgba(0,0,0,.35)}
[data-theme="light"] .csw{background:rgba(20,30,50,.04);border-color:rgba(20,30,50,.14);color:#22304d}
[data-theme="light"] .csw.on{background:rgba(20,30,50,.08);border-color:rgba(20,30,50,.4)}
.colrow{display:flex;gap:8px;justify-content:center;margin:-2px 0 10px;flex-wrap:wrap}
.smallbtn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;font-size:13px;font-weight:800}
.smallbtn svg{width:16px;height:16px}

/* 2.9: падение счёта без Web Animations */
@keyframes bump{0%{transform:scale(1.3)}100%{transform:scale(1)}}
.duelist .pts.bump{animation:bump .26s ease-out}

/* 2.9: три кнопки действий */
#actions #b-undo{padding-left:16px;padding-right:16px}
@media (max-width:430px){
  #actions #b-undo{padding-left:8px;padding-right:8px}
  .colgrid{grid-template-columns:repeat(4,1fr);gap:6px}
  .csw{font-size:10.5px;padding:6px 3px 5px}
  .csw-t{width:30px;height:26px;font-size:14px}
}

  .csw-t{width:27px;height:23px;font-size:13px}
}

/* 2.9: три кнопки действий на узком экране — оставляем иконку и счётчик */
@media (max-width:470px){
  #actions .action .lbl{display:none}
  #actions .action{padding:11px 10px;justify-content:center}
  #actions .action svg{width:1.35em;height:1.35em}
}

/* 2.9: на узких экранах названия досок не должны обрезаться многоточием */

  #boardrow .bcard .bn{font-size:.78em}
  #boardrow .bcard{padding-left:4px;padding-right:4px}

}

/* =====================================================================
   МАТ-БУМ ДУЭЛЬ 3.0 — три правила, HUD-прогресс, комбо, достижения, конфетти
   ===================================================================== */
/* -------- выбор правила -------- */
.rulehead{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.18em;font-weight:800;margin:12px 0 0}
.rulepickrow{display:flex;gap:8px;justify-content:center;margin:6px auto 0;flex-wrap:wrap;max-width:760px}
.rulecard{flex:1 1 0;min-width:108px;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 8px;border-radius:14px;cursor:pointer;border:1px solid var(--panel-b);
  background:var(--panel);font:inherit;font-weight:800;font-size:13px;color:inherit;
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;text-align:center}
@media (hover:hover){.rulecard:hover{background:rgba(255,255,255,.10)}}
.rulecard.on{border-color:rgba(243,201,105,.75);
  background:linear-gradient(180deg,rgba(243,201,105,.20),rgba(243,201,105,.06));
  box-shadow:0 6px 18px rgba(243,201,105,.16),inset 0 1px 0 rgba(255,255,255,.16)}
[data-theme="light"] .rulecard.on{background:linear-gradient(180deg,#fff7e2,#ffecc0);box-shadow:0 6px 16px rgba(180,130,20,.18)}
.rulecard .ric{font-size:24px;line-height:0;color:var(--gold);display:flex;align-items:center;justify-content:center;height:24px}
.rulecard .ric svg{display:block}
.rulebadge .rdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:5px;vertical-align:1px}
.rulecard .rnm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rulecard .rsub{font-size:10.5px;font-weight:600;opacity:.66;min-height:26px;line-height:1.2}
.rulehint{text-align:center;color:var(--dim);font-size:11px;margin:7px 0 2px}
.ruletabs{display:flex;gap:6px;justify-content:center;margin:10px auto 2px;flex-wrap:wrap}
.ruletab{font-size:12px;font-weight:800;padding:5px 11px;border-radius:11px;border:1px solid var(--panel-b);
  background:var(--panel);color:var(--hint);cursor:pointer}
.ruletab.on{border-color:var(--gold);color:var(--gold);background:rgba(243,201,105,.14)}

/* -------- HUD: цель, прогресс, правило, рекорд -------- */
.center-hud{gap:4px}
.goalwrap{display:flex;flex-direction:column;gap:2px;align-items:center;width:100%;max-width:158px}
.goalbar{height:5px;width:100%;border-radius:4px;background:rgba(255,255,255,.10);overflow:hidden}
.goalbar i{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,#a97a17,var(--gold));transition:width .32s ease}
.goalmeta{display:flex;gap:5px;font-size:10.5px;color:var(--mut);font-weight:700;white-space:nowrap;letter-spacing:.01em}
.goalmeta #hud-left{color:var(--dim)}
.hudbadges{display:flex;flex-direction:column;align-items:center;gap:2px}
.rulebadge{font-size:11.5px;padding:2px 9px;border-radius:9px;background:rgba(243,201,105,.14);
  border:1px solid rgba(243,201,105,.35);color:var(--gold);font-weight:800;letter-spacing:.03em;white-space:nowrap}
.recbadge{font-size:10px;color:var(--dim);font-weight:700;white-space:nowrap}
#hud-target.near{animation:nearGlow 1.5s ease-in-out infinite}
@keyframes nearGlow{0%,100%{text-shadow:0 0 0 rgba(243,201,105,0)}50%{text-shadow:0 0 16px rgba(243,201,105,.95),0 0 32px rgba(243,201,105,.5)}}

/* -------- таймер, комбо, счётчик спецфишек -------- */
#timer{position:absolute;top:6px;right:10px;z-index:4;font-size:11.5px;font-weight:800;color:var(--dim);
  background:rgba(8,12,24,.42);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:2px 8px;
  pointer-events:none;letter-spacing:.04em}
[data-theme="light"] #timer{background:rgba(255,255,255,.68);color:#5a6a8c}
#comboBadge{position:absolute;top:26px;left:10px;z-index:5;transform:scale(.6) translateY(-6px);opacity:0;
  pointer-events:none;font-size:15px;font-weight:900;letter-spacing:.04em;color:#fff6dc;
  background:linear-gradient(180deg,rgba(255,124,44,.95),rgba(196,56,8,.95));
  border:1px solid rgba(255,222,150,.85);border-radius:11px;padding:3px 11px;
  box-shadow:0 6px 22px rgba(255,120,40,.45);transition:opacity .22s ease,transform .22s cubic-bezier(.2,1.5,.4,1)}
#comboBadge.on{opacity:1;transform:scale(1) translateY(0)}
#spCount{position:absolute;bottom:6px;right:10px;z-index:4;display:flex;gap:6px;pointer-events:none}
#spCount i{font-style:normal;font-size:11.5px;font-weight:800;color:var(--hint);
  background:rgba(8,12,24,.45);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:2px 7px;letter-spacing:.03em}
[data-theme="light"] #spCount i{background:rgba(255,255,255,.7);color:#31406b}
#spCount.on i{box-shadow:0 0 12px rgba(243,201,105,.35)}

/* -------- достижения на финальном экране -------- */
.fin-ach{margin-top:8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.fin-ach .a{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:#ffe9b0;
  background:linear-gradient(180deg,rgba(243,201,105,.24),rgba(243,201,105,.06));
  border:1px solid rgba(243,201,105,.5);border-radius:11px;padding:5px 11px;
  animation:achPop .5s cubic-bezier(.2,1.6,.4,1) both}
[data-theme="light"] .fin-ach .a{color:#7a5410}
@keyframes achPop{from{transform:scale(.6);opacity:0}}

/* -------- конфетти -------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
#confetti i{position:absolute;top:-20px;border-radius:2px;opacity:.94;will-change:transform,opacity;
  animation-name:confFall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes confFall{
  0%{transform:translate3d(0,-10px,0) rotate(0deg) scaleY(1);opacity:0}
  10%{opacity:1}
  100%{transform:translate3d(var(--dx,0),108vh,0) rotate(var(--rot,720deg));opacity:.85}}

/* -------- плавный переход хода -------- */
.duelist{transition:border-color .2s ease,box-shadow .2s ease,opacity .2s ease}
.turn{transition:background .2s ease,color .2s ease,box-shadow .2s ease}
#turn-banner.swap{animation:bannerSwap .24s ease-out}
@keyframes bannerSwap{from{transform:translateY(-5px) scale(.9);opacity:.35}}
.duelist .ava{transition:box-shadow .2s ease,transform .2s ease}
.duelist.turn .ava{transform:scale(1.05)}
.duelist .who span.think{color:var(--gold);opacity:.9}
@media (max-width:720px){
  .rulecard{min-width:94px;font-size:12px;padding:8px 6px}
  .rulecard .ric{font-size:20px}
  .rulecard .rsub{font-size:10px;min-height:22px}
  .goalwrap{max-width:118px}
  .recbadge{display:none}
  #timer{font-size:10.5px;top:4px;right:6px}
  #spCount{bottom:4px;right:6px}
}
@media (max-width:560px){
  /* на телефоне «ЦЕЛЬ 80» дублируется в строке прогресса — убираем верхнюю строку,
     чтобы центр HUD дышал и ничего не наезжало */
  .center-hud .target{display:none}
  .goalmeta{font-size:10px;gap:4px}
}
@media (max-width:430px){
  /* центр HUD в две строки: прогресс цели, затем ход + правило */
  .center-hud{flex-wrap:nowrap;flex-direction:column;gap:2px;width:100%;min-width:0;align-items:stretch}
  .goalwrap{max-width:100%;width:100%;order:1}
  .goalbar{height:4px}
  .goalmeta{justify-content:center;font-size:10px}
  .turn{order:2;align-self:center;padding:3px 10px}
  .hudbadges{order:3;flex-direction:row;justify-content:center;gap:8px}
  .rulebadge{font-size:10px;padding:1px 6px}
  .rulecard .rsub{display:none}
  .rulecard{min-width:88px}
  #toast{top:auto;bottom:8px;font-size:15px;padding:8px 13px}
  /* таймер уходит вниз-влево: сверху его перекрывает легенда */
  #timer{top:auto;bottom:6px;left:8px;right:auto}
  #hud-target{display:none}
}
</style>
</head>

  help_goal_t:'Цель', help_goal:'Побеждает тот, кто первым наберёт цель. Цель зависит от правила и уровня: в «3 одинаковых» и «3 подряд» — 80 / 120 / 180 очков, в «Собери 10» — 300 / 450 / 650, потому что линия в этом режиме стоит фиксированные 5–6 очков и таких линий на доске больше. Очки получает тот цвет, чья линия собралась. Под счётом в HUD видно «набрано / цель · процент» и сколько ещё осталось до победы.',
  help_board_t:'Поле и фишки', help_board:'Поле 7×7 — 49 клеток: у тебя и у Хоруса свои фишки с цифрами от 1 до 5. Доска не пустеет: сгоревшие фишки заменяются новыми и падают сверху, поэтому партия идёт, пока кто-то не наберёт цель. Цвет фишек выбираешь ты — из двенадцати спокойных оттенков, соперник получает контрастный.',
  help_match_t:'Линии и очки', help_match:'Линия — три и более фишки одного цвета, стоящие подряд по горизонтали, вертикали или диагонали; какая именно линия считается собранной, решает выбранное правило (см. блок «Три правила матчинга»). Очки за линию: <b>сумма цифр × коэффициент длины × множитель правила</b>. Коэффициент длины: 3 фишки ×0.6, 4 — ×0.7, 5 — ×0.8, 6 — ×0.9, 7 — ×1.0. В классике три пятёрки дают 9 очков, четыре — 14, пять — 20; в «Собери 10» линия всегда стоит одинаково — около 5–6 очков; в «3 подряд» цена зависит от суммы чисел в последовательности.',
  help_turn_t:'Ходы и две сборки', help_turn:'Свап — две соседние фишки (горизонталь, вертикаль, диагональ). Можно менять свои фишки между собой и свою с чужой, две фишки соперника — никогда. Собрал линию — ход остаётся, и можно сразу собрать вторую линию как награду за первую. После второй сборки ход переходит сопернику. Не собрал линию — фишки остаются на новых местах, ход переходит сопернику. Хорус играет по тем же правилам. Один раз за партию можно отменить свой ход кнопкой «Отмена» — доска и счёт вернутся к состоянию перед свапом.',
  help_grav_t:'Гравитация и каскады', help_grav:'Сгоревшие фишки исчезают, верхние падают вниз, а сверху приходят новые. Если линия сложилась сама — это каскад: очки получает цвет линии, вторая волна считается с множителем ×2, третья и дальше — ×3.',
  help_rewards_t:'Подсказка и перемешивание', help_rewards:'За просмотр рекламы доступны подсказка (3 раза за матч) и перемешивание (1 раз за матч). Подсказка не просто подсвечивает пару, а объясняет, почему свап лучший: какая выйдет линия, сколько очков и получится ли спецфишка. Если собрать линию нечем, доска перемешивается автоматически.',
  help_tut_t:'Обучение', help_tut:'Обучение — три шага, каждый заканчивается действием. Шаг 1: все фишки затемнены, подсвечена пара — поменяй её местами и собери первую линию. Шаг 2: за рекламу берётся подсказка лучшего хода, свап по стрелке собирает линию и она гаснет. Шаг 3: за рекламу доска перемешивается. В конце — «Повторить обучение?» и «Вернуться в меню». Открыть обучение можно кнопкой «ОБУЧЕНИЕ» в меню.',
  help_mode_t:'Режимы и доски', help_mode:'Три доски — «Изумрудный зал», «Аметистовый зал» и «Бездна»: они меняют платформу, фон и свечение. Цвет фишек от доски не зависит: кнопка с палитрой в верхней панели открывает двенадцать оттенков, а «Поменять цвета» меняет твой цвет с цветом Хоруса. Режимы: «С ИИ» — дуэль с Хорусом, «ВДВОЁМ» — хотсит за одним устройством, «ОНЛАЙН» — пошаговая партия по коду. Правило матчинга выбирается на экране соперника и работает во всех трёх режимах; в онлайне правило задаёт хост, гость видит его до входа в игру и играет по нему.',
  help_horus_t:'Соперник — Хорус', help_horus:'Хорус — искусственный интеллект, который играет против живого игрока по тем же правилам: те же свапы, та же гравитация, рефилл и те же две сборки подряд. Сложность меняет и цель, и силу Хоруса.',
  help_lvl_t:'Уровни сложности', help_lvl:'Лёгкий: цель 80 (в «Собери 10» — 300), Хорус видит только горизонтали и вертикали и часто берёт слабые свапы — его обыгрывают примерно 80 % игроков. Средний: цель 120 (450), ошибается редко и иногда срывает твой лучший ход — побеждают около 50 %. Сложный: цель 180 (650), блокирует твои лучшие ходы и считает ответ — побеждают лишь 15 %. Уровень меняет и цель, и силу Хоруса, правило на сложность не влияет: темп во всех трёх режимах выровнен.',
  help_museum_t:'Музей', help_museum:'В музее 10 фигурок — по одной за каждого поверженного соперника. Победа открывает фигурку, а в музее её можно рассмотреть вблизи. Открытые фигурки сохраняются в облаке площадки.',
  help_hall_t:'Зал славы', help_hall:'Зал славы хранит статистику: всего побед, лучший результат, победы и рекорды по каждому сопернику, а также онлайн-рейтинг — он стартует с 1000, +12 за победу и −8 за поражение.',
  help_ctrl_t:'Управление', help_ctrl:'Тапни фишку, затем соседнюю (в том числе по диагонали) — они поменяются местами. Или свайпни фишку в сторону соседней. Допустимые пары подсвечиваются. Esc — пауза, M — звук, H — подсказка, R — перемешать. Кнопки над доской: подсказка, перемешивание и отмена хода.',

  /* ---------- 3.0: справка о правилах и спецфишках ---------- */
  help_rule_t:'Три правила матчинга',
  help_rule:'Правило выбирается на экране соперника (блок «ПРАВИЛО») и запоминается — оно действует в дуэли с Хорусом, в игре вдвоём и в онлайне, где гость всегда играет по правилу хоста. Рекорды и победы ведутся отдельно по каждому правилу.<br><br>🎯 <b>«3 одинаковых»</b> — классика: три и более фишки одного цвета с одной и той же цифрой в линию (горизонталь, вертикаль, диагональ).<br><br>📈 <b>«3 подряд»</b> — три числа подряд по порядку, шаг всегда ровно 1: 2-3-4, 3-4-5, 4-3-2 — направление любое, лишь бы не сбивался шаг. Четыре подряд (2-3-4-5) дают ракету, пять (1-2-3-4-5) — бомбу.<br><br>➕ <b>«Собери 10»</b> — линия одного цвета, сумма цифр которой ровно 10: 3+4+3, 2+4+4, 5+3+2, 1+2+3+4. Считается вся линия целиком: если в линии четыре фишки, в сумму идут все четыре. Очки за такую линию фиксированные, поэтому цель в этом режиме выше: 300 / 450 / 650.<br><br>Очки везде считаются одинаково: <b>сумма цифр линии × коэффициент длины</b> (3 фишки ×0.6, 4 — ×0.7, 5 — ×0.8, 6 — ×0.9, 7 — ×1.0) <b>× множитель режима</b>. Темп во всех трёх режимах выровнен: партия на лёгком уровне длится 10–12 ходов, на сложном — 20–26.',
  help_special_t:'Спецфишки: полное описание',
  help_special:'Спецфишка — это обычная фишка с меткой. Цифра и цвет у неё остаются прежними, поэтому она участвует в линиях наравне с остальными и может закрыть собой любую линию. Рождается она в момент сборки длинной линии: остаётся на доске (в клетке свапа, если свап входит в линию, иначе в середине линии) и ждёт своего часа.<br><br><b>Главное правило:</b> спецфишка срабатывает только тогда, когда её саму снимают с доски — собрали линию с её участием, попала под ракету или бомбу. Пока она просто лежит — она молчит, но её видно по светящейся кромке и значку в углу.',
  help_sp_rocket_t:'Ракета — линия из 4',
  help_sp_rocket:'Четыре фишки одного цвета в линию дают <b>ракету</b>. Направление берётся от линии: вертикальная линия — ракета бьёт по <b>столбцу</b>, горизонтальная и диагональ — по <b>ряду</b> (на значке нарисованы стрелки в нужную сторону).<br><br>Когда ракету снимают с доски, она вычищает свой ряд или столбец целиком, от края до края — все фишки, включая чужие. Очки за выстрел: <b>сумма цифр снятых фишек × 0.6</b>, и это умножается на множитель каскада.',
  help_sp_bomb_t:'Бомба — линия из 5 и больше или крест',
  help_sp_bomb:'Пять и более фишек в одну линию, а также <b>пересечение двух линий одного цвета</b> (крест или угол) дают <b>бомбу</b>. Бомба взрывает квадрат 3×3 вокруг себя — до девяти фишек сразу, включая диагональных соседей. Это самый быстрый способ расчистить доску и самый частый источник больших каскадов.<br><br>Очки за взрыв считаются так же, как за выстрел ракеты: сумма цифр снятых фишек × 0.6 × множитель каскада.',
  help_sp_chain_t:'Цепная реакция',
  help_sp_chain:'Если в зону взрыва попала другая спецфишка — она детонирует тоже, и так далее, пока цепочка не закончится. Одна ракета может снести ряд, зацепить бомбу, а та — ещё две ракеты. Каждое звено цепочки считается отдельно, и все они получают множитель текущей волны каскада. Поэтому «сложить» две спецфишки рядом — лучший способ набрать много очков за один ход.',
  help_sp_score_t:'Кому достаются очки',
  help_sp_score:'Сама спецфишка очков не приносит — очки даёт только её взрыв. Всё, что снял взрыв, достаётся <b>цвету спецфишки</b>, то есть тому, кто её собрал. Обычные снятые взрывом фишки отдельно не считаются, чтобы не было двойного начисления: за линию платят один раз, за взрыв — один раз.',
  help_sp_modes_t:'Спецфишки в трёх правилах',
  help_sp_modes:'Правило меняет только то, какая линия считается собранной, а метки остаются те же: <b>4 в линию — ракета, 5 и больше или крест — бомба</b>.<br><br>🎯 В классике всё как обычно.<br>📈 В «3 подряд» ракета появляется на последовательности из четырёх чисел (2-3-4-5), бомба — на пяти (1-2-3-4-5).<br>➕ В «Собери 10» линия из четырёх клеток должна в сумме давать ровно 10 (например 1+2+3+4), а из пяти — тоже ровно 10 (например 1+2+2+2+3). Такие линии редки, зато каждая даёт спецфишку — и в этом режиме их заметно меньше, чем в классике.',

  help_ach:'В игре 30 достижений: победы и их количество, первая ракета и первая бомба, комбо ×3 и ×5, линии из пяти и семи фишек, очки за партию, победы в каждом из трёх правил, победа над Хорусом-мастером, быстрая победа и марафон, полный музей, онлайн-победы и другие. Разблокированные достижения сохраняются в профиле и показываются на финальном экране сразу после партии.<br><br>За каждую партию начисляется опыт: победа — 40 XP плюс 10 за каждый уровень сложности, ничья — 20, поражение — 12. Опыт двигает глобальный уровень игрока (виден под твоим ником в дуэли); на уровень нужно 150 XP, дальше — на 50 больше каждый раз.'

  help_rule_t:'Three match rules',
  help_rule:'The rule is picked on the rival screen (the RULE block) and remembered — it applies to duels with Horus, hot-seat games and online, where the guest always plays by the host rule. Wins and records are tracked separately for each rule.<br><br>🎯 <b>“3 equal”</b> — the classic: three or more tiles of one colour with the same number in a line (horizontal, vertical, diagonal).<br><br>📈 <b>“3 in a row”</b> — three numbers in order with a step of exactly 1: 2-3-4, 3-4-5, 4-3-2 — any direction, as long as the step never breaks. Four in a row (2-3-4-5) gives a rocket, five (1-2-3-4-5) gives a bomb.<br><br>➕ <b>“Make 10”</b> — a line of one colour whose numbers sum up to exactly 10: 3+4+3, 2+4+4, 5+3+2, 1+2+3+4. The whole line counts: if the line has four tiles, all four go into the sum. Points for such a line are fixed, so the target here is higher: 300 / 450 / 650.<br><br>Points are counted the same way everywhere: <b>sum of the line numbers × length factor</b> (3 tiles ×0.6, 4 — ×0.7, 5 — ×0.8, 6 — ×0.9, 7 — ×1.0) <b>× mode multiplier</b>. The pace is levelled across all three modes: a match on easy lasts 10–12 turns, on hard — 20–26.',

<script>/* Мат-Бум ДУЭЛЬ 2.0 — звук (WebAudio, из оригинального движка + новые эффекты) */
'use strict';
let AC = null, master = null, sndOn = true;
try { sndOn = localStorage.getItem('mbduel_sound') !== 'off'; } catch (e) {}

function audio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
    const g = AC.createGain(); g.gain.value = .012; g.connect(master);
    [55, 55.6, 110.3].forEach(f => { const o = AC.createOscillator(); o.frequency.value = f; o.type = 'sine'; o.connect(g); o.start(); });
  }
  if (AC.state === 'suspended') AC.resume();
}
function tone(f, dur, type, vol, slide, delay) {
  if (!sndOn || !AC) return;
  const t = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol || .2, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, hp) {
  if (!sndOn || !AC) return;
  const n = AC.sampleRate * dur | 0, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
const S = {

  triple: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'sawtooth', .12, 0, i * .06)); noise(.35, .1, 2200); },

  ai: () => { tone(330, .12, 'sine', .12); tone(247, .16, 'sine', .1, 0, .08); },
  err: () => { tone(220, .28, 'sawtooth', .1); tone(233, .28, 'sawtooth', .1); noise(.14, .05, 300); },
  reward: () => { [784, 1047, 1319].forEach((f, i) => tone(f, .18, 'triangle', .14, 0, i * .07)); },
  shuffle: () => { noise(.4, .16, 900); [740, 620, 520, 440, 370].forEach((f, i) => tone(f, .12, 'triangle', .08, 0, i * .05)); },
  hint: () => { tone(1200, .1, 'sine', .12); tone(1600, .14, 'sine', .1, 0, .09); },

  lose: () => { [392, 349, 294, 220].forEach((f, i) => tone(f, .3, 'sine', .15, 0, i * .16)); },
  draw: () => { [440, 466, 440].forEach((f, i) => tone(f, .25, 'sine', .12, 0, i * .14)); },

<script>/* Мат-Бум: адаптер платформы (Яндекс.Игры SDK с локальным фолбэком) */
'use strict';

function plDeadline(p, ms, msg) {
  let t;
  return Promise.race([p, new Promise((_, r) => { t = setTimeout(() => r(new Error(msg)), ms); })]).finally(() => clearTimeout(t));
}
function loadSdk(ms) {
  if (window.YaGames && typeof window.YaGames.init === 'function') return Promise.resolve(window.YaGames);
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = '/sdk.js'; s.async = true;
    const t = setTimeout(() => rej(new Error('sdk timeout')), ms || 6000);
    s.onload = () => { clearTimeout(t); window.YaGames ? res(window.YaGames) : rej(new Error('no YaGames')); };
    s.onerror = () => { clearTimeout(t); rej(new Error('sdk load failed')); };
    document.head.appendChild(s);
  });
}
function syncGameplay() {
  const api = PLAT.ysdk && PLAT.ysdk.features && PLAT.ysdk.features.GameplayAPI;
  if (!api) return;
  const should = gameplayWanted && !plPaused;
  try {
    if (should && !gameplayMarked) { api.start(); gameplayMarked = true; }
    else if (!should && gameplayMarked) { api.stop(); gameplayMarked = false; }
  } catch (e) {}
}
function gameReady() {
  try { PLAT.ysdk && PLAT.ysdk.features && PLAT.ysdk.features.LoadingAPI && PLAT.ysdk.features.LoadingAPI.ready(); } catch (e) {}
}

  try {

    await loadSdk();
    PLAT.ysdk = await plDeadline(window.YaGames.init(), 8000, 'SDK init timeout');
    const y = PLAT.ysdk;
    if (y.on) {
      y.on('game_api_pause', () => { plPaused = true; syncGameplay(); window.dispatchEvent(new Event('mb:pause')); });
      y.on('game_api_resume', () => { plPaused = false; syncGameplay(); window.dispatchEvent(new Event('mb:resume')); });
    }

    PLAT.lang = (String(env.lang || 'ru').toLowerCase().startsWith('ru')) ? 'ru' : 'en';

  } catch (e) { PLAT.ysdk = null; PLAT.player = null; }

<script>/* =====================================================================
   МАТ-БУМ ДУЭЛЬ 2.3 — сетевой слой (мультиплеер)
   Транспорт: VK Bridge Storage, если доступен; иначе localStorage
   (две вкладки одного браузера / демо-режим).
   Протокол:
     mbm_<code>  = { id, a:{nick}, b:{nick}|null, seed, lvl, board,
                     moves:[{r1,c1,r2,c2}], ended:'a'|'b'|null, ts }
     mbm_q_<i>   = { id, ts, lvl, board, nick }   — очередь «быстрой игры»
   Матч детерминирован: доска = newBoard(rng(seed)), ходы применяются строго
   по очереди, поэтому оба клиента видят одинаковое поле.
   ===================================================================== */
(function () {
  'use strict';

  const KEY = 'mbm_';
  const SLOTS = 8;
  const FRESH = 14000;              /* сколько мс запись в очереди считается живой */
  const STORE_LIMIT = 3800;         /* VK: не больше 4096 байт на значение */

  let bridge = null, checked = false;
  function getBridge() {
    if (checked) return bridge;
    checked = true;
    try {
      if (window.vkBridge && typeof window.vkBridge.send === 'function') bridge = window.vkBridge;
      else if (window.VKWebAppBridge && typeof window.VKWebAppBridge.send === 'function') bridge = window.VKWebAppBridge;
    } catch (e) { bridge = null; }
    return bridge;
  }
  function hasCloud() { return !!getBridge(); }

  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };

  /* --------------------------- транспорт --------------------------- */
  async function sget(k) {
    const b = getBridge();
    if (b) {
      try {
        const r = await b.send('VKWebAppStorageGet', { keys: [k] });
        const it = r && r.keys && r.keys[0];
        return it && it.value ? it.value : null;
      } catch (e) { /* падаем в локальное хранилище */ }
    }
    return LS.get(k);
  }
  async function sset(k, v) {
    if (typeof v === 'string' && v.length > STORE_LIMIT) return false;
    const b = getBridge();
    if (b) {
      try {
        await b.send('VKWebAppStorageSet', { key: k, value: v });
        return true;
      } catch (e) { /* fallback */ }
    }
    return LS.set(k, v);
  }
  async function jget(k) {
    const raw = await sget(k);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  async function jset(k, obj) {
    try { return await sset(k, JSON.stringify(obj)); } catch (e) { return false; }
  }

  /* ------------------------------ id ------------------------------- */
  function uid() {
    let u = null;
    try { u = sessionStorage.getItem('mbduel_sid'); } catch (e) {}
    if (!u) {
      u = 'u' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
      try { sessionStorage.setItem('mbduel_sid', u); } catch (e) {}
    }
    return u;
  }
  const ME = uid();
  const NICK = 'Игрок ' + ME.slice(-4).toUpperCase();

  function randCode() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)];
    return s;
  }
  function seedOf(code) {
    let h = 2166136261;
    for (let i = 0; i < code.length; i++) { h ^= code.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) || 1;
  }

  window.MBNet = {
    ME: ME, NICK: NICK, hasCloud: hasCloud, randCode: randCode, seedOf: seedOf,
    get: jget, set: jset, key: KEY, SLOTS: SLOTS, FRESH: FRESH, uid: uid
  };
})();
</script>
<script>/* =====================================================================
   МАТ-БУМ ДУЭЛЬ 2.9 — ядро игры (Match-3, без DOM)
   Поле 7x7, рефилл сверху, гравитация вниз, линии в 4 направлениях.
   Цвета: gold (игрок) / blue (ИИ). Номиналы 1..5.
   Очки: sum(values) × (0.6 + 0.1 × (len − 3)), комбо за каскад ×2/×3.
   Спецфишки: 4 в ряд — ракета (чистит ряд/столбец), 5+ — бомба (3×3).
   ===================================================================== */
(function (root) {
  'use strict';

  var N = 7;
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  var DIRS_HV = [[0, 1], [1, 0]];
  var GOLD = 'gold', BLUE = 'blue';
  var OTHER = { gold: 'blue', blue: 'gold' };
  var ID = 1;

  /* ============ 3.0: ПРАВИЛО МАТЧИНГА (глобал, читается всеми функциями) ============
     mode: 'same' — 3+ одинаковых числа одного цвета (классика)
           'seq'  — 3+ числа подряд по порядку (2-3-4 или 4-3-2)
           'sum'  — сумма цифр в линии = sumTarget (по умолчанию 10)
     seqStrict: true — только возрастание.
     bonus: множитель темпа, чтобы все три режима набирали очки примерно одинаково. */
  var RULE = {
    mode: 'same', sumTarget: 10, seqStrict: false,
    /* 3.0: множители подобраны симулятором (src/sim): «Собери 10» даёт
       в ~2.2 раза больше линий на доску, поэтому цена линии ниже,
       а цель выше — итоговый темп у всех трёх режимов одинаковый. */
    bonus: { same: 1.0, seq: 1.15, sum: 0.75 }
  };
  var TARGETS = { same: [80, 120, 180], seq: [80, 120, 180], sum: [300, 450, 650] };
  function scoreBonus() { return RULE.bonus[RULE.mode] || 1; }

  /* ------------------------------- utils ------------------------------- */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffleArr(arr, rand) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rand() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }
  function same(a, b) { return !!a && !!b && a.v === b.v && a.c === b.c; }
  function resetIds() { ID = 1; }
  function tile(v, c) { return { v: v, c: c, i: ID++ }; }

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < N; r++) { var row = []; for (var c = 0; c < N; c++) row.push(null); g.push(row); }
    return g;
  }
  function cloneGrid(g) {
    var out = [];
    for (var r = 0; r < N; r++) {
      var row = [];
      for (var c = 0; c < N; c++) {
        var t = g[r][c];
        if (!t) { row.push(null); continue; }
        var o = { v: t.v, c: t.c, i: t.i };
        if (t.sp) { o.sp = t.sp; o.rd = t.rd; }
        row.push(o);
      }
      out.push(row);
    }
    return out;
  }
  function countTiles(g) {
    var n = 0;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (g[r][c]) n++;
    return n;
  }
  function countColor(g, color) {
    var n = 0;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (g[r][c] && g[r][c].c === color) n++;
    return n;
  }

  /* ---------------------------- matching ------------------------------- */
  /* длина серии через клетку (r,c) в направлении (dr,dc), включая её саму */
  function runLen(g, r, c, dr, dc) {
    var t = g[r][c];
    if (!t) return 0;
    var n = 1, k, rr, cc, u;
    for (k = 1; k < N; k++) {
      rr = r - dr * k; cc = c - dc * k;
      if (!inside(rr, cc)) break;
      u = g[rr][cc];
      if (!u || u.v !== t.v || u.c !== t.c) break;
      n++;
    }
    for (k = 1; k < N; k++) {
      rr = r + dr * k; cc = c + dc * k;
      if (!inside(rr, cc)) break;
      u = g[rr][cc];
      if (!u || u.v !== t.v || u.c !== t.c) break;
      n++;
    }
    return n;
  }
  /* пара «подряд»: тот же цвет и разница ровно 1 */
  function isSeqPair(a, b, strict) {
    if (!a || !b || a.c !== b.c) return false;
    var d = b.v - a.v;
    if (Math.abs(d) !== 1) return false;
    if (strict && d < 0) return false;
    return true;
  }
  /* упорядоченный срез клеток вокруг (r,c) вдоль направления (для проверок «по месту») */
  function sliceAround(g, r, c, dr, dc, back, fwd) {
    var pre = [], post = [], k, rr, cc;
    for (k = 1; k <= back; k++) {
      rr = r - dr * k; cc = c - dc * k;
      if (!inside(rr, cc) || !g[rr][cc]) break;
      pre.push(g[rr][cc]);
    }
    for (k = 1; k <= fwd; k++) {
      rr = r + dr * k; cc = c + dc * k;
      if (!inside(rr, cc) || !g[rr][cc]) break;
      post.push(g[rr][cc]);
    }
    pre.reverse();
    return { arr: pre.concat([g[r][c]], post), k: pre.length };
  }
  /* валиден ли подотрезок arr[i..j] по текущему правилу (len >= 3) */
  function segOK(arr, i, j) {
    var len = j - i + 1, n, col, d, s2, sign;
    if (len < 3) return false;
    col = arr[i] ? arr[i].c : null;
    for (n = i; n <= j; n++) if (!arr[n] || arr[n].c !== col) return false;
    if (RULE.mode === 'seq') {
      sign = 0;
      for (n = i + 1; n <= j; n++) {
        d = arr[n].v - arr[n - 1].v;
        if (Math.abs(d) !== 1) return false;
        if (RULE.seqStrict && d < 0) return false;
        if (sign && d !== sign) return false;
        sign = d;
      }
      return true;
    }
    if (RULE.mode === 'sum') {
      s2 = 0;
      for (n = i; n <= j; n++) s2 += arr[n].v;
      return s2 === RULE.sumTarget;
    }
    for (n = i + 1; n <= j; n++) if (arr[n].v !== arr[i].v) return false;

  /* есть ли валидный прогон, проходящий через клетку (r,c) */
  function hasRunAt(g, r, c, dirs) {

    if (!g[r][c]) return false;
    for (var d = 0; d < dirs.length; d++) {
      var sl = sliceAround(g, r, c, dirs[d][0], dirs[d][1], 4, 4), arr = sl.arr, kk = sl.k, i, j;
      for (i = 0; i <= kk; i++) {

      }

  function lineAt(g, r, c, dirs) {
    dirs = dirs || DIRS;
    /* 3.0: у классики быстрый путь, у seq/sum — проверка по срезу */
    if (RULE.mode === 'same') {
      for (var d = 0; d < dirs.length; d++) {
        if (runLen(g, r, c, dirs[d][0], dirs[d][1]) >= 3) return true;
      }
      return false;
    }

  }

  function dirName(dr, dc) { return dr === 0 ? 'h' : (dc === 0 ? 'v' : (dc > 0 ? 'd1' : 'd2')); }
  function mkGroup(arr, cells, i, j, dn, nominal) {
    var vals = [], n;
    for (n = i; n <= j; n++) vals.push(arr[n].v);
    var sum = 0;
    for (n = 0; n < vals.length; n++) sum += vals[n];
    return {
      v: arr[i].v, c: arr[i].c, dir: dn,
      cells: cells.slice(i, j + 1), vals: vals,
      sum: nominal != null ? nominal : sum, nw: 1
    };
  }
  /* 3.0: поиск линий по правилу RULE.mode (или переданному rule).
     Проходим каждую линию доски от «головы», режем её на отрезки по правилу
     и отдаём валидные прогоны длиной 3+. */
  function findGroups(g, dirs, rule, sumTarget) {
    dirs = dirs || DIRS;
    var mode = rule || RULE.mode;
    var target = sumTarget || RULE.sumTarget;
    var out = [];
    for (var d = 0; d < dirs.length; d++) {
      var dr = dirs[d][0], dc = dirs[d][1], dn = dirName(dr, dc);
      for (var r = 0; r < N; r++) {
        for (var c = 0; c < N; c++) {
          if (!g[r][c]) continue;
          if (inside(r - dr, c - dc) && g[r - dr][c - dc]) continue;   /* не голова линии */
          var arr = [], cells = [], rr = r, cc = c;
          while (inside(rr, cc) && g[rr][cc]) { arr.push(g[rr][cc]); cells.push([rr, cc]); rr += dr; cc += dc; }
          if (arr.length < 3) continue;
          var k = 0;
          while (k < arr.length) {
            var e = k + 1, a, b, d2, sign = 0;
            if (mode === 'seq') {
              while (e < arr.length) {
                a = arr[e - 1]; b = arr[e]; d2 = b.v - a.v;
                if (a.c !== b.c || Math.abs(d2) !== 1) break;
                if (RULE.seqStrict && d2 < 0) break;
                if (sign && d2 !== sign) break;
                sign = d2; e++;
              }
            } else if (mode === 'sum') {
              while (e < arr.length && arr[e].c === arr[k].c) e++;
            } else {
              while (e < arr.length && arr[e].c === arr[k].c && arr[e].v === arr[k].v) e++;
            }
            if (mode === 'sum') {
              /* 3.0: линия = МАКСИМАЛЬНЫЙ отрезок фишек одного цвета (длина 3+),
                 сумма цифр которого ровно sumTarget. Скользящие окна внутри одного
                 отрезка не считаются отдельными линиями: иначе «Собери 10» даёт
                 в 4–5 раз больше линий, чем классика, и доска взрывается. */
              var tot = 0, n2;
              for (n2 = k; n2 < e; n2++) tot += arr[n2].v;
              if (tot === target && e - k >= 3) out.push(mkGroup(arr, cells, k, e - 1, dn, target));
            } else if (e - k >= 3) {
              out.push(mkGroup(arr, cells, k, e - 1, dn));
            }
