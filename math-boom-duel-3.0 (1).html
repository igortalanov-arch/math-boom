        for (var k = 0; k < gr.cells.length; k++) {
          if (hasCell(r2.cells, gr.cells[k][0], gr.cells[k][1])) { target = r2; break; }
        }
        if (target) break;
      }
      if (target) {
        for (var m = 0; m < gr.cells.length; m++) addCell(target, gr, m);
        target.nw += gr.nw;
        // трансляции: новая группа могла соединить две прежние
        var changed = true;
        while (changed) {
          changed = false;
          for (var a = 0; a < res.length && !changed; a++) {
            for (var b = a + 1; b < res.length && !changed; b++) {
              if (res[a].v !== res[b].v || res[a].c !== res[b].c) continue;
              var joined = false;
              for (var x = 0; x < res[b].cells.length; x++) {
                if (hasCell(res[a].cells, res[b].cells[x][0], res[b].cells[x][1])) { joined = true; break; }
              }
              if (joined) {
                for (var y = 0; y < res[b].cells.length; y++) addCell(res[a], res[b], y);
                res[a].nw += res[b].nw;
                res.splice(b, 1); changed = true;
              }
            }
          }
        }
      } else {
        res.push({
          v: gr.v, c: gr.c, cells: gr.cells.slice(), vals: gr.vals.slice(),
          dir: gr.dir, sum: gr.sum, nw: gr.nw
        });
      }
    }
    /* после склейки направление группы может стать «крестом»;
       2.9: диагонали тоже прямые — раньше они попадали в 'x' и рождали бомбу из трёх фишек */
    for (var q = 0; q < res.length; q++) {
      var cs0 = res[q].cells;
      var r0 = cs0[0][0], c0 = cs0[0][1], sr = true, sc = true, sd1 = true, sd2 = true;
      for (var z = 1; z < cs0.length; z++) {
        if (cs0[z][0] !== r0) sr = false;
        if (cs0[z][1] !== c0) sc = false;
        if (cs0[z][0] - cs0[z][1] !== r0 - c0) sd1 = false;
        if (cs0[z][0] + cs0[z][1] !== r0 + c0) sd2 = false;
      }
      res[q].dir = sr ? 'h' : (sc ? 'v' : (sd1 ? 'd1' : (sd2 ? 'd2' : 'x')));
    }
    return res;
  }

  /* 2.9: новая формула очков — sum(values) × (0.6 + 0.1 × (len − 3)).
     3×5 = 15×0.6 = 9; 4×5 = 20×0.7 = 14; 5×5 = 25×0.8 = 20. */
  function groupMul(len) { return Math.round((0.6 + 0.1 * Math.max(0, Math.min(len, 7) - 3)) * 100) / 100; }
  /* 3.0: sum(values) × groupMul(len) × scoreBonus(режим).
     В режиме sum линия по определению даёт sumTarget (× число склеенных окон). */
  function groupScore(gr) {
    var sum = 0, i;
    if (RULE.mode === 'sum') {
      sum = RULE.sumTarget * (gr.nw || 1);
    } else if (gr.vals && gr.vals.length) {
      for (i = 0; i < gr.vals.length; i++) sum += gr.vals[i];
    } else {
      sum = gr.v * gr.cells.length;
    }
    return Math.round(sum * groupMul(gr.cells.length) * scoreBonus());
  }
  /* 2.9: комбо за каскад — вторая волна ×2, третья и дальше ×3 */
  function comboMul(phase) { return phase <= 0 ? 1 : (phase === 1 ? 2 : 3); }

  /* ---------------------------- gravity -------------------------------- */
  function gravity(g) {
    var falls = [];
    for (var c = 0; c < N; c++) {
      var write = N - 1;
      for (var r = N - 1; r >= 0; r--) {
        var t = g[r][c];
        if (!t) continue;
        if (write !== r) {
          g[write][c] = t; g[r][c] = null;
          falls.push({ c: c, from: r, to: write, i: t.i });
        }
        write--;
      }
    }
    return falls;
  }

  /* ------------------------- рефилл (2.9) ------------------------------ */
  function pickColor(g, rand) {
    var b = countColor(g, BLUE), o = countColor(g, GOLD);
    if (b === o) return rand() < .5 ? GOLD : BLUE;
    return b < o ? BLUE : GOLD;
  }
  /* новые фишки падают сверху: цвет подбирается, чтобы сохранять равновесие сторон.
     quiet = true — «тихий» рефилл: новая фишка не собирает линию сразу,
     иначе на 7×7 каскады не заканчиваются и партия длится 3 хода. */
  function fillEmpty(g, rand, quiet) {
    var out = [];
    for (var c = 0; c < N; c++) {
      for (var r = N - 1; r >= 0; r--) {
        if (g[r][c]) continue;
        var col = pickColor(g, rand), v = 1 + Math.floor(rand() * 5);
        if (quiet) {
          var tries = 0;
          while (makesLineAt(g, r, c, v, col) && tries++ < 24) {
            v = 1 + Math.floor(rand() * 5);
            if (tries % 6 === 0) col = pickColor(g, rand);
          }
        }
        var t = tile(v, col);
        g[r][c] = t;
        out.push({ r: r, c: c, t: t });
      }
    }
    return out;
  }

  /* --------------------------- спецфишки ------------------------------- */
  function specialOf(gr) {
    if (gr.cells.length >= 5 || gr.dir === 'x') return 'bomb';
    if (gr.cells.length === 4) return 'rocket';
    return null;
  }
  function spawnCell(gr, swap) {
    if (swap) {
      for (var i = 0; i < swap.length; i++) {
        if (hasCell(gr.cells, swap[i][0], swap[i][1])) return swap[i];
      }
    }
    return gr.cells[Math.floor(gr.cells.length / 2)];
  }
  function blastCells(g, r, c, t) {
    var out = [], rr, cc;
    if (t.sp === 'bomb') {
      for (rr = r - 1; rr <= r + 1; rr++) for (cc = c - 1; cc <= c + 1; cc++) {
        if (inside(rr, cc)) out.push([rr, cc]);
      }
      return out;
    }
    if (t.sp === 'rocket') {
      if (t.rd === 'v') { for (rr = 0; rr < N; rr++) out.push([rr, c]); }
      else { for (cc = 0; cc < N; cc++) out.push([r, cc]); }
    }
    return out;
  }

  /* ---------------------------- resolve -------------------------------- */
  /* мутирует доску, возвращает план по фазам (для анимации) и очки.
     opts = { detail, refill, rand, dirs, swap } */
  function resolveInPlace(g, opts) {
    opts = opts || {};
    var dirs = opts.dirs || DIRS;
    var detail = !!opts.detail, refill = !!opts.refill, rand = opts.rand || Math.random;
    var phases = [], total = { gold: 0, blue: 0 };
    var swap = opts.swap || null;

    for (var guard = 0; guard < 48; guard++) {
      var groups = mergeGroups(findGroups(g, dirs));
      if (!groups.length) break;
      var combo = comboMul(guard);
      var pts = { gold: 0, blue: 0 };
      var spawnMap = {}, spawns = [], i, k;

      /* 1. какие спецфишки рождаются в этой волне */
      for (i = 0; i < groups.length; i++) {
        var gr = groups[i], sp = specialOf(gr);
        if (!sp) continue;
        var at = spawnCell(gr, guard === 0 ? swap : null);
        var key0 = at[0] + ':' + at[1];
        if (spawnMap[key0]) continue;
        spawnMap[key0] = { r: at[0], c: at[1], type: sp, rd: sp === 'rocket' ? (gr.dir === 'v' ? 'v' : 'h') : null, c2: gr.c, v: gr.v };
        spawns.push(spawnMap[key0]);
      }

      /* 2. что снимаем с доски */
      var clearSet = {}, order = [];
      var mark = function (r, c) {
        var kk = r + ':' + c;
        if (clearSet[kk]) return false;
        clearSet[kk] = 1; order.push([r, c]); return true;
      };
      for (i = 0; i < groups.length; i++) {
        pts[groups[i].c] += groupScore(groups[i]) * combo;
        for (k = 0; k < groups[i].cells.length; k++) {
          var cc0 = groups[i].cells[k];
          if (spawnMap[cc0[0] + ':' + cc0[1]]) continue;   /* тут остаётся спецфишка */
          mark(cc0[0], cc0[1]);
        }
      }

      /* 3. детонация спецфишек, попавших под снос (с цепной реакцией) */
      var queue = [], done = {};
      for (i = 0; i < order.length; i++) {
        var t0 = g[order[i][0]][order[i][1]];
        if (t0 && t0.sp) queue.push([order[i][0], order[i][1], t0]);
      }
      var blasts = [];
      while (queue.length) {
        var item = queue.shift();
        var br = item[0], bc = item[1], bt = item[2];
        if (done[bt.i]) continue;
        done[bt.i] = 1;
        var cells = blastCells(g, br, bc, bt), added = [], sum = 0;
        for (k = 0; k < cells.length; k++) {
          var rr = cells[k][0], cn = cells[k][1], u = g[rr][cn];
          if (!u) continue;
          if (mark(rr, cn)) { added.push([rr, cn]); sum += u.v; }
          if (u.sp && !done[u.i]) queue.push([rr, cn, u]);
        }
        if (added.length) {
          blasts.push({ type: bt.sp, rd: bt.rd, color: bt.c, at: [br, bc], cells: added });
          pts[bt.c] += Math.round(sum * 0.6) * combo;
        }
      }

      /* 4. снос + превращение в спецфишку */
      for (i = 0; i < spawns.length; i++) {
        var s0 = spawns[i], tt = g[s0.r][s0.c];
        if (tt) { tt.sp = s0.type; tt.rd = s0.rd; }
      }
      var removedTiles = [];
      for (i = 0; i < order.length; i++) {
        var pr = order[i][0], pc = order[i][1], tv = g[pr][pc];
        if (tv) removedTiles.push({ r: pr, c: pc, t: tv });
        g[pr][pc] = null;
      }

      /* 5. гравитация и рефилл */
      var falls = gravity(g);
      var refills = refill ? fillEmpty(g, rand, opts.quiet !== false) : [];

      total.gold += pts.gold; total.blue += pts.blue;
      if (detail) {
        phases.push({
          groups: groups, removed: order, spawns: spawns, blasts: blasts,
          falls: falls, refills: refills, pts: pts, combo: combo, phase: guard
        });
      }
      if (!refill && countTiles(g) === 0) break;
    }
    return { phases: phases, total: total };
  }

  function resolvePlan(grid, opts) {
    opts = opts || {};
    var g = cloneGrid(grid);
    var res = resolveInPlace(g, { detail: true, refill: !!opts.refill, rand: opts.rand, swap: opts.swap });
    res.grid = g;
    return res;
  }
  /* быстрый расчёт без анимации и без рефилла — для ИИ */
  function resolveFast(g, dirs) {
    return resolveInPlace(g, { fast: true, dirs: dirs }).total;
  }

  /* ----------------------------- swaps --------------------------------- */
  function swapCells(g, r1, c1, r2, c2) {
    var t = g[r1][c1]; g[r1][c1] = g[r2][c2]; g[r2][c2] = t;
  }
  /* соседство 8-клеточное: по горизонтали, вертикали И диагонали */
  function isAdjacent(r1, c1, r2, c2) {
    return r1 !== r2 || c1 !== c2 ? (Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1) : false;
  }
  function canSwap(g, r1, c1, r2, c2, color) {
    if (!inside(r1, c1) || !inside(r2, c2)) return { ok: false, why: 'bounds' };
    if (!isAdjacent(r1, c1, r2, c2)) return { ok: false, why: 'far' };
    var a = g[r1][c1], b = g[r2][c2];
    if (!a || !b) return { ok: false, why: 'empty' };
    if (same(a, b)) return { ok: false, why: 'same' };
    if (color && a.c !== color && b.c !== color) return { ok: false, why: 'enemy' };
    return { ok: true, why: '' };
  }

  var SWAP_DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

  /* 2.9: квоты сложности. L1 — «слепой» ИИ (не видит диагонали), L3 — с блокировкой.
     Точные проценты подобраны симулятором src/sim/levels29.js. */
  var AITUNE = {
    levels: {
      l1: { blind: true, blunder: .45, weak: 2 },
      l2: { blunder: .34, weak: 4, sabotage: true, sabChance: .15 },
      l3: { blunder: 0, cands: 3, slack: 0, sabotage: false, defense: 3, deny: .8, self: .3 }
    }
  };
  function allSwaps(g, color, ortho) {
    var dirs = ortho ? DIRS_HV : SWAP_DIRS;
    var out = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var a = g[r][c];
        if (!a) continue;
        for (var d = 0; d < dirs.length; d++) {
          var r2 = r + dirs[d][0], c2 = c + dirs[d][1];
          if (!inside(r2, c2)) continue;
          var b = g[r2][c2];
          if (!b || same(a, b)) continue;
          if (color && a.c !== color && b.c !== color) continue;
          out.push({ r1: r, c1: c, r2: r2, c2: c2 });
        }
      }
    }
    return out;
  }

  /* 2.9: быстрая оценка свапа. Сначала проверяем, появилась ли вообще линия
     (меняются только две клетки) — и только потом считаем каскад.
     Это убирает ~90 % тяжёлых resolve и снимает лаг L3. */
  function scoreSwap(grid, mv, dirs) {
    var d = dirs || DIRS;
    var a = grid[mv.r1][mv.c1], b = grid[mv.r2][mv.c2];
    if (!a || !b) return { gold: 0, blue: 0 };
    var g = cloneGrid(grid);
    g[mv.r1][mv.c1] = b; g[mv.r2][mv.c2] = a;
    if (!lineAt(g, mv.r1, mv.c1, d) && !lineAt(g, mv.r2, mv.c2, d)) return { gold: 0, blue: 0 };
    return resolveInPlace(g, { dirs: d }).total;
  }

  /* лучший свап для цвета: максимум своих очков, при равенстве — меньше отдаём врагу */
  function bestMove(grid, color, dirs) {
    var ortho = !!(dirs && dirs === DIRS_HV);
    var swaps = allSwaps(grid, color, ortho), best = null;
    for (var i = 0; i < swaps.length; i++) {
      var s = scoreSwap(grid, swaps[i], dirs);
      var own = s[color];
      if (own <= 0) continue;
      var opp = s[OTHER[color]];
      if (!best || own > best.score || (own === best.score && opp < best.opp)) {
        best = { move: swaps[i], score: own, opp: opp, total: s };
      }
    }
    return best;
  }

  function hasMove(grid, color, dirs) {
    var swaps = allSwaps(grid, color, !!(dirs && dirs === DIRS_HV));
    for (var i = 0; i < swaps.length; i++) {
      if (scoreSwap(grid, swaps[i], dirs)[color] > 0) return true;
    }
    return false;
  }

  function countMoves(grid, color, limit, dirs) {
    var swaps = allSwaps(grid, color, !!(dirs && dirs === DIRS_HV)), n = 0;
    for (var i = 0; i < swaps.length; i++) {
      if (scoreSwap(grid, swaps[i], dirs)[color] > 0) { n++; if (limit && n >= limit) return n; }
    }
    return n;
  }

  /* 2.9: «почему этот свап лучший» — для подсказки с объяснением */
  function explainMove(grid, mv, color) {
    var g = cloneGrid(grid);
    var a = g[mv.r1][mv.c1], b = g[mv.r2][mv.c2];
    if (!a || !b) return null;
    g[mv.r1][mv.c1] = b; g[mv.r2][mv.c2] = a;
    var groups = mergeGroups(findGroups(g)).filter(function (x) { return !color || x.c === color; });
    if (!groups.length) return null;
    var best = groups.slice().sort(function (p, q) { return q.cells.length - p.cells.length; })[0];
    var pts = 0, len = 0, sp = null;
    for (var i = 0; i < groups.length; i++) {
      pts += groupScore(groups[i]);
      if (groups[i].cells.length > len) { len = groups[i].cells.length; }
      var s = specialOf(groups[i]);
      if (s) sp = s;
    }
    /* 3.0: режимные данные — для подсказки и предсказания очков */
    var values = [], ch = [], gn;
    for (var q = 0; q < best.cells.length; q++) {
      var qc = best.cells[q], qt = g[qc[0]][qc[1]];
      if (qt) { values.push(qt.v); ch.push(qt.v); }
    }
    for (gn = 0; gn < groups.length; gn++) {
      if (groups[gn].vals && groups[gn].vals.length) groups[gn].vals = groups[gn].vals.slice();
    }
    return {
      score: pts, len: len, dir: best.dir, special: sp, groups: groups.length,
      total: resolveInPlace(g).total,
      mode: RULE.mode, sumTarget: RULE.sumTarget, values: values, chain: ch.join('·')
    };
  }

  /* ------------------------------ AI ----------------------------------- */
  function levelCfg(level) {
    return AITUNE.levels[
      level <= 1 ? 'l1' : (level === 2 ? 'l2' : 'l3')
    ] || AITUNE.levels.l3;
  }
  function aiMove(grid, level, rand) {
    rand = rand || Math.random;
    var cfg = levelCfg(level);
    var dirs = cfg.blind ? DIRS_HV : DIRS;
    var swaps = allSwaps(grid, BLUE, !!cfg.blind);
    if (!swaps.length) return null;

    var scored = [], i, s;
    for (i = 0; i < swaps.length; i++) {
      s = scoreSwap(grid, swaps[i], dirs);
      if (s.blue > 0) scored.push({ move: swaps[i], s: s });
    }
    scored.sort(function (a, b) {
      if (b.s.blue !== a.s.blue) return b.s.blue - a.s.blue;
      return a.s.gold - b.s.gold;
    });

    /* ---------- «слепой» L1: видит только горизонтали и вертикали ---------- */
    if (cfg.blind) {
      if (!scored.length) return swaps[Math.floor(rand() * swaps.length)];
      if (rand() < (cfg.blunder || 0)) return swaps[Math.floor(rand() * swaps.length)];
      var wspan = Math.min(cfg.weak || 1, scored.length);
      return scored[Math.floor(rand() * wspan)].move;
    }

    /* ---------- L2 ---------- */
    if (level <= 2) {
      if (!scored.length) {
        if (cfg.sabotage) {
          var sab1 = sabotageMove(grid, swaps, rand);
          if (sab1) return sab1;
        }
        return swaps[Math.floor(rand() * swaps.length)];
      }
      if (rand() < (cfg.blunder || 0)) return swaps[Math.floor(rand() * swaps.length)];
      if (cfg.sabotage && rand() < (cfg.sabChance || 0)) {
        var sab2 = sabotageMove(grid, swaps, rand);
        if (sab2) return sab2;
      }
      if (!cfg.weak) return scored[0].move;
      var span2 = Math.min(cfg.weak, scored.length);
      return scored[Math.max(0, span2 - 1 - Math.floor(rand() * span2))].move;
    }

    /* ---------- L3: блокирует лучший ход игрока ---------- */
    var cands = scored.slice(0, Math.min(cfg.cands, scored.length));

    if (cfg.defense) {
      var pBest0 = bestMove(grid, GOLD);
      if (pBest0) {
        var cells0 = [pBest0.move.r1 + ':' + pBest0.move.c1, pBest0.move.r2 + ':' + pBest0.move.c2];
        var inCands = {};
        for (i = 0; i < cands.length; i++) inCands[cands[i].move.r1 + ':' + cands[i].move.c1 + '>' + cands[i].move.r2 + ':' + cands[i].move.c2] = 1;
        var defs = [];
        for (i = 0; i < swaps.length; i++) {
          var sw = swaps[i], k1 = sw.r1 + ':' + sw.c1, k2 = sw.r2 + ':' + sw.c2;
          if (inCands[k1 + '>' + k2]) continue;
          if (cells0.indexOf(k1) < 0 && cells0.indexOf(k2) < 0) continue;
          defs.push({ move: sw, s: scoreSwap(grid, sw) });
        }
        defs.sort(function (a, b) { return a.s.gold - b.s.gold; });
        for (i = 0; i < defs.length && i < cfg.defense; i++) cands.push(defs[i]);
      }
    }
    if (!cands.length) return swaps[Math.floor(rand() * swaps.length)];
    var minOwn = scored.length ? scored[0].s.blue - (cfg.slack || 0) : 0;
    var sab = cfg.sabotage ? sabotageMove(grid, swaps, rand) : null;
    if (sab) cands.push({ move: sab, s: { gold: 0, blue: 0 }, sab: true });

    var bestVal = -1e9, pick = cands[0];
    var t0 = Date.now();
    for (i = 0; i < cands.length; i++) {
      var cd = cands[i];
      if (!cd.sab && cfg.deny === 0 && cd.s.blue < minOwn) continue;
      var g2 = cloneGrid(grid);
      swapCells(g2, cd.move.r1, cd.move.c1, cd.move.r2, cd.move.c2);
      resolveInPlace(g2);
      var pb = bestMove(g2, GOLD);
      var left = pb ? pb.score : 0;
      var next = 0;
      if (cfg.self) { var nb = bestMove(g2, BLUE); next = nb ? nb.score : 0; }
      var val = cd.s.blue + (cfg.self || 0) * next - (cfg.deny || 0) * left + (cd.sab ? (cfg.sabBonus || 0) : 0);
      if (val > bestVal + .001 || (Math.abs(val - bestVal) <= .001 && cd.s.blue > (pick ? pick.s.blue : -1))) {
        bestVal = val; pick = cd;
      }
      /* бюджет времени: на слабых телефонах не даём ИИ подвешивать кадр */
      if (Date.now() - t0 > 90 && i < cands.length - 1) break;
    }
    return pick.move;
  }

  /* свап, который не даёт ИИ очков, но максимально портит лучший ход игрока */
  function sabotageMove(grid, swaps, rand) {
    var pBest = bestMove(grid, GOLD);
    if (!pBest) return null;
    var best = null, i;
    for (i = 0; i < swaps.length; i++) {
      var s = scoreSwap(grid, swaps[i]);
      if (s.blue > 0) continue;
      if (s.gold > 0) continue;
      var g2 = cloneGrid(grid);
      swapCells(g2, swaps[i].r1, swaps[i].c1, swaps[i].r2, swaps[i].c2);
      resolveInPlace(g2);
      var pb = bestMove(g2, GOLD);
      var left = pb ? pb.score : 0;
      var gain = pBest.score - left;
      if (gain > 0 && (!best || gain > best.gain || (gain === best.gain && rand() < 0.35))) {
        best = { move: swaps[i], gain: gain, left: left };
      }
    }

/* ---------------------------- живая доска ---------------------------- */
function idleNow() { return performance.now() - lastAct; }
function busyUi() {
  return curScreen !== 'game' || !ST.grid || ST.busy || ST.over ||
    $('ov-pause').classList.contains('on') || $('ov-finale').classList.contains('on') ||
    TUT.on;
}
function startWave() {
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (let tries = 0; tries < 60; tries++) {
    const d = dirs[Math.floor(Math.random() * dirs.length)];
    const len = 3 + (Math.random() < .5 ? 0 : 1);
    const r0 = Math.floor(Math.random() * N), c0 = Math.floor(Math.random() * N);
    const cells = [];
    let ok = true;
    for (let i = 0; i < len; i++) {
      const r = r0 + d[0] * i, c = c0 + d[1] * i;
      if (r < 0 || r >= N || c < 0 || c >= N || !ST.grid[r][c]) { ok = false; break; }
      cells.push([r, c]);
    }
    if (ok) {
      WAVE = { cells: cells, t0: performance.now(), done: 0 };
      return;
    }
  }
}
function endWave() {
  if (!WAVE) return;
  WAVE.cells.forEach(([r, c]) => {
    const t = ST.grid && ST.grid[r] && ST.grid[r][c];
    if (t) { t.lift = 0; t.sc = 1; }
  });
  WAVE = null;
}
/* 3.0: «живая доска» с подпрыгиванием фишек отключена — игроков это раздражало.
   Доска остаётся спокойной; движение дают только реальные события: свап,
   падение, взрывы. */
const WAVE_ON = false;
function updateWave(now) {
  if (!WAVE_ON) { if (WAVE) endWave(); return; }
  if (busyUi()) { if (WAVE) endWave(); lastAct = Math.max(lastAct, now - WAVE_IDLE + 1200); return; }
  if (!WAVE) {
    if (now - lastAct > WAVE_IDLE) startWave();
    return;
  }
  const span = WAVE.cells.length * WAVE_STEP;
  const e = now - WAVE.t0;
  if (e > span + WAVE_GAP) { WAVE.t0 = now; return; }     /* пока игрок не тронул доску — повторяем */
  WAVE.cells.forEach(([r, c], i) => {
    const t = ST.grid[r] && ST.grid[r][c];
    if (!t) return;
    const p = (e - i * WAVE_STEP) / WAVE_STEP;
    if (p > 0 && p < 1) {
      t.lift = Math.sin(Math.PI * p) * V.ch * .86;
      t.sc = 1 + Math.sin(Math.PI * p) * .07;
    } else if (t.lift) { t.lift = 0; t.sc = 1; }
  });
}

/* ------------- кэш спрайтов фишек (быстрее, чем градиенты каждый кадр) --------- */
let SPR = { key: '', map: {} };
function spriteKey() { return PAL.id + '-' + Math.round(V.cw) + 'x' + Math.round(V.ch) + 'x' + Math.round(V.sh); }
function buildSprites() {
  const key = spriteKey();
  if (SPR.key === key) return;
  const cw = V.cw, ch = V.ch, sh = V.sh, th = ch * .17;
  const pad = Math.max(5, cw * .07);
  const W = Math.ceil(cw * 1.10 + pad * 2 + 2);
  const H = Math.ceil(ch + th + pad * 2 + 2);
  const map = {};
  /* верхняя грань — трапеция той же формы, что и клетка (верх чуть уже низа),
     нижние/боковые грани — смещение вниз-вправо на sh/th (как у наклонённой доски) */
  const topPts = (scale) => {
    const w1 = cw * .985 * scale, w2 = cw * 1.015 * scale, hh = ch * scale;
    return [
      { x: -w1 / 2, y: -hh / 2 }, { x: w1 / 2, y: -hh / 2 },
      { x: w2 / 2, y: hh / 2 }, { x: -w2 / 2, y: hh / 2 }
    ];
  };
  const pathOf = (ctx2, arr, rad) => {
    ctx2.beginPath();
    for (let i = 0; i < 4; i++) {
      const prev = arr[(i + 3) % 4], cur = arr[i], next = arr[(i + 1) % 4];
      const v1 = { x: prev.x - cur.x, y: prev.y - cur.y }, v2 = { x: next.x - cur.x, y: next.y - cur.y };
      const l1 = Math.hypot(v1.x, v1.y) || 1, l2 = Math.hypot(v2.x, v2.y) || 1;
      const rr = Math.min(rad, l1 * .45, l2 * .45);
      const a = { x: cur.x + v1.x / l1 * rr, y: cur.y + v1.y / l1 * rr };
      const b = { x: cur.x + v2.x / l2 * rr, y: cur.y + v2.y / l2 * rr };
      if (i === 0) ctx2.moveTo(a.x, a.y); else ctx2.lineTo(a.x, a.y);
      ctx2.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
    }
    ctx2.closePath();
  };
  ['gold', 'blue'].forEach(col => {
    const st = TS[col];
    for (let v = 1; v <= 5; v++) {
      const cv2 = document.createElement('canvas');
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv2.width = Math.ceil(W * dpr); cv2.height = Math.ceil(H * dpr);
      const g2 = cv2.getContext('2d');
      g2.scale(dpr, dpr);
      g2.translate(W / 2, pad + ch / 2);
      const T = topPts(1);
      const off = { x: sh * .55, y: th };
      const B = T.map(p => ({ x: p.x + off.x, y: p.y + off.y }));
      /* нижняя грань */
      g2.fillStyle = st.side; pathOf(g2, B, cw * .16); g2.fill();
      /* правая грань */
      g2.fillStyle = st.fside;
      g2.beginPath(); g2.moveTo(T[1].x, T[1].y); g2.lineTo(T[2].x, T[2].y);
      g2.lineTo(B[2].x, B[2].y); g2.lineTo(B[1].x, B[1].y); g2.closePath(); g2.fill();
      /* левая грань */
      g2.fillStyle = st.lside;
      g2.beginPath(); g2.moveTo(T[3].x, T[3].y); g2.lineTo(T[2].x, T[2].y);
      g2.lineTo(B[2].x, B[2].y); g2.lineTo(B[3].x, B[3].y); g2.closePath(); g2.fill();
      /* верхняя грань */
      const gr = g2.createLinearGradient(0, -ch / 2, 0, ch / 2);
      gr.addColorStop(0, st.top1); gr.addColorStop(1, st.top2);
      g2.fillStyle = gr; pathOf(g2, T, cw * .16); g2.fill();
      g2.strokeStyle = 'rgba(0,0,0,.16)'; g2.lineWidth = 1; g2.stroke();
      /* блик */
      g2.strokeStyle = st.line; g2.lineWidth = Math.max(1, cw * .018); g2.globalAlpha = .45;
      pathOf(g2, T.map(p => ({ x: p.x * .975, y: p.y * .94 })), cw * .14); g2.stroke(); g2.globalAlpha = 1;
      /* маркер цвета */
      g2.beginPath(); g2.arc(0, -ch * .36, cw * .027, 0, 7); g2.fillStyle = st.dot; g2.fill();
      /* цифра */
      const fs = cw * .44;
      g2.textAlign = 'center'; g2.textBaseline = 'middle';
      g2.font = '900 ' + fs + 'px "Segoe UI",Roboto,Arial,sans-serif';
      g2.fillStyle = 'rgba(0,0,0,.22)';
      g2.fillText(v, 0, fs * .09);
      g2.fillStyle = st.num;
      g2.fillText(v, 0, fs * .045);
      map[col + v] = { cv: cv2, w: W, h: H, pad: pad, ch: ch };
    }
  });
  SPR = { key: key, map: map };
}

function drawSlab() {
  const pad = .40, ext = V.ch * .46;
  const outer = [corner(-pad, -pad), corner(-pad, N - 1 + pad), corner(N - 1 + pad, N - 1 + pad), corner(N - 1 + pad, -pad)];
  const front = [outer[1], outer[2], { x: outer[2].x, y: outer[2].y + ext }, { x: outer[1].x, y: outer[1].y + ext }];
  const leftF = [outer[0], outer[1], { x: outer[1].x, y: outer[1].y + ext }, { x: outer[0].x, y: outer[0].y + ext }];
  const rightF = [outer[2], outer[3], { x: outer[3].x, y: outer[3].y + ext }, { x: outer[2].x, y: outer[2].y + ext }];
  /* мягкая тень под платформой */
  ctx.save();
  for (let i = 3; i >= 1; i--) {
    ctx.globalAlpha = .07 + .05 * (3 - i);
    ctx.fillStyle = '#000';
    const sp = V.cw * .07 * i;
    ctx.beginPath();
    roundPath(outer.map(p => ({ x: p.x + (i % 2 ? sp : -sp) * .25, y: p.y + ext + sp })), V.cw * (.22 + i * .03));
    ctx.fill();
  }
  ctx.restore();
  const quad = (pts, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); ctx.fill(); };
  /* торцы платформы: передняя и боковые грани */
  quad(rightF, PAL.slab.right);
  quad(leftF, PAL.slab.left);
  const gf = ctx.createLinearGradient(0, outer[1].y, 0, outer[1].y + ext);
  gf.addColorStop(0, PAL.slab.front[0]); gf.addColorStop(.35, PAL.slab.front[1]); gf.addColorStop(1, PAL.slab.front[2]);
  quad(front, gf);
  /* верх платформы */
  const g = ctx.createLinearGradient(0, outer[0].y, 0, outer[2].y);
  g.addColorStop(0, PAL.slab.top[0]); g.addColorStop(.5, PAL.slab.top[1]); g.addColorStop(1, PAL.slab.top[2]);
  ctx.fillStyle = g;
  ctx.beginPath(); roundPath(outer, V.cw * .22); ctx.fill();
  /* кант платформы (в обучении приглушаем, чтобы не спорил с затемнением) */
  const dimTut = (typeof TUT !== 'undefined' && TUT.on && TUT.step === 1);
  ctx.strokeStyle = dimTut ? 'rgba(255,255,255,.05)' : PAL.slab.rim;
  ctx.lineWidth = Math.max(1.6, V.cw * .02);
  ctx.stroke();
  /* световой кант по переднему ребру */
  ctx.beginPath(); ctx.moveTo(outer[1].x, outer[1].y + 1); ctx.lineTo(outer[2].x, outer[2].y + 1);
  ctx.strokeStyle = PAL.slab.edge; ctx.lineWidth = Math.max(1.2, V.cw * .014); ctx.stroke();
  /* внутренний кант */
  const inner0 = outer.map(p => ({ x: p.x + (V.ox - p.x) * .014, y: p.y + (V.oy - p.y) * .014 }));
  ctx.strokeStyle = PAL.slab.edge;
  ctx.lineWidth = Math.max(1, V.cw * .012);
  ctx.beginPath(); roundPath(inner0, V.cw * .21); ctx.stroke();
}
function drawSockets() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (ST.grid[r][c]) continue;
    const pts = quadOf(r, c, .90);
    const hole = pts.map(p => ({ x: p.x, y: p.y + V.ch * .05 }));
    ctx.fillStyle = 'rgba(2,5,12,.5)';
    ctx.beginPath(); roundPath(hole, V.cw * .15); ctx.fill();
    ctx.fillStyle = 'rgba(4,8,16,.55)';
    ctx.beginPath(); roundPath(pts, V.cw * .15); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    ctx.stroke();
  }
}
function drawTile(t, r, c) {
  const dr = t.or || 0, dc = t.oc || 0;
  const ap = t.ap == null ? 1 : t.ap;
  if (ap <= 0) return;
  let s = (t.sc || 1) * (0.55 + 0.45 * easeOut(clamp(ap, 0, 1)));
  let alpha = clamp(ap, 0, 1);
  if (TUT.on && TUT.step === 1 && TUT.lock && !tutIn(r, c)) alpha *= .16;
  if (t.pop > 0) {
    s *= 1 + .2 * Math.sin(Math.PI * t.pop);
    alpha *= 1 - Math.max(0, (t.pop - .55) / .45);
  }
  const rr = r + dr, cc = c + dc;
  /* эффект 1: squash & stretch при приземлении (−7% по вертикали, +5.5% по горизонтали) */
  const sqz = t.sq || 0;
  const sqx = 1 + .055 * sqz, sqy = 1 - .07 * sqz;
  const lift2 = t.lift || 0, s2 = s;
  /* тень */
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,.17)';
  const shq = quadOf(rr, cc, s * 1.06, 0).map(p => ({ x: p.x + V.cw * .035, y: p.y + V.ch * .13 }));
  ctx.beginPath(); roundPath(shq, V.cw * .18); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.20)';
  const shq2 = quadOf(rr, cc, s * 1.0, 0).map(p => ({ x: p.x + V.cw * .02, y: p.y + V.ch * .1 }));
  ctx.beginPath(); roundPath(shq2, V.cw * .16); ctx.fill();
  /* спрайт */

/* 3.0: rim light на фишках по краю доски — свет с внешней стороны */
function drawRim(r, c, s, alpha, lift, gr, gc) {

  if (gr === N - 1) seg.push([pts[3], pts[2]]);

/* ================= 2.9: отрисовка спецфишек ================= */
function drawSpecialMark(r, c, t, s, alpha, lift) {
  const pts = quadOf(r, c, s, lift || 0);
  const g = GLOW[t.c] || GLOW.gold;
  const pulse = .55 + .45 * Math.sin(performance.now() / 260 + t.i);
  const cx = (pts[0].x + pts[2].x) / 2, cy = (pts[0].y + pts[2].y) / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  /* светящаяся кромка плитки — цифра остаётся читаемой */
  ctx.beginPath(); roundPath(pts.map(p => ({ x: cx + (p.x - cx) * .86, y: cy + (p.y - cy) * .84 })), V.cw * .13 * s);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(' + g.core + ',' + (.6 + .4 * pulse) + ')';
  ctx.lineWidth = Math.max(2, V.cw * .06 * s);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  /* значок в левом верхнем углу: тёмный кружок для контраста + белый символ */

  const u = Math.max(5, V.cw * .105 * s);
  ctx.beginPath(); ctx.arc(bx, by, u * 1.15, 0, 7);
  ctx.fillStyle = 'rgba(10,14,22,.72)'; ctx.fill();
  ctx.strokeStyle = 'rgba(' + g.core + ',.9)'; ctx.lineWidth = Math.max(1.2, u * .16); ctx.stroke();
  ctx.fillStyle = '#fff';
  if (t.sp === 'rocket') {
    /* двойная стрелка: направление выстрела */
    const vert = t.rd === 'v';
    ctx.beginPath();
    for (let k = 0; k < 2; k++) {
      const o = (k - .5) * u * .95;
      if (vert) {
        ctx.moveTo(bx - u * .55, by + o + u * .30); ctx.lineTo(bx, by + o - u * .22); ctx.lineTo(bx + u * .55, by + o + u * .30);
      } else {

    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.4, u * .22); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {
      const a = k * Math.PI / 2 + Math.PI / 4;
      ctx.moveTo(bx + Math.cos(a) * u * .58, by + Math.sin(a) * u * .58);

}
/* подсветка ВСЕЙ плитки: тонируем верхнюю и боковые грани + рамка точно по силуэту */
/* заливка верхней грани плитки (боковые грани не трогаем — иначе подсветка

function tileTint(r, c, rgb, alpha, s) {

  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

function tileHighlight(r, c, kind, alpha) {
  if (!ST.grid || !ST.grid[r] || !ST.grid[r][c]) return;
  const a = Math.max(0, Math.min(1, alpha));
  if (kind === 'target') {
    /* только мягкая заливка верхней грани: никаких рамок над плиткой */
    tileTint(r, c, '255,255,238', .22 * a);
    return;
  }
  const dark = (typeof theme === 'undefined' || theme === 'dark');
  const map = {
    sel:  { rgb: '255,244,206', edge: dark ? 'rgba(255,255,255,.98)' : 'rgba(226,101,6,.92)', w: dark ? Math.max(3.2, V.cw * .045) : Math.max(3.2, V.cw * .05), fill: .40, glow: .95 },
    ai:   { rgb: '120,190,255', edge: dark ? 'rgba(228,244,255,.98)' : 'rgba(20,52,96,.80)', w: Math.max(2.6, V.cw * .05), fill: .30, glow: .60 },
    hint: { rgb: '120,255,185', edge: dark ? 'rgba(226,255,240,.98)' : 'rgba(8,88,58,.85)', w: Math.max(2.8, V.cw * .05), fill: .38, glow: .90 },
  };

  const pts = quadOf(r, c, 1, 0);

  ctx.beginPath(); roundPath(pts, rad); ctx.clip();
  /* лёгкая заливка всей верхней грани */
  ctx.globalAlpha = m.fill * a;
  ctx.fillStyle = 'rgb(' + m.rgb + ')';
  ctx.beginPath(); roundPath(pts, rad); ctx.fill();
  /* внутреннее свечение по кромке (мягкая «ступенька» из 4 колец) — цифра остаётся контрастной */
  ctx.strokeStyle = 'rgb(' + m.rgb + ')';

  for (let i = 0; i < 4; i++) {

    ctx.lineWidth = V.cw * (.06 + i * .07);
    ctx.beginPath(); roundPath(pts, rad); ctx.stroke();
  }
  ctx.restore();
  /* чёткая кромка точно по силуэту плитки */
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = m.edge;
  ctx.lineJoin = 'round';
  ctx.lineWidth = m.w;

}

/* =================== 2.2: эффект собранной линии ==================== */

function cellCenter(r, c) {
  const q = quadOf(r, c, 1, 0);
  return { x: (q[0].x + q[2].x) / 2, y: (q[0].y + q[2].y) / 2 };
}
/* максимальные прямые отрезки внутри группы: по ним рисуем «лучи» */
function runsOf(cells) {
  const set = new Set(cells.map(([r, c]) => r * 10 + c));
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]], out = [];
  for (const [r, c] of cells) for (const [dr, dc] of dirs) {
    if (set.has((r - dr) * 10 + (c - dc))) continue;      /* не начало отрезка */
    const run = []; let rr = r, cc = c;
    while (set.has(rr * 10 + cc)) { run.push([rr, cc]); rr += dr; cc += dc; }
    if (run.length >= 3) out.push(run);
  }
  return out;
}
/* 3.0: текст собранной линии — свой для каждого правила */
function rowText(gr, run) {
  const vals = run.map(([r, c]) => {
    const t = ST.grid && ST.grid[r] && ST.grid[r][c];
    return t ? t.v : 0;
  });
  if (PROG.rule === 'seq') return T('fx_seq', { s: vals.join('·') });
  if (PROG.rule === 'sum') return T('fx_sum', { s: vals.join('+'), t: vals.reduce((a, v) => a + v, 0) });
  return T('fx_row', { n: run.length });
}
/* свечение по линии + всплывающие «N в ряд» (цвет — по владельцу фишек) */
function pushMatchFx(groups) {
  let wi = 0;
  for (const gr of groups) {
    for (const run of runsOf(gr.cells)) {
      const a = cellCenter(run[0][0], run[0][1]);
      const b = cellCenter(run[run.length - 1][0], run[run.length - 1][1]);
      let dx = b.x - a.x, dy = b.y - a.y;
      const L = Math.hypot(dx, dy) || 1;
      dx /= L; dy /= L;
      const ext = V.cw * .36;
      BEAMS.push({
        x1: a.x - dx * ext, y1: a.y - dy * ext,
        x2: b.x + dx * ext, y2: b.y + dy * ext,
        color: gr.c, t: 0, life: .82
      });
      const quads = run.map(([r, c]) => quadOf(r, c, 1, 0));
      const xs = quads.map(q => (q[0].x + q[2].x) / 2);
      const topY = Math.min.apply(null, quads.map(q => Math.min(q[0].y, q[1].y)));
      WORDS.push({
        x: xs.reduce((s2, v) => s2 + v, 0) / xs.length, y: topY - V.ch * .48,
        text: rowText(gr, run), color: gr.c,
        t: -wi * .07, life: 1.10, rise: V.ch * .95
      });
      wi++;
    }
  }
}
function drawMatchFx() {
  /* лучи: растут из центра линии к её концам, потом истаивают */
  for (const b of BEAMS) {
    if (b.t <= 0) continue;
    const g = GLOW[b.color] || GLOW.gold;
    const grow = Math.min(1, b.t / .17);
    const fade = b.t > b.life - .2 ? Math.max(0, (b.life - b.t) / .2) : 1;
    const cx = (b.x1 + b.x2) / 2, cy = (b.y1 + b.y2) / 2;
    const x1 = cx + (b.x1 - cx) * grow, y1 = cy + (b.y1 - cy) * grow;
    const x2 = cx + (b.x2 - cx) * grow, y2 = cy + (b.y2 - cy) * grow;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = fade;
    const breathe = .9 + .1 * Math.sin(b.t * 26);
    /* ореол в цвете линии + яркая нить + тонкое ядро: «lighter» даёт именно свечение */
    const layers = [[.90, .10 * breathe, g.beam], [.52, .14 * breathe, g.beam], [.26, .18 * breathe, g.beam],
                    [.12, .24 * breathe, g.beam], [.055, .34 * breathe, g.core], [.018, .55 * breathe, '255,255,252']];
    for (const [w, al, col] of layers) {
      ctx.lineCap = w < .1 ? 'round' : 'butt';
      ctx.strokeStyle = 'rgba(' + col + ',' + al + ')';
      ctx.lineWidth = Math.max(2, V.cw * w);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    }
    ctx.restore();
  }
  /* «N в ряд»: медленно всплывает над линией и растворяется */
  for (const w of WORDS) {
    if (w.t <= 0) continue;
    const p = Math.min(1, w.t / w.life);
    const e = 1 - Math.pow(1 - Math.min(1, p / .85), 2.2);
    const g = GLOW[w.color] || GLOW.gold;
    const size = Math.max(19, V.cw * .46);
    const y = Math.max(V.safeTop + size * .8, w.y - w.rise * e);
    const alpha = p < .6 ? Math.min(1, w.t / .12) : Math.max(0, 1 - (p - .6) / .4);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + size + 'px "Segoe UI",Roboto,Arial,sans-serif';
    ctx.lineWidth = Math.max(3, size * .2);
    ctx.strokeStyle = g.ink;
    ctx.strokeText(w.text, w.x, y);
    ctx.shadowColor = g.halo; ctx.shadowBlur = size * .85;
    ctx.fillStyle = g.word; ctx.fillText(w.text, w.x, y);
    ctx.shadowBlur = 0;
    ctx.fillText(w.text, w.x, y);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

  for (const p of PARTICLES) {

  tickTimer();
  TIMER = setInterval(() => {
    if (curScreen !== 'game' || ST.over) { tickTimer(); return; }
    if ($('ov-pause') && $('ov-pause').classList.contains('on')) { ST.t0 += 1000; return; }
    ST.secs = Math.round((Date.now() - ST.t0) / 1000);
    tickTimer();
  }, 1000);
}

function other(c) { return c === 'gold' ? 'blue' : 'gold'; }

function resetMatchState() {
  ST.score = { gold: 0, blue: 0 };
  ST.turn = 'gold'; ST.over = false; ST.busy = true; ST.selected = null; ST.hint = null;
  ST.rew = { gold: { h: 3, s: 1 }, blue: { h: 3, s: 1 } };
  ST.hints = 3; ST.shuffles = 1; ST.streak = 0; ST.moves = 0; ST.trainStep = 0;
  ST.finished = false; ST.aiPair = null; ST.hintPair = null; ST.tutLock = null;
  ST.started = Date.now(); ST.lastGain = 0;
  ST.undo = null; ST.undoLeft = 1;
  /* 3.0: статистика партии для достижений и эффектов */
  ST.halfToast = false; ST.newAch = [];
  ST.maxCombo = 1; ST.maxLen = 0; ST.rockets = 0; ST.bombs = 0;
  ST.maxWaves = 0; ST.specTurn = 0; ST.usedAd = false;
  E.resetIds(); clearFx(); closeAllOv();
}
function prepTiles(grid) {
  grid.forEach(row => row.forEach(t => {
    if (t) { t.or = 0; t.oc = 0; t.sc = 1; t.ap = 0; t.lift = 0; t.pop = 0; t.sq = 0; t.blm = 0; }
  }));
  return grid;
}
function startMatch(rival, levelIdx, mode) {
  MODE = mode || 'solo'; ST.mode = MODE;
  ST.training = false; TUT.on = false; TUT.step = 0;
  ST.rival = rival;
  ST.level = clamp(levelIdx == null ? PROG.level : levelIdx, 0, 2);
  /* 3.0: правило из PROG + своя цель под режим */
  E.setRule(PROG.rule, 10);
  ST.target = E.targetFor(PROG.rule, ST.level);
  resetMatchState();
  ST.grid = prepTiles(E.newBoard(Math.random));
  $('b-finish').hidden = true;
  hudMode();
  showScreen('game');
  paintRivalHUD(); paintHUD(); layoutCanvas(); paintRuleUI();
  startTimer();
  gameIntro();
}
async function gameIntro() {
  idleTouch();
  await tween(620, p => {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = ST.grid[r][c]; if (!t) continue;
      t.ap = clamp((p - (r * .05 + c * .022)) / .55, 0, 1);
    }
  });
  if ($('ov-tut').classList.contains('on') && !TUT.on) { ST.busy = true; paintHUD(); return; }
  await beginTurn();
}
function idleTouch() {
  lastAct = performance.now();
  if (WAVE) endWave();
}
async function beginTurn() {
  if (ST.over) { ST.busy = false; paintHUD(); return; }
  if (TUT.on) { ST.busy = TUT.step !== 1; paintHUD(); return; }
  if ($('ov-tut').classList.contains('on')) { ST.busy = true; paintHUD(); return; }
  if (ST.mode === 'hot') {
    paintTurnBanner();
    ST.busy = true; paintHUD();
    if (!await ensureMove(ST.turn)) return;
    ST.busy = false; paintHUD(); idleTouch();
    return;
  }
  if (ST.mode === 'mp') {
    paintTurnBanner();
    if (!MP.myTurn()) { ST.busy = true; paintHUD(); MP.startPoll(); return; }
    ST.busy = true; paintHUD();
    if (!await ensureMove(MP.color())) return;
    ST.busy = false; paintHUD(); idleTouch();
    return;
  }
  if (ST.turn === 'gold') {
    setBanner('p');
    if (!await ensureMove('gold')) return;
    ST.busy = false; paintHUD(); idleTouch();
  } else {
    setBanner('ai');
    ST.busy = true; paintHUD();
    await sleep(420);
    await aiTurn();
  }
}
async function ensureMove(color) {
  if (color === 'ai') color = 'blue';
  if (E.hasMove(ST.grid, color)) return true;
  /* 2.5: ходов на линии нет — доска перемешивается заново и раскладывается так,
     чтобы вариант был и у игрока, и у соперника. Партия заканчивается по «ходам нет»
     только если фишек на доске уже физически не хватает на линию. */
  if (E.countTiles(ST.grid) < 6) { endMatch(compareWinner(), 'dead'); return false; }
  let ok = false;
  for (let k = 0; k < 3 && !ok; k++) {
    const before = snapshotPositions();
    /* 2.3: в онлайне автошейк обязан совпасть у обоих — сид из номера события */
    const seed = (ST.mode === 'mp') ? MP.rsSeed(MP.seq) : 0;
    const applied = ST.mode === 'mp'
      ? E.reshuffle(ST.grid, E.rng(seed))
      : E.reshuffle(ST.grid, Math.random);
    if (!applied) break;
    if (ST.mode === 'mp') await MP.pushEvent({ rs: 1 });
    await animateShuffle(before);
    ok = E.hasMove(ST.grid, color) && E.hasMove(ST.grid, E.OTHER[color]);
  }
  if (ok) { sfx('shuffle'); toast(T(color === 'gold' ? 'toast_nomoves' : 'toast_ai_nomoves')); return true; }
  endMatch(compareWinner(), 'dead');
  return false;
}
function snapshotPositions() {
  const m = {};
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const t = ST.grid[r][c]; if (t) m[t.i] = { r, c }; }
  return m;
}
async function animateShuffle(before) {
  const list = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = ST.grid[r][c];
    if (t && before[t.i]) {
      t.fr = before[t.i].r; t.fc = before[t.i].c; t.tr = r; t.tc = c;
      list.push(t);
    }
  }
  if (!list.length) return;
  await tween(320, p => {
    const e = easeInOut(p);
    list.forEach(t => {
      t.or = (t.fr - t.tr) * (1 - e); t.oc = (t.fc - t.tc) * (1 - e);
      t.lift = Math.sin(Math.PI * p) * V.ch * .35;
      t.sc = 1 + Math.sin(Math.PI * p) * .06;
    });
  });
  list.forEach(t => { t.or = t.oc = t.lift = 0; t.sc = 1; });
}
async function animateSwapTiles(a, b, mv, dur) {
  const ar = mv.r1, ac = mv.c1, br = mv.r2, bc = mv.c2;
  let lastP = 0;
  await tween(dur, p => {
    const e = easeInOut(p), l = Math.sin(Math.PI * p) * V.ch * .18;
    a.or = (br - ar) * e; a.oc = (bc - ac) * e; a.lift = l;
    b.or = (ar - br) * e; b.oc = (ac - bc) * e; b.lift = l;
    /* 3.0 (эффект 12): лёгкий след из затухающих частиц */
    if (p - lastP > .26 || lastP === 0) {
      lastP = p;
      [[a, ar, ac], [b, br, bc]].forEach(([t, r0, c0]) => {
        if (!t) return;
        const cc0 = cellCenter(r0 + (t.or || 0), c0 + (t.oc || 0));
        const sp = (t.c === 'gold' ? PAL.p : PAL.a).spark;
        for (let k = 0; k < 2; k++) {
          PARTICLES.push({
            x: cc0.x + (Math.random() - .5) * V.cw * .34,
            y: cc0.y + (Math.random() - .5) * V.ch * .34,
            vx: (Math.random() - .5) * 26, vy: (Math.random() - .5) * 26,
            life: .15 + Math.random() * .12, max: .27,
            size: V.cw * (.045 + Math.random() * .04),
            g: 0, dr: .90,
            color: sp[Math.random() < .5 ? 0 : 1]
          });
        }
      });
    }
  });
  a.or = a.oc = a.lift = 0; b.or = b.oc = b.lift = 0;
}
async function performSwap(mv, who) {
  idleTouch(); ST.busy = true; ST.selected = null; ST.hint = null; paintHUD();
  const a = ST.grid[mv.r1][mv.c1], b = ST.grid[mv.r2][mv.c2];
  if (!a || !b) return 0;
  sfx('swap');
  await animateSwapTiles(a, b, mv, 165);
  E.swapCells(ST.grid, mv.r1, mv.c1, mv.r2, mv.c2);
  /* 2.9: рефилл + спецфишки. В онлайне генератор новых фишек детерминированный —
     сид считается из кода партии и номера хода, а не из MP.seq (у хоста и гостя
     он меняется в разном порядке и доски разъезжались). */
  const refRand = (ST.mode === 'mp')
    ? E.rng((MBNet.seedOf(MP.code || 'X') ^ Math.imul(ST.moves + 1, 2654435761)) >>> 0)
    : Math.random;
  const plan = E.resolvePlan(ST.grid, { refill: true, rand: refRand, swap: [[mv.r1, mv.c1], [mv.r2, mv.c2]] });
  /* новые фишки уже лежат в плане — до анимации прячем их, чтобы не появлялись раньше времени */
  plan.phases.forEach(ph => ph.refills.forEach(x => { x.t.ap = 0; x.t.or = 0; }));
  /* 2.6: who может быть 'ai' — очки считаются по цвету, иначе gained всегда undefined
     и ИИ никогда не получал вторую сборку */
  const col = (who === 'ai') ? 'blue' : who;
  const gained = plan.total[col] || 0;
  ST.lastGain = gained;
  ST.lastCombo = plan.phases.reduce((m, ph) => Math.max(m, ph.combo || 1), 1);
  if (plan.phases.length) await runPhases(plan.phases);
  ST.moves++;
  return gained;
}
async function runPhases(phases) {
  ST.maxWaves = Math.max(ST.maxWaves || 0, phases.length);
  for (let i = 0; i < phases.length; i++) {
    const ph = phases[i];
    ST.maxCombo = Math.max(ST.maxCombo || 1, ph.combo || 1);
    ph.groups.forEach(gr => { ST.maxLen = Math.max(ST.maxLen || 0, gr.cells.length); });
    /* 2.9: комбо за каскад + 3.0: плашка «🔥 ×N» в углу */
    if (ph.combo > 1) { toast(T('toast_cascade_x', { x: ph.combo })); sfx('cascade', ph.combo); showComboBadge(ph.combo); }
    else if (i > 0) { toast(T('toast_cascade')); sfx('cascade', i); }
    /* эффект 3: slow-motion на большом каскаде (×3 и выше) */
    if ((ph.combo || 1) >= 3) SLOW.t = 200;
    const maxLen = Math.max.apply(null, ph.groups.map(g => g.cells.length));
    if (maxLen >= 4) sfx('triple'); else sfx('clear', ph.groups[0] ? ph.groups[0].v : 3);
    /* 2.2: сначала «любуемся» линией — свечение + «N в ряд», плитки ещё на месте */
    pushMatchFx(ph.groups);
    if (ph.combo > 1) pushComboFx(ph.combo);
    await sleep(560);
    ph.groups.forEach(gr => {
      const cs = gr.cells;
      let sr = 0, sc = 0;
      cs.forEach(([r, c]) => { sr += r; sc += c; });
      floatAt(sr / cs.length, sc / cs.length, '+' + gr.pts, gr.c);
    });
    /* 2.9: спецфишка рождается в клетке и остаётся на доске */
    let mySpecials = 0;
    ph.spawns.forEach(sp => {
      const t = ST.grid[sp.r] && ST.grid[sp.r][sp.c];
      if (t) { t.sp = sp.type; t.rd = sp.rd; t.born = 1; }
      burstAt(sp.r, sp.c, sp.c2);
      sfx(sp.type === 'bomb' ? 'boom' : 'rocket');
      if (sp.c2 === myColor()) {
        mySpecials++;
        if (sp.type === 'rocket') ST.rockets = (ST.rockets || 0) + 1;
        else ST.bombs = (ST.bombs || 0) + 1;
      }
    });
    ST.specTurn = Math.max(ST.specTurn || 0, mySpecials);
    /* 2.9: детонация ракет и бомб */
    ph.blasts.forEach(b => pushBlastFx(b));
    if (ph.blasts.length) {
      sfx('boom');
      /* эффект 5: тряска экрана при детонации бомбы */
      if (ph.blasts.some(b => b.type === 'bomb')) shakeScreen(4, 150);
      else shakeScreen(2, 110);
      await sleep(120);
    }
    const tiles = ph.removed.map(([r, c]) => ST.grid[r][c]).filter(Boolean);
    ph.removed.forEach(([r, c]) => burstAt(r, c, ST.grid[r][c] ? ST.grid[r][c].c : 'gold'));
    /* эффект 6: цифры «расцветают» на 150 мс перед сбросом */
    ph.removed.forEach(([r, c]) => { const t = ST.grid[r][c]; if (t) t.blm = 1; });
    await tween(200, p => { tiles.forEach(t => { t.pop = p; }); });
    ph.removed.forEach(([r, c]) => { ST.grid[r][c] = null; });
    /* очки */
    ST.score.gold += ph.pts.gold; ST.score.blue += ph.pts.blue;
    paintHUD();
    if (ph.pts.gold || ph.pts.blue) bumpScore(ph.pts.gold ? 'gold' : 'blue');
    /* падение */
    if (ph.falls.length) {
      const byId = {};
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const t = ST.grid[r][c]; if (t) byId[t.i] = t; }
      let maxD = 1;
      ph.falls.forEach(f => {
        const t = byId[f.i];
        if (t) { t.or0 = f.from - f.to; t.or = t.or0; t.oc = 0; maxD = Math.max(maxD, f.from - f.to); }
      });
      E.gravity(ST.grid);
      const moving = ph.falls.map(f => byId[f.i]).filter(Boolean);
      sfx('fall', maxD);
      await tween(150 + maxD * 55, p => {
        const e = easeIn(p);
        moving.forEach(t => { t.or = (t.or0 || 0) * (1 - e); });
      });
      moving.forEach(t => { t.or = 0; t.or0 = 0; t.sq = 1; });
      /* эффект 2: пыль при приземлении */
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const t = ST.grid[r][c];
        if (t && moving.indexOf(t) >= 0) dustAt(r, c, t.c, 3);
      }
    }
    /* 2.9: рефилл — новые фишки ссыпаются сверху */
    if (ph.refills.length) {
      ph.refills.forEach(x => { ST.grid[x.r][x.c] = x.t; x.t.ap = 0; x.t.or = -3.2; });
      sfx('fall', 3);
      await tween(210, p => {
        const e = easeOut(p);
        ph.refills.forEach(x => { x.t.ap = e; x.t.or = -3.2 * (1 - e); });
      });
      ph.refills.forEach(x => { x.t.ap = 1; x.t.or = 0; x.t.sq = 1; });
      ph.refills.forEach(x => { if (Math.random() < .55) dustAt(x.r, x.c, x.t.c, 2); });
    }
    await sleep(40);
  }
}
/* 2.9: эффект детонации — ракета чистит ряд/столбец, бомба — квадрат 3×3 */

/* ------------------------------- ходы -------------------------------- */
/* 2.6: правило двух сборок — одинаковое для игрока и для соперника во всех режимах.
   Собрал линию — ход остаётся, можно собрать вторую как награду; после второй ход переходит. */
function streakAfter(mover, gained) {
  if (!gained) { ST.streak = 0; return false; }
  ST.streak++;

  return true;
}
/* 2.6: лог ходов для автотестов (в браузере его нет) */
function logMove(mover, gained, keep) {

}
function afterMove(mover, gained) {

  } else {
    ST.turn = other(mover);

  }

}
function checkEnd() {
  if (ST.over) return true;
  if (TUT.on) return false;
  const g = ST.score.gold, b = ST.score.blue;
  if (g >= ST.target || b >= ST.target) {
    endMatch(g === b ? 'draw' : (g > b ? 'gold' : 'blue'), 'target');
    return true;
  }
  /* 2.9: доска пополняется, поэтому «фишки кончились» — только аварийный случай */

}

}
async function aiTurn() {
  let guard = 0;
  while (ST.turn === 'blue' && !ST.over && guard++ < 8) {
    if (!await ensureMove('blue')) return;
    const mv = E.aiMove(ST.grid, LEVELS[ST.level].ai, Math.random);
    if (!mv) { ST.turn = 'gold'; break; }
    await highlightPair(mv, 'blue');
    const gained = await performSwap(mv, 'ai');
    if (checkEnd()) return;
    const keepAI = streakAfter('blue', gained);
    if (keepAI) {
      ST.turn = 'blue';
      toast(ST.lastCombo > 1 ? T('toast_cascade_x', { x: ST.lastCombo }) : T('toast_combo'));
    } else {
      ST.turn = 'gold';

async function highlightPair(mv, color) {

function endMatch(winner, reason) {
  if (ST.over && ST.finished) return;
  ST.finished = true;
  ST.over = true; ST.busy = true; ST.selected = null; ST.hint = null;
  if (WAVE) endWave();
  paintHUD();
  MP.stopPoll();
  const g = Math.round(ST.score.gold), b = Math.round(ST.score.blue);

  if (ST.mode === 'hot') {                       /* двое за одним устройством */
    sfx(winner === 'gold' ? 'win' : (winner === 'blue' ? 'lose' : 'draw'));
    setTimeout(() => showFinale(winner, reason, g, b), 520);
    return;
  }
  if (ST.mode === 'mp') {                        /* онлайн-дуэль */
    const mine = MP.color();
    const win = winner === mine;
    if (winner !== 'draw') {
      const mp = PROG.mp = PROG.mp || { rating: 1000, w: 0, l: 0 };
      if (win) { mp.rating = clamp((mp.rating || 1000) + 12, 0, 9999); mp.w = (mp.w || 0) + 1; }
      else { mp.rating = clamp((mp.rating || 1000) - 8, 0, 9999); mp.l = (mp.l || 0) + 1; }
      saveProg();
    }
    sfx(win ? 'win' : (winner === 'draw' ? 'draw' : 'lose'));
    MP.finish(winner);
    setTimeout(() => showFinale(winner, reason, g, b), 520);
    return;
  }

  const win = winner === 'gold';
  if (win) {
    sfx('win');
    /* 3.0: победы и рекорды пишутся в ветку текущего правила */
    const rl = PROG.wins[PROG.rule] || (PROG.wins[PROG.rule] = {});
    const bl = PROG.best[PROG.rule] || (PROG.best[PROG.rule] = {});
    rl[ST.rival] = (rl[ST.rival] || 0) + 1;

/* 2.9: подсказка объясняет, ПОЧЕМУ свап лучший */
function hintReason(mv, col) {
  const ex = E.explainMove(ST.grid, mv, col);
  if (!ex) return T('toast_hint');
  const dirKey = ex.dir === 'h' ? 'dir_h' : (ex.dir === 'v' ? 'dir_v' : 'dir_d');
  let sp = '';
  if (ex.special === 'rocket') sp = ' ' + T('hint_sp_rocket');
  else if (ex.special === 'bomb') sp = ' ' + T('hint_sp_bomb');
  /* 3.0: тексты по правилу — последовательность и сумма объясняются словами */
  const mode = ex.mode || PROG.rule;
  if (mode === 'seq') return T('hint_seq', { s: ex.chain || '', dir: T(dirKey), p: ex.score }) + sp;
  if (mode === 'sum') return T('hint_sum', { s: (ex.values || []).join('+'), t: ex.sumTarget || 10, dir: T(dirKey), p: ex.score }) + sp;
  return T('hint_reason', { n: ex.len, dir: T(dirKey), p: ex.score }) + sp;
}
function showHint() {
  const col = myColor();
  const b = E.bestMove(ST.grid, col);
  if (!b) {
    toast(T('toast_nomoves'));
    return false;
  }
  ST.hint = { a: [b.move.r1, b.move.c1], b: [b.move.r2, b.move.c2], until: performance.now() + 8000 };
  ST.hintPair = [b.move.r1 * N + b.move.c1, b.move.r2 * N + b.move.c2];
  sfx('hint');
  toast(hintReason(b.move, col), 5400);
  setTimeout(() => { if (ST.hint && performance.now() >= ST.hint.until) ST.hint = null; }, 8200);

}

/* -------------------------------- ввод ------------------------------- */
function pickCell(x, y) {
  if (!V.cw) return null;
  const rr = Math.round((y - V.oy) / V.ch + CTR);
  if (rr < 0 || rr > N - 1) return null;
  const kk = kRow(rr);
  const cc = Math.round((x - V.ox - (rr - CTR) * V.sh) / (V.cw * kk) + CTR);
  if (cc < 0 || cc > N - 1) return null;
  return { r: rr, c: cc };
}
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
let pointer = { down: false, cell: null, moved: false, x0: 0, y0: 0 };
/* 2.4: правило свапа в дуэли —
     • своя  + своя   — можно;
     • своя  + чужая  — можно;
     • чужая + чужая  — НИКОГДА (ни игрок, ни ИИ).
   Реализовано в ядре: canSwap(..., color) и allSwaps(grid, color). */

  if (ST.mode === 'hot') return ST.turn;
  if (ST.mode === 'mp') return MP.color();

}

  if (curScreen !== 'game' || ST.busy || ST.over) return false;
  if (TUT.on) return !!TUT.can;

  if (ST.mode === 'mp') return MP.myTurn();
  return ST.turn === 'gold';
}
/* ад, в котором нельзя двигать фишки в туториале */
function tutBlocks(r, c) {
  if (!TUT.on || TUT.step !== 1 || !TUT.lock) return false;
  return !(TUT.lock.some(p => p[0] === r && p[1] === c));
}
function playerTrySwap(r1, c1, r2, c2) {
  const who = myColor();
  if (TUT.on && TUT.step === 1 && TUT.lock) {
    const okPair = (tutIn(r1, c1) && tutIn(r2, c2));
    if (!okPair) { sfx('err'); toast(T('tut_need_pair')); return false; }
  }
  if (TUT.on && TUT.step === 2 && TUT.need) {
    const same = ((r1 === TUT.need[0][0] && c1 === TUT.need[0][1] && r2 === TUT.need[1][0] && c2 === TUT.need[1][1]) ||
                  (r2 === TUT.need[0][0] && c2 === TUT.need[0][1] && r1 === TUT.need[1][0] && c1 === TUT.need[1][1]));
    if (!same) { sfx('err'); toast(T('tut_need_hint')); return false; }
  }
  const chk = E.canSwap(ST.grid, r1, c1, r2, c2, who);
  if (chk.ok) { playerMove({ r1: r1, c1: c1, r2: r2, c2: c2 }); return true; }
  if (chk.why === 'enemy') { sfx('err'); toast(T('toast_enemy_swap')); }
  return false;
}

  /* второй тап по соседней (в т.ч. диагональной) фишке — свап */
  if (ST.selected) {

    /* 2.4: правило цвета — в свапе обязательно участвует СВОЯ фишка */
    const chk = E.canSwap(ST.grid, sel.r, sel.c, cell.r, cell.c, myColor());
    if (chk.ok) {

cv.addEventListener('pointermove', e => {

    if (key !== PRE.key) {
      PRE.key = key;

  if (E.isAdjacent(from.r, from.c, cell.r, cell.c)) {
    playerTrySwap(from.r, from.c, cell.r, cell.c);            /* свайп, в т.ч. по диагонали */

async function playerMove(mv) {
  if (ST.busy || ST.over) return;
  if (!canPlay()) return;
  const who = myColor();
  /* 2.4: последний барьер — игрок никогда не двигает две фишки соперника */
  const legal = E.canSwap(ST.grid, mv.r1, mv.c1, mv.r2, mv.c2, who);
  if (!legal.ok) {
    sfx('err');
    if (legal.why === 'enemy') toast(T('toast_enemy_swap'));
    ST.busy = false; paintHUD();
    return;
  }
  idleTouch();
  takeUndo();                       /* 2.9: запоминаем состояние для отката */
  ST.busy = true; ST.selected = null; ST.hint = null; paintHUD();
  const gained = await performSwap(mv, who);
  if (TUT.on) { await tutAfterMove(mv, gained); return; }
  if (ST.mode === 'mp') MP.push(mv);
  afterMove(who, gained);
}

/* ============================== МУЛЬТИПЛЕЕР ==========================
   По мотивам «камень-ножницы-бум»: пошаговая дуэль через хранилище
   площадки (VK Bridge Storage) или localStorage в демо-режиме.
   Матч детерминирован: seed доски + список свапов. Каждый клиент
   проигрывает их локально, поэтому поле и очки совпадают без трафика.
   ===================================================================== */
const MP = {
  code: null, role: 'a', seq: 0, timer: null, polling: false, st: null,
  nick2: '', lobbyTimer: null, searching: false,
  key() { return MBNet.key + this.code; },
  color() { return this.role === 'a' ? 'gold' : 'blue'; },
  oppColor() { return this.role === 'a' ? 'blue' : 'gold'; },
  myTurn() { return !!this.code && ST.turn === this.color(); },
  nick() { return this.nick2 || ''; },

  reset() {
    this.stopPoll(); this.stopLobby();
    this.code = null; this.role = 'a'; this.seq = 0; this.st = null; this.nick2 = '';
    this.searching = false;
  },
  stopPoll() { if (this.timer) { clearTimeout(this.timer); this.timer = null; } this.polling = false; },
  stopLobby() { if (this.lobbyTimer) { clearTimeout(this.lobbyTimer); this.lobbyTimer = null; } },

  /* --- создание / вход --- */
  async create(lvl) {
    this.reset();
    this.code = MBNet.randCode();
    this.role = 'a';
    const st = {
      id: MBNet.ME, a: { nick: MBNet.NICK }, b: null,
      seed: MBNet.seedOf(this.code), lvl: lvl == null ? ST.level : lvl,
      board: BOARD, moves: [], ended: null, ts: Date.now(),
      /* 3.0: правило фиксируется хостом и синхронизируется гостю */
      rule: PROG.rule, sumTarget: 10
    };
    this.st = st;
    const ok = await MBNet.set(this.key(), st);
    return ok ? this.code : null;
  },
  async join(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) return { ok: false, why: 'code' };
    const key = MBNet.key + code;
    let st = await MBNet.get(key);
    if (!st) return { ok: false, why: 'none' };
    if (st.b && st.id !== MBNet.ME) return { ok: false, why: 'full' };
    /* 2.9 (техдолг #7): хранилище не атомарное — двое могли прочитать пустой слот
       одновременно. Перед записью перечитываем и разводим попытки по времени. */
    await new Promise(r => setTimeout(r, 70 + Math.random() * 160));
    const st2 = await MBNet.get(key);
    if (!st2) return { ok: false, why: 'none' };
    if (st2.b && st2.id !== MBNet.ME) return { ok: false, why: 'full' };
    st = st2;
    this.reset();
    this.code = code;
    this.role = 'b';
    st.b = { nick: MBNet.NICK, id: MBNet.ME };
    st.ts = Date.now();
    await MBNet.set(key, st);
    /* контрольная проверка: если нас переписали — честно выходим */
    const chk = await MBNet.get(key);
    if (chk && chk.b && chk.b.id !== MBNet.ME) { this.reset(); return { ok: false, why: 'full' }; }
    this.st = st;
    this.nick2 = (st.a && st.a.nick) || '';
    return { ok: true };
  },
  /* хост ждёт второго игрока */
  waitJoin(cb) {
    this.stopLobby();
    const tick = async () => {
      const st = await MBNet.get(this.key());
      if (st && st.b) {
        this.st = st; this.nick2 = (st.b && st.b.nick) || '';
        this.stopLobby();
        cb(st);
        return;
      }
      this.lobbyTimer = setTimeout(tick, 1600);
    };
    this.lobbyTimer = setTimeout(tick, 900);
  },
  /* гость ждёт, пока хост подтвердит старт (поле уже известно из записи) */
  beginFromState(st) {
    ST.mode = 'mp'; MODE = 'mp';
    ST.training = false; TUT.on = false; TUT.step = 0;
    ST.rival = 0;
    ST.level = clamp(st.lvl == null ? 1 : st.lvl, 0, 2);
    /* 3.0: гость принимает правило хоста — «у меня было другое» не работает */
    PROG.rule = (RULES3.indexOf(st.rule) >= 0) ? st.rule : 'same';
    E.setRule(PROG.rule, (typeof st.sumTarget === 'number' ? st.sumTarget : 10));
    ST.target = E.targetFor(PROG.rule, ST.level);
    setBoard(st.board == null ? BOARD : st.board, true);
    resetMatchState();
    ST.grid = prepTiles(E.newBoard(E.rng(st.seed)));
    this.seq = (st.moves || []).length;
    hudMode();
    closeAllOv();
    showScreen('game');
    paintRivalHUD(); paintHUD(); layoutCanvas(); paintRuleUI();
    startTimer();
    gameIntro();
  },
  /* --- ходы --- */
  rsSeed(i) { return (MBNet.seedOf(this.code || 'X') ^ Math.imul(i + 1, 7919)) >>> 0; },
  async pushEvent(ev) {
    this.seq++;
    try {
      const st = (await MBNet.get(this.key())) || this.st;
      if (!st) return;
      (st.moves = st.moves || []).push(ev);
      st.ts = Date.now();
      this.st = st;
      await MBNet.set(this.key(), st);
    } catch (e) {}
  },
  async push(mv) {
    return this.pushEvent({ r1: mv.r1, c1: mv.c1, r2: mv.r2, c2: mv.c2 });
  },
  startPoll(ms) {
    if (this.timer || !this.code) return;
    const tick = async () => {
      this.timer = null;
      if (!this.code) return;
      this.polling = true;
      let st = null;
      try { st = await MBNet.get(this.key()); } catch (e) {}
      this.polling = false;
      if (st) {
        this.st = st;
        if (st.b && !this.nick2) this.nick2 = (st.b.nick || '');
        const evs = st.moves || [];
        if (evs.length > this.seq) {
          const idx = this.seq, next = evs[idx];
          this.seq++;
          if (next && next.rs) {        /* автошейк соперника — повторяем с тем же сидом */
            const before = snapshotPositions();
            E.reshuffle(ST.grid, E.rng(this.rsSeed(idx)));
            await animateShuffle(before);
            this.timer = setTimeout(tick, 900);
            return;
          }
          await mpRemoteMove(next);
          return;                       /* следующий опрос запустит beginTurn */
        }
        if (st.ended && !ST.over) {
          endMatch(compareWinner(), st.reason || 'target');
          return;
        }
      }
      if (ST.mode === 'mp' && !ST.over) this.timer = setTimeout(tick, ms || 1400);
    };
    this.timer = setTimeout(tick, ms || 1400);
  },
  async finish(winner) {
    this.stopPoll();
    if (!this.code) return;
    try {
      const st = (await MBNet.get(this.key())) || this.st;
      if (st && !st.ended) {
        st.ended = this.role;
        st.reason = winner === 'draw' ? 'empty' : 'target';
        st.ts = Date.now();
        this.st = st;
        await MBNet.set(this.key(), st);
      }
    } catch (e) {}
  }
};
async function mpRemoteMove(mv) {
  MP.stopPoll();
  ST.busy = true; paintHUD();
  setBanner('ai');
  await sleep(280);
  await highlightPair(mv, MP.oppColor());
  const gained = await performSwap(mv, MP.oppColor());
  if (checkEnd()) return;
  /* 2.6: если соперник собрал первую линию — он ходит ещё раз */
  if (streakAfter(MP.oppColor(), gained)) {
    ST.turn = MP.oppColor();
    ST.busy = true; paintHUD();
    MP.startPoll();
    return;
  }
  ST.turn = MP.color();
  beginTurn();
}
/* быстрый поиск: сначала ищем живую заявку в очереди, иначе встаём в очередь */
async function mpQuick(lvl) {
  const now = Date.now();
  let freeSlot = -1, mineSlot = -1;
  for (let i = 0; i < MBNet.SLOTS; i++) {
    const k = MBNet.key + 'q_' + i;
    let e = null;
    try { e = await MBNet.get(k); } catch (err) {}
    if (!e || now - (e.ts || 0) > MBNet.FRESH) { freeSlot = i; break; }
    if (e && e.id === MBNet.ME) { mineSlot = i; continue; }
    if (e && e.id !== MBNet.ME) {
      const r = await MP.join(e.code);
      if (r.ok) { MP.beginFromState(MP.st); return 'joined'; }
    }
  }
  /* 2.9 (техдолг #12): если все 8 слотов заняты живыми заявками, свою не пишем —
     иначе можно сломать чужой матч */
  const slot = freeSlot >= 0 ? freeSlot : mineSlot;
  if (slot < 0) { MP.reset(); return 'busy'; }
  const code = await MP.create(lvl);
  if (!code) return 'fail';
  await MBNet.set(MBNet.key + 'q_' + slot, { id: MBNet.ME, ts: now, code: code });
  return 'waiting';
}

/* ============================== ОБУЧЕНИЕ 2.3 =========================
   Три шага, каждый заканчивается действием игрока:
     1) затемнение, две выделенные соседние фишки, свап → линия светится;
     2) реклама → подсказка лучшего хода → свап по стрелке → линия исчезает;
     3) реклама → перемешивание оставшихся фишек.
   В конце: «Повторить обучение?» и «Вернуться в меню».
   ===================================================================== */
const TUT = { on: false, step: 0, lock: null, need: null, can: false, busy: false };

}
/* карточка туториала висит над панелью действий, чтобы кнопки оставались доступны */
function positionGameHint() {
  const hint = $('gameHint'), hud = $('hud'), lg = $('legend');
  if (!hint || !hud) return;
  const scr = hint.offsetParent;                       /* .screen — начало координат */
  const base = scr ? scr.getBoundingClientRect().top : 0;
  const r = hud.getBoundingClientRect();
  let top = Math.max(4, r.bottom - base + 6);
  /* 2.5: сначала легенда «твои фишки / фишки соперника», под ней правило */
  if (lg) {
    lg.style.top = top + 'px';
    top += lg.offsetHeight + 5;
  }
  hint.style.top = top + 'px';
  /* 2.4: тост висит НИЖЕ правила, иначе перекрывает его на узких экранах */
  const stage = $('stage'), tst = $('toast');
  if (stage && tst) {
    /* 3.0: на телефоне тост живёт снизу сцены (сверху его перекрывает легенда),
       на широком экране — сразу под строкой-подсказкой */
    if (window.innerWidth <= 560) {
      tst.style.top = '';
      tst.style.bottom = '8px';
    } else {
      tst.style.bottom = '';
      const sr = stage.getBoundingClientRect();
      const hr = hint.getBoundingClientRect();
      tst.style.top = Math.max(6, hr.bottom - sr.top + 8) + 'px';
    }
  }
}

/* подобрать свап, который даёт игроку ровно три в ряд */
function tutPickMove(grid) {
  const swaps = E.allSwaps(grid, 'gold');
  let fallback = null;
  for (let i = 0; i < swaps.length; i++) {
    const mv = swaps[i];
    const g2 = E.cloneGrid(grid);
    E.swapCells(g2, mv.r1, mv.c1, mv.r2, mv.c2);
    const plan = E.resolvePlan(g2);
    if (!plan.phases.length) continue;
    const golds = plan.phases[0].groups.filter(g => g.c === 'gold');
    if (!golds.length) continue;
    const lens = golds.map(g => g.cells.length);
    const pair = [[mv.r1, mv.c1], [mv.r2, mv.c2]];
    if (lens.indexOf(3) >= 0) return pair;
    if (!fallback) fallback = pair;
  }
  return fallback;
}
function startTutorial(mode) {
  /* 3.0: обучение идёт по выбранному правилу (и по нему же генерируется доска) */
  if (RULES3.indexOf(mode) >= 0 && mode !== PROG.rule) setRule(mode, true);
  E.setRule(PROG.rule, 10);
  MODE = 'solo'; ST.mode = 'solo'; ST.training = true; TUT.on = true; TUT.step = 0;
  ST.rival = 0; ST.level = 0; ST.target = 0;
  resetMatchState();
  TUT.on = true;
  ST.grid = prepTiles(E.newBoard(Math.random));
  hudMode();
  showScreen('game');
  paintRivalHUD(); paintHUD(); layoutCanvas();
  docTut(true);
  tutIntro();
}
async function tutIntro() {
  await tween(560, p => {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = ST.grid[r][c]; if (!t) continue;
      t.ap = clamp((p - (r * .04 + c * .02)) / .55, 0, 1);
    }
  });
  tutGo(1);
}
function tutSheet(html, buttons) {
  const box = $('ov-tut');
  box.classList.add('on');
  box.classList.toggle('fin', TUT.step > 3);
  const done = TUT.step > 3;
  $('tut-step').textContent = done ? '✓' : String(Math.min(TUT.step, 3));
  $('tut-title').textContent = T('tut_title') + ' · ' +
    (done ? T('tut_fin') : T('tut_step', { n: Math.min(TUT.step, 3), m: 3 }));
  $('tut-text').innerHTML = html;
  ['tut-skip', 'tut-next', 'tut-again', 'tut-menu'].forEach(id => { $(id).hidden = true; });
  (buttons || []).forEach(b => {
    const el = $(b.id);
    el.hidden = false;
    el.textContent = b.text;
    el.onclick = b.on;
  });
  requestAnimationFrame(() => { positionTutSheet(); layoutCanvas(); });
}
function tutRender() {
  const n = TUT.step;
  /* 3.0: шаг 1 объясняется словами того правила, по которому идёт обучение */
  const skip = { id: 'tut-skip', text: T('btn_skip'), on: tutSkip };
  if (n === 2) { tutSheet(T('tut2', { b: T('btn_hint') }), [skip]); return; }
  if (n === 3) { tutSheet(T('tut3', { b: T('btn_shuffle') }), [skip]); return; }
  if (n > 3) {
    tutSheet(T('tut_end'), [
      { id: 'tut-again', text: T('tut_again'), on: () => { sfx('click'); startTutorial(PROG.rule); } },
      { id: 'tut-menu', text: T('tut_menu'), on: () => { sfx('click'); tutFinish(true); } }
    ]);
    return;
  }
  tutSheet(T('tut1_' + PROG.rule), [skip]);
}
async function tutGo(n) {
  TUT.step = n;
  TUT.lock = null; TUT.need = null; TUT.can = false; TUT.busy = false;
  ST.selected = null; ST.hint = null; ST.busy = true;
  paintHUD(); docTut(n === 1);
  if (n === 1) {
    const pair = tutPickMove(ST.grid);
    if (pair) {
      TUT.lock = pair;
      TUT.can = true;
      ST.busy = false;
    }
    tutRender();
    paintHUD();
    return;
  }
  if (n === 2) {
    let b = E.bestMove(ST.grid, 'gold');
    for (let k = 0; k < 5 && !b; k++) {
      const before = snapshotPositions();
      if (!E.reshuffle(ST.grid, Math.random)) break;
      await animateShuffle(before);      /* 2.9 (техдолг #8): не даём тапать по летящим плиткам */
      b = E.bestMove(ST.grid, 'gold');
    }
    tutRender();
    paintHUD();
    return;
  }
  if (n === 3) {
    tutRender();
    paintHUD();
    return;
  }
  /* финал обучения */
  TUT.can = false;
  ST.busy = true;
  tutRender();
}
function tutSkip() { sfx('click'); tutFinish(true); }
function tutFinish(force) {
  TUT.on = false; TUT.step = 0; TUT.lock = null; TUT.need = null; TUT.can = false;
  ST.training = false;
  $('ov-tut').classList.remove('on');
  $('ov-tut').style.bottom = '';
  docTut(false);
  requestAnimationFrame(layoutCanvas);
  try { localStorage.setItem('mbduel_tut', '1'); } catch (e) {}
  PROG.tut = 1; saveProg(false);
  ST.over = true; ST.busy = true;
  stopMatch();
  showScreen('start');
  if (!force) maybeInterstitial();
}
/* шаг 1 завершён: линия уже собрана и погасла штатным FX */
async function tutAfterMove(mv, gained) {
  if (TUT.step === 1) {
    ST.busy = true;
    await sleep(420);
    if (!gained) {                 /* не собралось — вернуть и попробовать снова */
      tutGo(1);
      toast(T('tut_try_again'));
      return;
    }
    tutGo(2);
    return;
  }
  if (TUT.step === 2) {
    ST.busy = true;
    await sleep(420);
    TUT.need = null;
    tutGo(3);
    return;
  }
  ST.busy = false; paintHUD();
}
/* кнопка подсказки в туториале */
async function tutHint() {
  if (TUT.busy) return;
  TUT.busy = true; ST.busy = true; paintHUD();
  const ok = await requestReward();
  if (!ok) { TUT.busy = false; ST.busy = true; paintHUD(); return; }
  const b = E.bestMove(ST.grid, 'gold');
  if (!b) { TUT.busy = false; ST.busy = true; paintHUD(); return; }
  TUT.need = [[b.move.r1, b.move.c1], [b.move.r2, b.move.c2]];
  ST.hint = { a: TUT.need[0], b: TUT.need[1], until: performance.now() + 1e9 };
  sfx('hint');
  toast(T('toast_hint'));
  TUT.busy = false; TUT.can = true; ST.busy = false;
  paintHUD();
}
/* кнопка перемешивания в туториале */
async function tutShuffle() {
  if (TUT.busy) return;
  TUT.busy = true; ST.busy = true; paintHUD();
  const ok = await requestReward();
  if (!ok) { TUT.busy = false; ST.busy = true; paintHUD(); return; }
  const before = snapshotPositions();
  if (E.reshuffle(ST.grid, Math.random)) { sfx('shuffle'); await animateShuffle(before); }
  TUT.busy = false;
  ST.busy = true;
  await sleep(160);
  tutGo(4);
}

/* ------------------------------ пауза -------------------------------- */
function openPause() {
  if (curScreen !== 'game' || ST.over || ST.busy) return;
  if (ST.mode === 'solo' && ST.turn !== 'gold') return;   /* в дуэли с ИИ — только в свой ход */
  ST.busy = true;
  $('ov-pause').classList.add('on');
}
$('btn-back').onclick = () => {
  sfx('click');
  if (curScreen === 'game') openPause();
  else showScreen('start');
};

/* ------------------------------ меню --------------------------------- */
$('b-play').onclick = () => { sfx('click'); MODE = 'solo'; ST.mode = 'solo'; if (!PROG.tut) { startTutorial(); return; } showScreen('select'); };
$('b-train').onclick = () => { sfx('click'); startTutorial(); };
$('b-museum').onclick = () => { sfx('click'); showScreen('museum'); };
$('b-hall').onclick = () => { sfx('click'); showScreen('hall'); };
$('b-help').onclick = () => { sfx('click'); showScreen('help'); };

/* ----------------------------- тема/звук ----------------------------- */
let theme = 'dark';
function applyTheme(t, save) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  if (save !== false) { try { localStorage.setItem('mbduel_theme', t); } catch (e) {} }
  applyBoardVars();
  paintChrome();
  if (curScreen === 'museum') renderMuseum();
  if (curScreen === 'start') renderSides();
}
$('btn-theme').onclick = () => { sfx('click'); applyTheme(theme === 'dark' ? 'light' : 'dark'); };
$('btn-sound').onclick = () => { const on = setSound(!isSoundOn()); if (on) sfx('click'); paintChrome(); };
$('btn-lang').onclick = () => {
  sfx('click');
  setLang(lang() === 'ru' ? 'en' : 'ru');
  document.documentElement.lang = lang();
  paintStatic();
};

/* ------------------------------ клавиши ------------------------------ */
document.addEventListener('keydown', e => {
  if (curScreen !== 'game' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape') { if ($('ov-pause').classList.contains('on')) $('p-resume').click(); else openPause(); }
  else if (k === 'm' || k === 'M' || k === 'ь' || k === 'Ь') $('btn-sound').click();
  else if (k === 'h' || k === 'H' || k === 'р' || k === 'Р') $('b-hint').click();
  else if (k === 'r' || k === 'R' || k === 'к' || k === 'К') $('b-shuffle').click();
});
window.addEventListener('mb:pause', () => { if (curScreen === 'game') openPause(); });
window.addEventListener('mb:resume', () => { $('ov-pause').classList.remove('on'); });

/* ------------------------------- загрузка ---------------------------- */
async function boot() {
  try { const t = localStorage.getItem('mbduel_theme'); if (t === 'light' || t === 'dark') applyTheme(t, false); } catch (e) {}
  try { const v = localStorage.getItem('mbduel_tut'); if (v) PROG.tut = 1; } catch (e) {}
  loadProg();
  setBoard(clamp(PROG.board || 0, 0, BOARDS.length - 1), true);
  document.body.dataset.board = PAL.id;
  layoutCanvas();
  paintStatic();
  showScreen('start');
  const pl = await initPlatform();
  let chose = false;
  try { chose = !!localStorage.getItem('mbduel_lang'); } catch (e) {}
  if (!chose && pl.lang === 'en') { setLang('en'); paintStatic(); }
  try {
    const c = await cloudLoad();
    if (c) {
      PROG.bestScore = Math.max(PROG.bestScore || 0, c.bestScore || 0);
      PROG.plays = Math.max(PROG.plays || 0, c.plays || 0);
      for (let i = 0; i < 10; i++) {
        /* 3.0: облако 2.x хранило плоские рекорды — кладём их в ветку 'same' */
        PROG.wins.same[i] = Math.max(PROG.wins.same[i] || 0, (c.wins && c.wins[i]) || 0);
        PROG.best.same[i] = Math.max(PROG.best.same[i] || 0, (c.best && c.best[i]) || 0);
        PROG.unlocked[i] = !!(PROG.unlocked[i] || (c.unlocked && c.unlocked[i]));
      }
      saveProg(false);
      renderSides();
    }
  } catch (e) {}
  gameReady();
  renderSides();
}
window.MB = {
  ST: ST, E: E, PROG: PROG, startMatch: startMatch, V: V,
  MP: MP, TUT: TUT, BOARDS: BOARDS,
  setBoard: function (i) { setBoard(i); buildSprites(); },
  openColors: function () { openColors(); },
  pickColor: function (i) { pickColor(i); },
  swapColors: function () { swapColors(); },
  colors: function () { return { me: myColIdx(), ai: aiColIdx() }; },
  startTutorial: startTutorial, tutGo: tutGo, wave: function () { return WAVE; },
  idle: function () { return performance.now() - lastAct; },
  pal: function () { return PAL; },          /* 2.5: палитра текущей доски (для тестов) */
  boardIdx: function () { return BOARD; },
  dbg: function () { return { loop: loop.on, tweens: TWEENS.length, busy: ST.busy, turn: ST.turn, over: ST.over }; },
  dbgTurn: function (c) { ST.turn = c; ST.busy = true; paintHUD(); beginTurn(); },
  /* для автотестов: экранные координаты центра клетки */
  end: function (w, why) { endMatch(w || compareWinner(), why || 'target'); },
  pickCell: function (x, y) { return pickCell(x, y); },
  cellXY: function (r, c) {
    const p = quadOf(r, c, .6);
    const rc = cv.getBoundingClientRect();
    return { x: rc.left + (p[0].x + p[2].x) / 2, y: rc.top + (p[0].y + p[2].y) / 2 };
  },
  best: function () { return E.bestMove(ST.grid, 'gold'); },
  /* для автотестов: выполнить свап игрока напрямую */
  play: function (mv) { return playerMove(mv); },
  undo: function () { return undoMove(); },
  showHint: function () { return showHint(); },
  hintText: function () { return $('toast').textContent; },
  streakAfter: function (m, g) { return streakAfter(m, g); }
};
boot();
