<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" name="viewport"/>
<meta content="#0b1020" name="theme-color"/>
<meta content="dark light" name="color-scheme"/>
<meta content="Головоломка «Мат-Бум! Открой колонну»: собирай уравнения и тройки на гранях вращающейся колонны, открой 10 колонн и собери музей фигурок." name="description"/>
<meta content="yes" name="mobile-web-app-capable"/>
<title>Мат-Бум! Открой колонну</title>
<style>
/* Мат-Бум! Открой колонну — styles, dark+light themes, responsive */
:root{
  --gold:#e8c56a; --emerald:#3ddc84; --ink:#e9e4d6; --mut:#93a2c4;
  --panel:rgba(20,28,52,.65); --panel-b:rgba(232,197,106,.25);
  --bg1:#0b1020; --bg2:#070a14; --bg3:#05070d;
  --card:linear-gradient(#1a2340,#0d1226); --card-b:rgba(232,197,106,.5);
  --btnbg:rgba(22,30,56,.8); --btnb:rgba(232,197,106,.4);
  --hint:#c6d2ee; --hint2:#9ff0c0; --dim:#7688ad;
}
[data-theme="light"]{
  --ink:#232a3d; --mut:#5a6a8c;
  --panel:rgba(255,255,255,.72); --panel-b:rgba(122,92,20,.28);
  --bg1:#eef1fb; --bg2:#e2e8f8; --bg3:#d7def2;
  --card:linear-gradient(#ffffff,#eef2ff); --card-b:rgba(122,92,20,.45);
  --btnbg:rgba(255,255,255,.85); --btnb:rgba(122,92,20,.4);
  --hint:#31406b; --hint2:#0c7a4d; --dim:#68779c;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;
  background:
   radial-gradient(1200px 500px at 50% -10%, rgba(255,214,140,.10), transparent 60%),
   radial-gradient(900px 600px at 50% 110%, rgba(61,220,132,.07), transparent 60%),
   linear-gradient(var(--bg1),var(--bg2) 55%,var(--bg3));
  display:flex;flex-direction:column}
[data-theme="light"] body{background:
   radial-gradient(1200px 500px at 50% -10%, rgba(255,190,80,.18), transparent 60%),
   radial-gradient(900px 600px at 50% 110%, rgba(20,160,110,.10), transparent 60%),
   linear-gradient(var(--bg1),var(--bg2) 55%,var(--bg3));}
/* ---------- chrome (top bar on every screen) ---------- */
:root{--chrome-h:52px}
#chrome{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 12px 4px;z-index:7;height:var(--chrome-h)}
.chrome-c{display:flex;gap:6px;align-items:center}
#btn-back{min-width:46px;min-height:38px;display:inline-flex;align-items:center;justify-content:center}
.ico-btn{min-width:40px;position:relative;display:inline-flex;align-items:center;gap:6px}
.ico{width:22px;height:22px;vertical-align:middle;pointer-events:none}
.ico-btn.off img.ico{opacity:.4}
.mute-slash{display:none;position:absolute;left:9px;top:50%;width:22px;height:3px;background:#ff6a6a;
  transform:rotate(-45deg);border-radius:2px;pointer-events:none}
.ico-btn.off .mute-slash{display:block}
.menu-actions img.ico{width:20px;height:20px;margin-right:8px}
.menu-actions .lbl{vertical-align:middle}
#pbar{height:5px;margin:2px 12px 0;background:var(--panel);border-radius:3px;overflow:hidden;z-index:5}
#pbarI{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--emerald));width:100%;transition:width .3s}
@media (hover:hover){
 button:hover{filter:brightness(1.15)}
 .colcard:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
 .muscard:hover{transform:translateY(-2px)}
}
button{cursor:pointer;border:1px solid var(--btnb);background:var(--btnbg);color:var(--ink);
  border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;letter-spacing:1px}
button:active{transform:scale(.94)}
button.ghost{background:transparent}
button.small{padding:6px 10px;font-size:13px}
button[hidden]{display:none}
/* ---------- screens ---------- */
.screen{position:absolute;left:0;right:0;bottom:0;top:var(--chrome-h);display:none;flex-direction:column;z-index:1}
.screen.on{display:flex}
.screen-scroll{flex:1;overflow:auto;padding:10px 16px 24px;-webkit-overflow-scrolling:touch}
.center{max-width:760px;margin:0 auto;text-align:center}
.logo{font-weight:900;letter-spacing:3px;font-size:clamp(30px,6vw,54px);color:var(--gold);
  text-shadow:0 0 22px rgba(232,197,106,.45)}
[data-theme="light"] .logo{text-shadow:0 1px 0 #fff,0 0 18px rgba(180,130,20,.35)}
.h1sub{font-size:clamp(14px,2.4vw,20px);letter-spacing:4px;color:var(--mut);font-weight:600;margin-top:2px}
.menu-actions{display:flex;flex-direction:column;gap:12px;margin:26px auto 0;max-width:340px}
.menu-actions button{font-size:17px;padding:13px 18px;border-radius:16px}
.menu-actions .primary{background:linear-gradient(#ffe9a3,#d9a83f);color:#3a2a05;border-color:#ffe9a3;
  box-shadow:0 0 18px rgba(255,220,120,.5)}
.ver{margin-top:26px;color:var(--dim);font-size:12px;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:14px 16px;margin-top:12px;text-align:left}
.card h2{color:var(--gold);font-size:19px;letter-spacing:1px;margin-bottom:6px}
[data-theme="light"] .card h2{color:#8a6410}
.card p{color:var(--hint);font-size:14px;line-height:1.45}
.card p b{color:var(--gold)}
h2.scr-title{color:var(--gold);letter-spacing:2px;font-size:clamp(20px,4vw,30px);text-align:center;margin:6px 0 2px}
.sub{color:var(--mut);font-size:13px;text-align:center}
/* ---------- column select ---------- */
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;max-width:860px;margin:16px auto 0}
.colcard{position:relative;background:var(--card);border:1px solid var(--card-b);border-radius:16px;
  padding:12px 8px 10px;text-align:center;color:var(--ink)}
.colcard .num{font-size:26px;font-weight:900;color:var(--gold)}
.colcard .fig{display:block;margin:6px auto 4px;width:64px;height:64px;object-fit:cover;border-radius:12px}
.colcard.locked .fig{filter:grayscale(1) brightness(.7)}
.colcard .nm{font-size:12px;color:var(--hint);min-height:16px}
.colcard .bst{font-size:11px;color:var(--mut);margin-top:4px}
.colcard .done{position:absolute;top:6px;right:8px;color:var(--emerald);font-size:15px}
.colcard:active{transform:scale(.96)}
/* ---------- hall ---------- */
.hallrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--panel-b);
  border-radius:12px;padding:8px 12px;margin-top:8px}
.hallrow .rk{width:30px;font-weight:900;color:var(--gold);text-align:center}
.hallrow .nm{flex:1;color:var(--hint);font-size:14px}
.hallrow .sc{font-weight:800;color:#fff}
[data-theme="light"] .hallrow .sc{color:#233}
/* ---------- museum ---------- */
.musgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;max-width:860px;margin:16px auto 0}
.muscard{background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:10px 6px;text-align:center}
.muscard img,.muscard canvas{width:72px;height:72px;object-fit:cover;border-radius:12px;display:block;margin:0 auto}
.muscard{cursor:pointer}
.muscard.locked img{filter:grayscale(1) brightness(.6)}
.muscard .nm{font-size:12px;color:var(--hint);margin-top:6px}
.muscard.locked{opacity:.55;filter:grayscale(1)}
.muscard.locked .nm{color:var(--dim)}
/* ---------- game screen ---------- */
#scr-game{z-index:2}
#hud{display:flex;align-items:center;gap:8px;padding:4px 12px;flex-wrap:wrap;row-gap:4px;z-index:5}
#hud .logo{font-weight:800;letter-spacing:2px;font-size:16px}
#hud .logo small{display:block;font-size:8px;letter-spacing:3px;color:var(--mut);font-weight:600}
.stat{position:relative;background:var(--panel);border:1px solid var(--panel-b);border-radius:12px;
  padding:3px 10px;text-align:center;min-width:56px}
.stat b{display:block;font-size:16px;color:#fff}
[data-theme="light"] .stat b{color:#223}
.stat span{font-size:8px;letter-spacing:2px;color:var(--mut)}
#stMoves b{color:#ffd76a} #stCombo b{color:#7ef0b2}
#comboX{display:none;margin-left:5px;background:linear-gradient(#ffe9a3,#d9a83f);
  color:#3a2a05;font-weight:900;font-size:10px;border-radius:8px;padding:1px 6px;vertical-align:2px;
  box-shadow:0 0 12px rgba(255,220,120,.8);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
#hint{text-align:center;color:var(--hint);padding:0 10px;z-index:5}
#hint div{display:block;font-size:clamp(15px,2.2vw + 10px,32px);line-height:1.25;font-weight:600;
  margin:3px 0;text-shadow:0 1px 3px rgba(0,0,0,.4)}
[data-theme="light"] #hint div{text-shadow:0 1px 2px rgba(255,255,255,.6)}
#hint #hint2{color:var(--hint2)}
#hint b{color:#ffe9a3}
[data-theme="light"] #hint b{color:#8a6410}
.neq{position:relative;display:inline-block}
.neq i{position:absolute;left:50%;top:50%;width:150%;height:.1em;background:currentColor;border-radius:1em;
  transform:translate(-50%,-50%) rotate(-62deg)}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;z-index:1;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ctrl{display:flex;gap:10px;justify-content:center;align-items:center;padding:4px 0 10px;z-index:5;flex-wrap:wrap}
#ctrl .rot{font-size:19px;padding:7px 16px;border-radius:14px}
.autob{background:linear-gradient(#ffe9a3,#d9a83f);color:#3a2a05;border-color:#ffe9a3;
  font-size:13px;padding:7px 14px;box-shadow:0 0 14px rgba(255,220,120,.55);letter-spacing:1px}
#dragHint{margin:2px 10px 4px;text-align:center;font-size:11px;color:var(--dim);z-index:4}
/* fx overlay + juice */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.ring{position:fixed;width:10px;height:10px;border:3px solid #fff;border-radius:50%;
  transform:translate(-50%,-50%);animation:ring .5s forwards;pointer-events:none;z-index:51}
@keyframes ring{to{width:90px;height:90px;opacity:0;border-width:1px}}
.ftext{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:18px;color:#ffe9a3;
  text-shadow:0 0 10px rgba(255,220,120,.8),0 2px 3px #000;animation:ft 1s forwards;pointer-events:none;z-index:52;white-space:nowrap}
.ftext.big{font-size:26px;color:#7ef0b2;text-shadow:0 0 16px rgba(61,220,132,.9)}
@keyframes ft{to{transform:translate(-50%,-140%);opacity:0}}
#shaker.shakeS{animation:shS .3s} #shaker.shakeB{animation:shB .5s}
@keyframes shS{20%{transform:translate(3px,-2px)}40%{transform:translate(-3px,2px)}60%{transform:translate(2px,1px)}80%{transform:translate(-2px,-1px)}}
@keyframes shB{10%{transform:translate(7px,-5px) rotate(.6deg)}30%{transform:translate(-7px,5px) rotate(-.6deg)}50%{transform:translate(5px,3px)}70%{transform:translate(-5px,-3px)}90%{transform:translate(3px,2px)}}
/* ---------- overlays (pause / finale / confirm) ---------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;
  background:rgba(4,6,12,.55);backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.overlay .obox{background:var(--card);border:1px solid var(--card-b);border-radius:20px;padding:22px 30px;
  text-align:center;max-width:min(92vw,430px);box-shadow:0 0 60px rgba(61,220,132,.25);
  animation:cardIn .6s cubic-bezier(.2,1.6,.4,1);max-height:88vh;overflow:auto}
@keyframes cardIn{from{transform:scale(.4);opacity:0}}
.overlay h1{color:var(--gold);letter-spacing:3px;font-size:26px}
.overlay p{margin:8px 0;color:var(--hint);font-size:15px}
.overlay p b{color:#fff}
[data-theme="light"] .overlay p b{color:#223}
.overlay .btns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#finFig{width:min(64vw,300px);height:auto;border-radius:18px;display:block;margin:8px auto;
  box-shadow:0 10px 40px rgba(0,0,0,.5)}
.figbox img{width:min(70vw,340px);height:auto;border-radius:18px;display:block;margin:4px auto;
  box-shadow:0 10px 40px rgba(0,0,0,.5)}
#fig-big-name{color:var(--gold);font-weight:800;font-size:18px;margin-top:8px}
/* shell indicator 1-4 */
.sh{display:inline-block;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--mut);
  color:var(--mut);font-size:9px;line-height:12px;text-align:center;margin:0 1px;font-weight:800}
.sh.cur{border-color:var(--emerald);color:var(--emerald);animation:pulse 1.2s infinite}
.sh.done{border-color:var(--gold);background:var(--gold);color:#3a2a05}
/* ---------- responsive ---------- */
@media (max-width:640px){
  #hud{gap:5px;padding:2px 8px}
  #hud .logo{display:none}
  .stat{min-width:46px;padding:2px 6px}
  .stat b{font-size:14px}
  #ctrl .rot{font-size:17px;padding:6px 13px}
  .menu-actions{max-width:280px}
  .screen-scroll{padding:8px 10px 18px}
}
@media (max-height:480px){ /* landscape phone */
  #chrome{padding:4px 8px 0}
  #hint div{font-size:13px;margin:1px 0}
  #ctrl{padding:2px 0 6px;gap:6px}
  #hud{padding:0 8px}
}

/* ============ v1.0.4: museum showcase with pedestals ============ */
#musgrid{position:relative;max-width:760px;margin:16px auto 44px;padding:20px 12px 10px;
 border:1px solid rgba(255,233,163,.18);border-radius:18px;
 background:linear-gradient(180deg,rgba(120,160,255,.07),rgba(255,255,255,.02) 34%,rgba(0,0,0,.22));
 box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 14px 36px rgba(0,0,0,.35)}
#musgrid::before{content:'';position:absolute;inset:6px;border-radius:13px;
 border:1px solid rgba(255,255,255,.06);pointer-events:none}
.muscard.ped{display:flex;flex-direction:column;align-items:center;padding:10px 4px 10px;
 background:transparent;border:none;box-shadow:none;cursor:pointer;transition:transform .15s ease}
.muscard.ped:hover{transform:translateY(-3px)}
.muscard.ped .dome{padding:7px;border-radius:16px 16px 10px 10px;border:1px solid rgba(190,215,255,.2);
 background:linear-gradient(180deg,rgba(190,215,255,.13),rgba(190,215,255,.02) 72%)}
.muscard.ped .dome img{width:74px;height:74px;border-radius:10px;object-fit:cover;display:block;margin:0}
.muscard.ped .base{width:96px;height:14px;margin-top:8px;border-radius:3px 3px 6px 6px;
 background:linear-gradient(180deg,#a5813f,#5d4620 70%,#40300f);
 box-shadow:0 4px 10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,230,160,.55)}
.muscard.ped .base::before{content:'';display:block;width:82px;height:7px;margin:-11px auto 0;border-radius:50%;
 background:linear-gradient(180deg,#dcb86e,#8a6b35)}
.muscard.ped .plate{margin-top:9px;font-size:10.5px;line-height:1.3;color:var(--gold,#e8c56a);text-align:center}
.muscard.ped.locked{opacity:.88;filter:none}
.muscard.ped.locked .dome img{filter:grayscale(1) brightness(.45)}
.muscard.ped.locked .base{filter:grayscale(.65) brightness(.75)}
.muscard.ped.locked .plate{color:var(--dim,#8b93a7)}
/* ============ v1.0.4: tutorial overlay ============ */
.tutbox{max-width:430px;text-align:center}
.tut-step{font-size:12px;letter-spacing:.14em;color:var(--gold,#e8c56a);font-weight:800;margin-bottom:8px}
#tut-text{font-size:15px;line-height:1.5;min-height:96px;margin:0 0 12px}

/* v1.0.5: locked pedestal shows padlock icon */
.muscard.ped .dome.lockdome{border-color:rgba(255,255,255,.09);background:rgba(255,255,255,.03)}
.muscard.ped .dome.lockdome img{width:66px;height:66px;border-radius:14px;filter:none}
.muscard.ped.locked .dome.lockdome img{filter:none}

/* v1.0.7: column item icon in HUD + training box */
#hud-fig{width:34px;height:34px;border-radius:9px;object-fit:cover;display:none;
 border:1px solid var(--card-b);box-shadow:0 0 0 2px rgba(232,197,106,.28)}
#scr-game.on #hud-fig{display:block}
[hidden]{display:none!important}
#tr-text{white-space:pre-line}

/* v1.0.8: training panel floats — column stays visible & rotatable */
#ov-train{background:none;pointer-events:none;align-items:flex-end;justify-content:center;padding:0 10px 118px}
#ov-train.on{display:flex}
#ov-train .obox{pointer-events:auto;max-width:min(620px,96vw);padding:14px 18px;
 background:rgba(11,16,32,.9);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#ov-train #tr-text{min-height:56px;font-size:14px;margin:4px 0 8px}
[data-theme="light"] #ov-train .obox{background:rgba(255,255,255,.92)}

/* v1.0.9: training plate lives in the task zone; chip + arrows */
#trainPlate{min-height:46px;font-size:13.5px;line-height:1.35;color:var(--hint);
 text-align:center;padding:2px 10px;max-width:860px;margin:0 auto}
#trainPlate b{color:var(--gold,#e8c56a);letter-spacing:.08em;margin-right:8px;white-space:nowrap}
#trainChip{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:56;
 display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;
 background:rgba(11,16,32,.93);border:1px solid var(--card-b);border-radius:14px;
 padding:8px 12px;max-width:94vw;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#trainChip #tcText{font-size:13px;color:var(--hint)}
[data-theme="light"] #trainChip{background:rgba(255,255,255,.94)}

/* v1.0.11: fact-boom-style aurora sheen background */
body::after{content:"";position:fixed;inset:-24%;z-index:-1;pointer-events:none;
 background:
  radial-gradient(46% 38% at 16% 10%, rgba(108,142,255,.20), transparent 70%),
  radial-gradient(44% 40% at 86% 20%, rgba(158,104,255,.17), transparent 70%),
  radial-gradient(58% 44% at 50% 106%, rgba(56,206,224,.16), transparent 72%),
  radial-gradient(34% 26% at 78% 88%, rgba(255,196,110,.10), transparent 70%);
 animation:mb-aurora 26s ease-in-out infinite alternate}
[data-theme="light"] body::after{background:
  radial-gradient(46% 38% at 16% 10%, rgba(96,138,255,.16), transparent 70%),
  radial-gradient(44% 40% at 86% 20%, rgba(158,104,255,.12), transparent 70%),
  radial-gradient(58% 44% at 50% 106%, rgba(38,196,218,.12), transparent 72%)}
@keyframes mb-aurora{from{transform:translate3d(-2.2%,-1.6%,0) scale(1)}to{transform:translate3d(2.2%,2%,0) scale(1.09)}}

/* v1.0.12: desktop triptych menu + side HUD layout */
.side{display:none}
body.desktop .center.start-tri{max-width:none;display:grid;grid-template-columns:300px minmax(320px,1fr) 300px;
 gap:20px;align-items:start;padding:24px 28px 10px}
body.desktop .side{display:block;background:var(--panel);border:1px solid var(--panel-b);border-radius:16px;padding:14px}
.side h3{color:var(--gold,#e8c56a);font-size:12px;letter-spacing:.14em;margin-bottom:10px}
.minigrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.minigrid img{width:100%;aspect-ratio:1;border-radius:8px;object-fit:cover}
.minigrid img.lk{filter:grayscale(1) brightness(.4)}
.srow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--hint,#c6d2ee);margin:4px 0}
.srow .sc{margin-left:auto;color:var(--gold,#e8c56a);font-weight:800}
.srow .rk{color:var(--dim,#7688ad);font-weight:700}
body.desktop #hud{position:absolute;left:14px;top:52%;transform:translateY(-50%);
 flex-direction:column;align-items:flex-start;gap:8px;z-index:6;
 background:var(--panel);border:1px solid var(--panel-b);border-radius:14px;padding:10px 12px}
body.desktop #hud .logo{font-size:15px}
body.desktop #ctrl{position:absolute;right:14px;bottom:46px;flex-direction:column}
/* training text tap highlight (step 2) */
.t5{color:inherit;transition:all .15s;border-radius:6px;padding:0 3px}
.t5.on{color:#fff;background:rgba(61,220,122,.3);text-shadow:0 0 12px #3ddc7a}

/* v1.0.13: desktop grid layout, d-pad ctrl, hover, readability */
#gl{cursor:grab}
#gl.grabbing{cursor:grabbing}
#gl.on-cube{cursor:pointer}
.minigrid img.un{cursor:pointer;box-shadow:0 0 0 1px rgba(232,197,106,.4)}
.minigrid img.un:hover{transform:scale(1.06)}
body.desktop #scr-game.on{display:grid;grid-template-columns:280px minmax(0,1fr) 128px;
 grid-template-rows:auto auto 1fr auto;gap:8px 18px;padding:10px 20px}
body.desktop #pbar{grid-column:1/4;grid-row:1}
body.desktop #hint{grid-column:1/4;grid-row:2}
body.desktop #hud{position:static;transform:none;grid-column:1;grid-row:3;align-self:center;
 flex-direction:column;align-items:stretch;gap:10px;background:var(--panel);
 border:1px solid var(--panel-b);border-radius:16px;padding:14px}

'use strict';
let AC=null,master=null,sndOn=true;
try{sndOn=localStorage.getItem('matbum_sound')!=='off';}catch(e){}
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  const g=AC.createGain();g.gain.value=.015;g.connect(master);
  [55,55.6,110.3].forEach(f=>{const o=AC.createOscillator();o.frequency.value=f;o.type='sine';o.connect(g);o.start();});
 } if(AC.state==='suspended')AC.resume(); }
function tone(f,dur,type,vol,slide,delay){ if(!sndOn||!AC)return; const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02); }
function noise(dur,vol,hp){ if(!sndOn||!AC)return; const n=AC.sampleRate*dur|0,
  b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  const g=AC.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(); }

 clear:()=>{tone(1568,.12,'triangle',.22);tone(2093,.18,'triangle',.2,0,.06);noise(.06,.1,4000)},
 tick:i=>tone(700*Math.pow(1.12,i),.12,'triangle',.2),
 triple:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'sawtooth',.14,0,i*.07));noise(.4,.12,2000)},
 layer:()=>{[392,494,587,784].forEach(f=>tone(f,.5,'triangle',.16));},
 crack:()=>{noise(.5,.5,1500);noise(.3,.4,3000);tone(180,.4,'sawtooth',.2,60)},
 fanfare:()=>{[392,392,392,523,659,784].forEach((f,i)=>tone(f,i<3?.12:.4,'sawtooth',.16,0,i*.13));
   [1047,1319,1568].forEach((f,i)=>tone(f,.5,'triangle',.12,0,.8+i*.1));}
};

function pauseForAd(){if(master)master.gain.value=0;}
function resumeForAd(){if(master)master.gain.value=sndOn?.5:0;}

/* Мат-Бум platform adapter: Yandex Games SDK with graceful local fallback.
   SDK is loaded from the relative path /sdk.js (served by the platform);
   it is NEVER bundled into the archive. */
'use strict';
const PLAT={ysdk:null,player:null,lang:'ru',ready:false};
let gameplayWanted=false,gameplayMarked=false,paused=false;

function plDeadline(p,ms,msg){let t;return Promise.race([p,new Promise((_,r)=>{t=setTimeout(()=>r(new Error(msg)),ms);})]).finally(()=>clearTimeout(t));}
function loadSdk(ms){
 if(window.YaGames&&typeof window.YaGames.init==='function')return Promise.resolve(window.YaGames);
 return new Promise((res,rej)=>{const s=document.createElement('script');s.src='/sdk.js';s.async=true;
  const t=setTimeout(()=>rej(new Error('sdk timeout')),ms||6000);
  s.onload=()=>{clearTimeout(t);window.YaGames?res(window.YaGames):rej(new Error('no YaGames'));};
  s.onerror=()=>{clearTimeout(t);rej(new Error('sdk load failed'));};
  document.head.appendChild(s);});
}
function syncGameplay(){const api=PLAT.ysdk&&PLAT.ysdk.features&&PLAT.ysdk.features.GameplayAPI;if(!api)return;
 const should=gameplayWanted&&!paused;
 try{if(should&&!gameplayMarked){api.start();gameplayMarked=true;}
 else if(!should&&gameplayMarked){api.stop();gameplayMarked=false;}}catch(e){}}
function gameReady(){try{PLAT.ysdk&&PLAT.ysdk.features&&PLAT.ysdk.features.LoadingAPI&&PLAT.ysdk.features.LoadingAPI.ready();}catch(e){}}
async function initPlatform(){
 try{
  if(location.protocol==='file:')return PLAT;           // solo double-click build: guest mode
  await loadSdk();
  PLAT.ysdk=await plDeadline(window.YaGames.init(),8000,'SDK init timeout');
  const y=PLAT.ysdk;
  if(y.on){
   y.on('game_api_pause',()=>{paused=true;syncGameplay();window.dispatchEvent(new Event('mb:pause'));});
   y.on('game_api_resume',()=>{paused=false;syncGameplay();window.dispatchEvent(new Event('mb:resume'));});
  }
  const env=(y.environment&&y.environment.i18n)||{};
  PLAT.lang=(String(env.lang||'ru').toLowerCase().startsWith('ru'))?'ru':'en';
  try{PLAT.player=await plDeadline(y.getPlayer({scopes:false}),4000,'player timeout');}catch(e){PLAT.player=null;}
 }catch(e){PLAT.ysdk=null;PLAT.player=null;}
 // platform chrome: block context menu + selection (Yandex UX rules)
 try{document.addEventListener('contextmenu',e=>{e.preventDefault();return false;},{passive:false});}catch(e){}
 try{document.body.style.userSelect='none';document.body.style.webkitUserSelect='none';document.body.style.webkitTouchCallout='none';}catch(e){}
 return PLAT;
}
function gameplayStart(){gameplayWanted=true;syncGameplay();}
function gameplayStop(){gameplayWanted=false;gameplayMarked=false;
 try{PLAT.ysdk&&PLAT.ysdk.features&&PLAT.ysdk.features.GameplayAPI&&PLAT.ysdk.features.GameplayAPI.stop();}catch(e){}}
/* ads: interstitial at natural break (sound paused for the ad) */
function showInterstitial(){
 if(!PLAT.ysdk||!PLAT.ysdk.adv)return Promise.resolve(false);
 pauseForAd();
 return new Promise(res=>{try{
  PLAT.ysdk.adv.showFullscreenAdv({callbacks:{onClose:()=>{resumeForAd();res(true);},
   onError:()=>{resumeForAd();res(false);},onOffline:()=>{resumeForAd();res(false);}}});
 }catch(e){resumeForAd();res(false);}});
}
/* rewarded video: grants premium auto-assemble in Yandex build */
function showRewarded(){
 if(!PLAT.ysdk||!PLAT.ysdk.adv||!PLAT.ysdk.adv.showRewardedVideo)return Promise.resolve(false);
 pauseForAd();
 return new Promise(res=>{let reward=false;try{
  PLAT.ysdk.adv.showRewardedVideo({callbacks:{
   onRewarded:()=>{reward=true;},
   onClosed:()=>{resumeForAd();res(reward);},
   onError:()=>{resumeForAd();res(false);},
   onOffline:()=>{resumeForAd();res(false);}}});
 }catch(e){resumeForAd();res(false);}});
}
window.showRewarded=showRewarded;
/* cloud save/load of progress (works for guests too) */
async function cloudSave(obj){
 if(!PLAT.player)return false;
 try{await PLAT.player.setData({matbum:obj},true);return true;}catch(e){return false;}
}
async function cloudLoad(){
 if(!PLAT.player)return null;
 try{const d=await plDeadline(PLAT.player.getData(),5000,'cloud timeout');
  return d&&d.matbum?d.matbum:null;}catch(e){return null;}
}
/* leaderboard */
async function lbSubmit(score,board){
 if(!PLAT.ysdk||!PLAT.ysdk.getLeaderboards)return;
 try{const lb=await PLAT.ysdk.getLeaderboards();await lb.setLeaderboardScore(board||'main',score);}catch(e){}
}
async function lbTop(n){
 if(!PLAT.ysdk||!PLAT.ysdk.getLeaderboards)return null;
 try{const lb=await PLAT.ysdk.getLeaderboards();
  const r=await lb.getLeaderboardEntries('main',{quantityTop:n||5,includeUser:true,quantityAround:2});
  return r.entries.map(e=>({name:(e.player&&e.player.publicName)||'?',score:e.score}));
 }catch(e){return null;}
}
window.PLAT=PLAT;window.initPlatform=initPlatform;window.gameReady=gameReady;
window.gameplayStart=gameplayStart;window.gameplayStop=gameplayStop;
window.showInterstitial=showInterstitial;window.cloudSave=cloudSave;window.cloudLoad=cloudLoad;
window.lbSubmit=lbSubmit;window.lbTop=lbTop;

/* ------------------------- progress & prefs ------------------------- */
let PROG={best:new Array(COLS).fill(0),bestFair:new Array(COLS).fill(0),bestAuto:new Array(COLS).fill(0),unlocked:new Array(COLS).fill(false)};
function loadLocal(){
 try{const r=JSON.parse(localStorage.getItem('matbum_v1'));
  if(r&&r.best)PROG={best:r.best.slice(0,COLS),bestFair:(r.bestFair||r.best).slice(0,COLS),bestAuto:(r.bestAuto||[]).concat(new Array(COLS).fill(0)).slice(0,COLS),unlocked:!!r.unlocked?r.unlocked.slice(0,COLS):PROG.unlocked};
 }catch(e){}
 try{const t=localStorage.getItem('matbum_theme');if(t==='light'||t==='dark')applyTheme(t,false);}catch(e){}
}
function saveProg(cloud){
 try{localStorage.setItem('matbum_v1',JSON.stringify(PROG));}catch(e){}
 if(cloud!==false)cloudSave(PROG);
}
async function mergeCloud(){
 const c=await cloudLoad();
 if(!c)return;
 for(let i=0;i<COLS;i++){
  PROG.best[i]=Math.max(PROG.best[i]||0,c.best&&c.best[i]||0);
  PROG.bestFair[i]=Math.max(PROG.bestFair[i]||0,c.bestFair&&c.bestFair[i]||0);
  PROG.bestAuto[i]=Math.max(PROG.bestAuto[i]||0,c.bestAuto&&c.bestAuto[i]||0);
  PROG.unlocked[i]=(PROG.unlocked[i]||!!(c.unlocked&&c.unlocked[i]));
 }
 try{localStorage.setItem('matbum_v1',JSON.stringify(PROG));}catch(e){}
}

 paintChrome();if(curScreen==='museum')renderMuseum();}

/* ------------------------------ screens ----------------------------- */
let curScreen='start',interQ=false;

 document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='scr-'+id));

 if(id==='hall')renderHall();

 if(id==='start'||id==='select'){ if(interQ){interQ=false;showInterstitial();} }

}

function renderSelect(){
 const g=$u('colgrid');g.innerHTML='';
 for(let i=0;i<COLS;i++){
  const b=document.createElement('button');b.className='colcard'+(PROG.unlocked[i]?'':' locked');b.type='button';
  b.innerHTML='<span class="num">'+(i+1)+'</span><img class="fig" alt="" src="'+FIGIMG[i]+'" onerror="figErr(this)">'
   +'<div class="nm">'+T('fig'+i)+'</div>'
   +'<div class="bst">'+(PROG.best[i]?T('best')+': '+PROG.best[i]:'—')+'</div>'
   +(PROG.unlocked[i]?'<span class="done">✔</span>':'');

/* ------------------------------- hall: two rankings ------------------------------- */
function hallSec(title,sub,rows,empty){
 const d=document.createElement('div');d.className='card';
 let h='<h2>'+title+'</h2>'+(sub?'<p class="sub">'+sub+'</p>':'');
 if(!rows.length)h+='<p class="sub" style="margin-top:10px">'+empty+'</p>';
 rows.forEach((r,k)=>{h+='<div class="hallrow"><span class="rk">'+(k+1)+'</span><img width="30" height="30" style="border-radius:8px;object-fit:cover" alt="" src="'+FIGIMG[r[0]]+'" onerror="figErr(this)">'
  +'<span class="nm">'+T('column')+' '+(r[0]+1)+' · '+T('fig'+r[0])+'</span><span class="sc">'+r[1]+'</span></div>';});
 d.innerHTML=h;return d;
}
function renderHall(){
 const host=$u('hall-list');host.innerHTML='';
 const rowsF=[],rowsA=[];
 for(let i=0;i<COLS;i++){
  if(PROG.bestFair[i]>0)rowsF.push([i,PROG.bestFair[i]]);
  if(PROG.bestAuto[i]>0)rowsA.push([i,PROG.bestAuto[i]]);
 }
 rowsF.sort((x,y)=>y[1]-x[1]);rowsA.sort((x,y)=>y[1]-x[1]);
 host.appendChild(hallSec(T('hall_fair'),'',rowsF,T('hall_empty')));
 host.appendChild(hallSec(T('hall_auto'),T('hall_auto_sub'),rowsA,T('hall_empty')));
 const tot=PROG.best.reduce((x,y)=>x+y,0);
 $u('hall-total').textContent=T('hall_total')+': '+tot;
 lbTop(5,'main').then(list=>{
  const ya=$u('hall-ya');ya.innerHTML='';
  if(!list||!list.length)return;
  const h=document.createElement('div');h.className='card';h.innerHTML='<h2>Yandex Games — TOP 5 ('+T('hall_fair')+')</h2>';
  list.forEach((e,i)=>{const d=document.createElement('div');d.className='hallrow';
   d.innerHTML='<span class="rk">'+(i+1)+'</span><span class="nm">'+e.name+'</span><span class="sc">'+e.score+'</span>';
   h.appendChild(d);});
  ya.appendChild(h);
 });
}
/* ------------------------------ museum ------------------------------ */
function renderMuseum(){
 const g=$u('musgrid');g.innerHTML='';
 for(let i=0;i<COLS;i++){
  const un=PROG.unlocked[i];
  const d=document.createElement('div');d.className='muscard ped'+(un?'':' locked');
  d.innerHTML='<div class="dome'+(un?'':' lockdome')+'"><img alt="" src="'+(un?FIGIMG[i]:ICONS['ui-lock'])+'"'+(un?' onerror="figErr(this)"':'')+'></div>'
   +'<div class="base"></div>'
   +'<div class="plate">'+T('column')+' '+(i+1)+' · '+(un?T('fig'+i):'?')+'</div>'
   +(un?'':'<div class="bst sub" style="font-size:9.5px;margin-top:2px">'+T('museum_locked')+'</div>');

  g.appendChild(d);
 }

function openFig(i){
 if(!PROG.unlocked[i])return; /* locked: no big card at all */
 $u('fig-big').src=FIGCARD(i);$u('fig-big').onerror=function(){figErr(this);};$u('fig-big').dataset.fb='';

 $u('fig-big').style.filter='';
 $u('fig-big-name').textContent=T('column')+' '+(i+1)+' — '+T('fig'+i);

}

/* ---------------------------- game flow ----------------------------- */
let lastFinale=null;
/* training mode: scripted demo, then free play with any-op first layer */
let trainPhase=0,pendingTrain=false;
function trainSeen(){try{return !!localStorage.getItem('matbum_train');}catch(e){return true;}}
function setPlate(step,txt){const p=$u('trainPlate');p.hidden=false;
 $u('trStep').textContent=T('tr_step',{n:step});
 const t=$u('trText');
 if(step===2){t.innerHTML=txt.replace(/«5»/g,'<b class="t5">«5»</b>');}
 else t.textContent=txt;
 $u('hint2').style.display='none';}
window.addEventListener('mb:tsel',e=>{const n=e.detail||0;
 document.querySelectorAll('#trText .t5').forEach((el,k)=>el.classList.toggle('on',k<n));});
function hidePlate(){$u('trainPlate').hidden=true;$u('hint2').style.display='';}
function showChip(text,mode,step){const c=$u('trainChip');c.hidden=false;$u('tcText').textContent=(step?T('tr_step',{n:step})+' · ':'')+text;
 const endB=$u('tcEnd'),cont=$u('tcCont'),menu=$u('tcMenu');
 if(mode==='end'){endB.hidden=false;endB.textContent=T('tr_end');cont.hidden=true;menu.hidden=true;}
 else{endB.hidden=true;cont.hidden=false;menu.hidden=false;cont.textContent=T('tr_cont');menu.textContent=T('tr_menu');}}
function hideChip(){$u('trainChip').hidden=true;}
function startTraining(){
 trainPhase=1;hideChip();
 MB.trainAPI.phase(1);
 setPlate(1,T('train1'));
}
window.addEventListener('mb:train1',()=>{if(trainPhase!==1)return;trainPhase=2;MB.trainAPI.phase(2);setPlate(2,T('train2'));});
window.addEventListener('mb:train2',()=>{if(trainPhase!==2)return;trainPhase=4;MB.trainAPI.phase(3);hidePlate();
 try{localStorage.setItem('matbum_train','1');}catch(e){}
 showChip(T('train4'),'final');});
$u('tcCont').onclick=()=>{S.click();hideChip();MB.trainAPI.any(false);trainPhase=0;};
$u('tcMenu').onclick=()=>{S.click();hideChip();trainPhase=0;MB.trainAPI.any(false);MB.stop();showScreen('start');};
function startCol(i,train){
 showScreen('game');
 closeOv('ov-pause');closeOv('ov-finale');hideChip();hidePlate();trainPhase=0;
 const hf=$u('hud-fig');if(hf){hf.src=FIGIMG[i];hf.title=T('fig'+i);hf.alt=T('fig'+i);}
 MB.start(i,opsFor(i),{train:!!train});
 if(train&&MB.dbg().train)startTraining();
}
MB.onFinale=st=>{
 lastFinale=st;
 const col=st.col,rec=st.score>(PROG.best[col]||0);
 if(rec)PROG.best[col]=st.score;
 if(st.auto){if(st.score>(PROG.bestAuto[col]||0))PROG.bestAuto[col]=st.score;}
 else{if(st.score>(PROG.bestFair[col]||0))PROG.bestFair[col]=st.score;}
 const first=!PROG.unlocked[col];
 PROG.unlocked[col]=true;
 saveProg();
 lbSubmit(st.score,st.auto?'auto':'main');
 interQ=true;
 $u('fin-score').innerHTML=T('score')+': <b>'+st.score+'</b>';
 const mm=(st.time/60|0)+':'+String(st.time%60).padStart(2,'0');
 $u('fin-info').innerHTML=T('time')+': <b>'+mm+'</b> · '+T('moves')+': <b>'+st.moves+'</b>';
 $u('fin-extra').innerHTML=(first?'<p style="color:#7ef0b2">'+T('fin_unlock')+'</p>':'')
  +(rec?'<p style="color:#ffe9a3">'+T('fin_record')+'</p>':'');
 const cv=$u('finFig');cv.src=FIGHERO(col);cv.onerror=function(){figErr(this);};
 $u('fin-name').textContent=T('column')+' '+(col+1)+' — '+T('fig'+col);
 openOv('ov-finale');
};
$u('fin-menu').onclick=()=>{closeOv('ov-finale');MB.stop();showScreen('start');};
$u('fin-again').onclick=()=>{closeOv('ov-finale');startCol(lastFinale.col);};
$u('fin-next').onclick=()=>{closeOv('ov-finale');startCol((lastFinale.col+1)%COLS);};

/* ------------------------------- pause ------------------------------ */
function openOv(id){const n=$u(id);if(n)n.classList.add('on');}
function closeOv(id){const n=$u(id);if(n)n.classList.remove('on');}
function openPause(){ if(curScreen!=='game')return;
 if(!MB.active()){MB.stop();showScreen('select');return;}
 MB.setActive(false);openOv('ov-pause');}
function resumeGame(){ closeOv('ov-pause');MB.setActive(true);}
$u('p-resume').onclick=resumeGame;
$u('p-exit').onclick=()=>{closeOv('ov-pause');MB.stop();showScreen('start');};
window.addEventListener('mb:pause',()=>{if(curScreen==='game')openPause();});
window.addEventListener('mb:resume',()=>{closeOv('ov-pause');if(curScreen==='game')MB.setActive(true);});
/* in-game back button -> pause */
$u('btn-back').addEventListener('click',()=>{ if(curScreen==='game'){openPause();return;} showScreen('start');});
/* confirm exit unused now (pause covers it) */

/* ------------------------------ chrome ops -------------------------- */
$u('btn-lang').addEventListener('click',()=>{setLang(lang()==='ru'?'en':'ru');paintStatic();
 if(curScreen==='start')renderStartSides();
 if(curScreen==='select')renderSelect();if(curScreen==='hall')renderHall();
 if(curScreen==='museum')renderMuseum();if(curScreen==='help')renderHelp();
 if(trainPhase===1)setPlate(1,T('train1'));else if(trainPhase===2)setPlate(2,T('train2'));});
window.addEventListener('mb:terr',()=>{const t=$u('trText');if(!t)return;
 t.classList.add('terr');t.textContent=T('tr_order_err');});
window.addEventListener('mb:tok',()=>{const t=$u('trText');if(!t||!t.classList.contains('terr'))return;
 t.classList.remove('terr');
 if(trainPhase===1)setPlate(1,T('train1'));else if(trainPhase===2)setPlate(2,T('train2'));});
$u('btn-theme').addEventListener('click',()=>{applyTheme(theme==='dark'?'light':'dark');});
$u('btn-sound').addEventListener('click',()=>{const on=setSound(!isSoundOn());if(on)S.click();paintChrome();});

/* menu buttons */
$u('b-play').addEventListener('click',()=>{S.click();showScreen('select');});
$u('b-hall').addEventListener('click',()=>{S.click();showScreen('hall');});
$u('b-museum').addEventListener('click',()=>{S.click();showScreen('museum');});
$u('b-help').addEventListener('click',()=>{S.click();showScreen('help');});
$u('b-train').addEventListener('click',()=>{S.click();pendingTrain=true;showScreen('select');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&curScreen==='game')openPause();});
/* desktop hotkeys: arrows rotate/tilt, space auto, M sound */
document.addEventListener('keydown',e=>{
 if(curScreen!=='game'||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(k==='ArrowLeft'){$('bL').click();e.preventDefault();}
 else if(k==='ArrowRight'){$('bR').click();e.preventDefault();}
 else if(k==='ArrowUp'){$('bU').click();e.preventDefault();}
 else if(k==='ArrowDown'){$('bD').click();e.preventDefault();}
 else if(k===' '){$('bAuto').click();e.preventDefault();}
 else if(k==='m'||k==='M'||k==='ь'||k==='Ь'){$('btn-sound').click();}
});

/* --------------------- desktop form + start sides --------------------- */
function detectForm(){const d=window.matchMedia&&matchMedia('(pointer: fine)').matches&&innerWidth>=1024;
 document.body.classList.toggle('desktop',!!d);document.body.classList.toggle('mobile',!d);}
addEventListener('resize',detectForm);
function renderStartSides(){
 const L=$u('side-l'),R=$u('side-r');if(!L||!R)return;
 let open=0;for(let i=0;i<COLS;i++)if(PROG.unlocked[i])open++;
 let h='<h3>'+T('museum_title')+'</h3><div class="minigrid" id="minigrid"></div><div class="sub">'+T('side_open',{a:open,b:COLS})+'</div>';
 L.innerHTML=h;
 const g=$u('minigrid');
 for(let i=0;i<COLS;i++){
  const un=PROG.unlocked[i];
  const im=document.createElement('img');im.alt='';im.title=T('fig'+i);
  im.src=un?FIGIMG[i]:ICONS['ui-lock'];
  if(un)im.onerror=function(){figErr(this);};
  if(un){im.className='un';im.addEventListener('click',()=>openFig(i));}
  else im.className='lk';
  g.appendChild(im);}
 const rows=[];for(let i=0;i<COLS;i++)if(PROG.best[i]>0)rows.push([i,PROG.best[i]]);
 rows.sort((a,b)=>b[1]-a[1]);
 let r='<h3>'+T('side_top')+'</h3>';
 if(!rows.length)r+='<div class="sub">'+T('hall_empty')+'</div>';
 rows.slice(0,3).forEach((e,k)=>{r+='<div class="srow"><span class="rk">'+(k+1)+'</span><span>'+T('column')+' '+(e[0]+1)+' · '+T('fig'+e[0])+'</span><span class="sc">'+e[1]+'</span></div>';});
 const tot=PROG.best.reduce((a,b)=>a+b,0);
 r+='<div class="srow" style="margin-top:8px"><span>'+T('side_total')+'</span><span class="sc">'+tot+'</span></div>';
 r+='<div id="side-ya"></div>';
 R.innerHTML=r;
 lbTop(3,'main').then(list=>{const ya=$u('side-ya');if(!ya)return;ya.innerHTML='';
  if(!list||!list.length)return;
  let y='<h3 style="margin-top:10px">'+T('side_ya')+'</h3>';
  list.forEach((e,i)=>{y+='<div class="srow"><span class="rk">'+(i+1)+'</span><span>'+e.name+'</span><span class="sc">'+e.score+'</span></div>';});
  ya.innerHTML=y;});
}
/* ------------------------------- boot ------------------------------- */
async function boot(){
 detectForm();
 loadLocal();
 const pl=await initPlatform();
 let chose=false;try{chose=!!localStorage.getItem('matbum_lang');}catch(e){}
 if(!chose&&pl.lang==='en')setLang('en');
 await mergeCloud();
 paintStatic();
 showScreen('start');
 gameReady();
}
window.MB_VERSION=VERSION;
boot();
