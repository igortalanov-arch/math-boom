/* ============================== МУЛЬТИПЛЕЕР ==========================
   По мотивам «камень-ножницы-бум»: пошаговая дуэль через хранилище
   площадки (VK Bridge Storage) или localStorage в демо-режиме.
   Матч детерминирован: seed доски + список свапов. Каждый клиент
   проигрывает их локально, поэтому поле и очки совпадают без трафика.
   ===================================================================== */
const MP = {
  code: null, role: 'a', seq: 0, timer: null, polling: false, st: null,
  nick2: '', lobbyTimer: null, searching: false,
  key() { return MBNet.key + this.code; },
  color() { return this.role === 'a' ? 'gold' : 'blue'; },
  oppColor() { return this.role === 'a' ? 'blue' : 'gold'; },
  myTurn() { return !!this.code && ST.turn === this.color(); },
  nick() { return this.nick2 || ''; },

  reset() {
    this.stopPoll(); this.stopLobby();
    this.code = null; this.role = 'a'; this.seq = 0; this.st = null; this.nick2 = '';
    this.searching = false;
  },
  stopPoll() { if (this.timer) { clearTimeout(this.timer); this.timer = null; } this.polling = false; },
  stopLobby() { if (this.lobbyTimer) { clearTimeout(this.lobbyTimer); this.lobbyTimer = null; } },

  /* --- создание / вход --- */
  async create(lvl) {
    this.reset();
    this.code = MBNet.randCode();
    this.role = 'a';
    const st = {
      id: MBNet.ME, a: { nick: MBNet.NICK }, b: null,
      seed: MBNet.seedOf(this.code), lvl: lvl == null ? ST.level : lvl,
      board: BOARD, moves: [], ended: null, ts: Date.now(),
      /* 3.0: правило фиксируется хостом и синхронизируется гостю */
      rule: PROG.rule, sumTarget: 10,
      /* 3.1: резерв задаёт хост; расход детерминирован одинаковыми свапами */
      reserve: reserveFor(PROG.rule, lvl == null ? ST.level : lvl)
    };
    this.st = st;
    const ok = await MBNet.set(this.key(), st);
    return ok ? this.code : null;
  },
  async join(code) {
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 4) return { ok: false, why: 'code' };
    const key = MBNet.key + code;
    let st = await MBNet.get(key);
    if (!st) return { ok: false, why: 'none' };
    if (st.b && st.id !== MBNet.ME) return { ok: false, why: 'full' };
    /* 2.9 (техдолг #7): хранилище не атомарное — двое могли прочитать пустой слот
       одновременно. Перед записью перечитываем и разводим попытки по времени. */
    await new Promise(r => setTimeout(r, 70 + Math.random() * 160));
    const st2 = await MBNet.get(key);
    if (!st2) return { ok: false, why: 'none' };
    if (st2.b && st2.id !== MBNet.ME) return { ok: false, why: 'full' };
    st = st2;
    this.reset();
    this.code = code;
    this.role = 'b';
    st.b = { nick: MBNet.NICK, id: MBNet.ME };
    st.ts = Date.now();
    await MBNet.set(key, st);
    /* контрольная проверка: если нас переписали — честно выходим */
    const chk = await MBNet.get(key);
    if (chk && chk.b && chk.b.id !== MBNet.ME) { this.reset(); return { ok: false, why: 'full' }; }
    this.st = st;
    this.nick2 = (st.a && st.a.nick) || '';
    return { ok: true };
  },
  /* хост ждёт второго игрока */
  waitJoin(cb) {
    this.stopLobby();
    const tick = async () => {
      const st = await MBNet.get(this.key());
      if (st && st.b) {
        this.st = st; this.nick2 = (st.b && st.b.nick) || '';
        this.stopLobby();
        cb(st);
        return;
      }
      this.lobbyTimer = setTimeout(tick, 1600);
    };
    this.lobbyTimer = setTimeout(tick, 900);
  },
  /* гость ждёт, пока хост подтвердит старт (поле уже известно из записи) */
  beginFromState(st) {
    ST.mode = 'mp'; MODE = 'mp';
    ST.training = false; TUT.on = false; TUT.step = 0;
    ST.rival = 0;
    ST.level = clamp(st.lvl == null ? 1 : st.lvl, 0, 2);
    /* 3.0: гость принимает правило хоста — «у меня было другое» не работает */
    PROG.rule = (RULES3.indexOf(st.rule) >= 0) ? st.rule : 'same';
    E.setRule(PROG.rule, (typeof st.sumTarget === 'number' ? st.sumTarget : 10));
    E.setReserve(typeof st.reserve === 'number' ? st.reserve : reserveFor(PROG.rule, ST.level));
    ST.target = E.targetFor(PROG.rule, ST.level);
    setBoard(st.board == null ? BOARD : st.board, true);
    resetMatchState();
    ST.grid = prepTiles(E.newBoard(E.rng(st.seed)));
    this.seq = (st.moves || []).length;
    hudMode();
    closeAllOv();
    showScreen('game');
    paintRivalHUD(); paintHUD(); layoutCanvas(); paintRuleUI();
    startTimer();
    gameIntro();
  },
  /* --- ходы --- */
  rsSeed(i) { return (MBNet.seedOf(this.code || 'X') ^ Math.imul(i + 1, 7919)) >>> 0; },
  async pushEvent(ev) {
    this.seq++;
    try {
      const st = (await MBNet.get(this.key())) || this.st;
      if (!st) return;
      (st.moves = st.moves || []).push(ev);
      st.ts = Date.now();
      this.st = st;
      await MBNet.set(this.key(), st);
    } catch (e) {}
  },
  async push(mv) {
    return this.pushEvent({ r1: mv.r1, c1: mv.c1, r2: mv.r2, c2: mv.c2 });
  },
  startPoll(ms) {
    if (this.timer || !this.code) return;
    const tick = async () => {
      this.timer = null;
      if (!this.code) return;
      this.polling = true;
      let st = null;
      try { st = await MBNet.get(this.key()); } catch (e) {}
      this.polling = false;
      if (st) {
        this.st = st;
        if (st.b && !this.nick2) this.nick2 = (st.b.nick || '');
        const evs = st.moves || [];
        if (evs.length > this.seq) {
          const idx = this.seq, next = evs[idx];
          this.seq++;
          if (next && next.rs) {        /* автошейк соперника — повторяем с тем же сидом */
            const before = snapshotPositions();
            E.reshuffle(ST.grid, E.rng(this.rsSeed(idx)));
            await animateShuffle(before);
            this.timer = setTimeout(tick, 900);
            return;
          }
          await mpRemoteMove(next);
          return;                       /* следующий опрос запустит beginTurn */
        }
        if (st.ended && !ST.over) {
          endMatch(compareWinner(), st.reason || 'target');
          return;
        }
      }
      if (ST.mode === 'mp' && !ST.over) this.timer = setTimeout(tick, ms || 1400);
    };
    this.timer = setTimeout(tick, ms || 1400);
  },
  async finish(winner) {
    this.stopPoll();
    if (!this.code) return;
    try {
      const st = (await MBNet.get(this.key())) || this.st;
      if (st && !st.ended) {
        st.ended = this.role;
        st.reason = winner === 'draw' ? 'empty' : 'target';
        st.ts = Date.now();
        this.st = st;
        await MBNet.set(this.key(), st);
      }
    } catch (e) {}
  }
};
async function mpRemoteMove(mv) {
  MP.stopPoll();
  ST.busy = true; paintHUD();
  setBanner('ai');
  await sleep(280);
  await highlightPair(mv, MP.oppColor());
  const gained = await performSwap(mv, MP.oppColor());
  if (checkEnd()) return;
  /* 2.6: если соперник собрал первую линию — он ходит ещё раз */
  if (streakAfter(MP.oppColor(), gained)) {
    ST.turn = MP.oppColor();
    ST.busy = true; paintHUD();
    MP.startPoll();
    return;
  }
  ST.turn = MP.color();
  beginTurn();
}
/* быстрый поиск: сначала ищем живую заявку в очереди, иначе встаём в очередь */
async function mpQuick(lvl) {
  const now = Date.now();
  let freeSlot = -1, mineSlot = -1;
  for (let i = 0; i < MBNet.SLOTS; i++) {
    const k = MBNet.key + 'q_' + i;
    let e = null;
    try { e = await MBNet.get(k); } catch (err) {}
    if (!e || now - (e.ts || 0) > MBNet.FRESH) { freeSlot = i; break; }
    if (e && e.id === MBNet.ME) { mineSlot = i; continue; }
    if (e && e.id !== MBNet.ME) {
      const r = await MP.join(e.code);
      if (r.ok) { MP.beginFromState(MP.st); return 'joined'; }
    }
  }
  /* 2.9 (техдолг #12): если все 8 слотов заняты живыми заявками, свою не пишем —
     иначе можно сломать чужой матч */
  const slot = freeSlot >= 0 ? freeSlot : mineSlot;
  if (slot < 0) { MP.reset(); return 'busy'; }
  const code = await MP.create(lvl);
  if (!code) return 'fail';
  await MBNet.set(MBNet.key + 'q_' + slot, { id: MBNet.ME, ts: now, code: code });
  return 'waiting';
}

/* ============================== ОБУЧЕНИЕ 2.3 =========================
   Три шага, каждый заканчивается действием игрока:
     1) затемнение, две выделенные соседние фишки, свап → линия светится;
     2) реклама → подсказка лучшего хода → свап по стрелке → линия исчезает;
     3) реклама → перемешивание оставшихся фишек.
   В конце: «Повторить обучение?» и «Вернуться в меню».
   ===================================================================== */
function startTutorial(mode) {
  /* 3.0: обучение идёт по выбранному правилу (и по нему же генерируется доска) */
  if (RULES3.indexOf(mode) >= 0 && mode !== PROG.rule) setRule(mode, true);
  E.setRule(PROG.rule, 10);
  MODE = 'solo'; ST.mode = 'solo'; ST.training = true; TUT.on = true; TUT.step = 0;
  ST.rival = 0; ST.level = 0; ST.target = 0;
  resetMatchState();
  ST.target = E.targetFor(PROG.rule, 0);            /* 3.2: цель 1-го уровня — для текста шага 1 */
  E.setReserve(-1);                                   /* 3.1: до шага «резерв» пул бесконечный */
  TUT.on = true;
  ST.grid = prepTiles(E.newBoard(Math.random));
  hudMode();
  showScreen('game');
  paintRivalHUD(); paintHUD(); layoutCanvas();
  docTut(true);
  tutIntro();
}

/* подобрать свап, который даёт игроку ровно три в ряд */
function tutPickMove(grid) {
  const swaps = E.allSwaps(grid, 'gold');
  let fallback = null;
  for (let i = 0; i < swaps.length; i++) {
    const mv = swaps[i];
    const g2 = E.cloneGrid(grid);
    E.swapCells(g2, mv.r1, mv.c1, mv.r2, mv.c2);
    const plan = E.resolvePlan(g2);
    if (!plan.phases.length) continue;
    const golds = plan.phases[0].groups.filter(g => g.c === 'gold');
    if (!golds.length) continue;
    if (!fallback) fallback = { r1: mv.r1, c1: mv.c1, r2: mv.r2, c2: mv.c2 };
    return { r1: mv.r1, c1: mv.c1, r2: mv.r2, c2: mv.c2, cells: golds[0].cells };
  }
  return fallback;
}
/* 3.2: свап, который даёт линию из четырёх — принудительная ракета */
function tutPickMove4(grid) {
  const swaps = E.allSwaps(grid, 'gold');
  for (let i = 0; i < swaps.length; i++) {
    const mv = swaps[i];
    const g2 = E.cloneGrid(grid);
    E.swapCells(g2, mv.r1, mv.c1, mv.r2, mv.c2);
    const plan = E.resolvePlan(g2);
    if (!plan.phases.length) continue;
    const golds = plan.phases[0].groups.filter(g => g.c === 'gold');
    if (!golds.some(g => g.cells.length >= 4)) continue;
    return { r1: mv.r1, c1: mv.c1, r2: mv.r2, c2: mv.c2 };
  }
  return null;
}
function tutHasMove(grid) {
  return !!E.bestMove(grid, 'gold');
}
async function tutPrepRocket() {
  let pair = null;

    ST.grid = prepTiles(E.newBoard(Math.random));

  }
  if (!pair) pair = tutPickMove(ST.grid);          /* страховка: хотя бы тройка */
  TUT.lock = pair ? [[pair.r1, pair.c1], [pair.r2, pair.c2]] : null;
  TUT.can = !!pair;
  ST.busy = false;
  tutReveal();
  buildSprites(); layoutCanvas();

}
async function tutEnsureMove() {

    const before = snapshotPositions();
    if (!E.reshuffle(ST.grid, Math.random)) break;

}

function tutRender() {
  const n = TUT.step;
  const skip = { id: 'tut-skip', text: T('btn_skip'), on: tutSkip };
  const next = (to) => ({ id: 'tut-next', text: T('tut_next'), on: () => { sfx('click'); tutGo(to || n + 1); } });
  const target = ST.target || (LEVELS[0] && LEVELS[0].target) || 80;
  if (n === 1) {                                   /* знакомство */
    tutSheet(T('tut_intro', { t: target }), [next(2), skip]);
    return;
  }
  if (n === 2) {                                   /* своп: три в линию */
    tutSheet(T('tut1_' + PROG.rule), [skip]);
    return;
  }
  if (n === 3) {                                   /* спецплитка: четвёрка → ракета */
    tutSheet(T('tut_rocket'), [skip]);
    return;
  }
  if (n === 4) {                                   /* комбо ×2 */
    tutSheet(TUT.combo >= 1 ? T('tut_combo_one') : T('tut_combo'), [skip]);
    return;
  }
  if (n === 5) {                                   /* резерв */
    tutSheet(T('tut_reserve', { v: E.getReserveTotal() }), [skip]);
    return;
  }
  tutSheet(T('tut_summary', { t: target }) + '<br><br>' + T('tut_end'), [
    { id: 'tut-again', text: T('tut_again'), on: () => { sfx('click'); startTutorial(PROG.rule); } },
    { id: 'tut-menu', text: T('tut_menu'), on: () => { sfx('click'); tutFinish(true); } }
  ]);
}
async function tutGo(n) {

  ST.selected = null; ST.hint = null; ST.busy = true;
  paintHUD(); docTut(n >= 2 && n < TUT_STEPS);
  if (n === 1) {                                   /* знакомство — без действия */
    ST.busy = false; tutRender(); paintHUD(); return;
  }
  if (n === 2) {                                   /* своп */
    TUT.combo = 0;
    const pair = tutPickMove(ST.grid);
    if (pair) { TUT.lock = [[pair.r1, pair.c1], [pair.r2, pair.c2]]; TUT.can = true; ST.busy = false; }
    else { await tutEnsureMove(); ST.busy = false; }
    tutRender(); paintHUD(); return;
  }
  if (n === 3) {                                   /* ракета */
    await tutPrepRocket();
    tutRender(); paintHUD(); return;
  }
  if (n === 4) {                                   /* комбо ×2 */
    TUT.combo = 0;
    await tutEnsureMove();
    ST.busy = false; TUT.can = true;
    tutRender(); paintHUD(); return;
  }
  if (n === 5) {                                   /* резерв */
    E.setReserve(reserveFor(PROG.rule, 0));
    TUT.res0 = E.getReserve();
    ST.busy = false; TUT.can = true;
    await tutEnsureMove();
    paintReserve(); paintHUD(); paintDrawer(); tutRender(); return;
  }
  /* 6 — сводка */
  TUT.can = false; ST.busy = true;
  tutRender(); paintHUD();
}
function tutSkip() { sfx('click'); tutFinish(true); }
function tutFinish(force) {
  TUT.on = false; TUT.step = 0; TUT.lock = null; TUT.need = null; TUT.can = false;
  ST.training = false;
  $('ov-tut').classList.remove('on');
  $('ov-tut').style.bottom = '';
  docTut(false);
  requestAnimationFrame(layoutCanvas);
  try { localStorage.setItem('mbduel_tut', '1'); } catch (e) {}
  PROG.tut = 1; saveProg(false);
  ST.over = true; ST.busy = true;
  stopMatch();
  showScreen('start');
  if (!force) maybeInterstitial();
}
/* ход сделан: линия уже собрана и погасла штатным FX */
async function tutAfterMove(mv, gained) {
  const n = TUT.step;
  if (n === 2) {
    ST.busy = true;
    await sleep(420);
    if (!gained) { tutGo(2); toast(T('tut_try_again')); return; }
    tutGo(3);
    return;
  }
  if (n === 3) {
    ST.busy = true;
    await sleep(560);           /* даём ракете родиться и блеснуть */
    tutGo(4);
    return;
  }
  if (n === 4) {
    ST.busy = true;
    if (gained) TUT.combo++; else TUT.combo = 0;
    await sleep(420);
    if (TUT.combo >= 2) { tutGo(5); return; }
    ST.busy = false; TUT.can = true;
    tutRender(); paintHUD();
    return;
  }
  if (n === 5) {
    ST.busy = false; TUT.can = false;
    const now = E.getReserve();
    paintReserve(); paintHUD();
    tutSheet(T('tut_reserve_ok', { a: TUT.res0, b: now }), [
      { id: 'tut-next', text: T('tut_next'), on: () => { sfx('click'); tutGo(6); } }
    ]);
    return;
  }
  ST.busy = false; paintHUD();
}

/* кнопка подсказки в туториале */
async function tutHint() {
  if (TUT.busy) return;
  TUT.busy = true; ST.busy = true; paintHUD();
  const ok = await requestReward();
  if (!ok) { TUT.busy = false; ST.busy = true; paintHUD(); return; }
  const b = E.bestMove(ST.grid, 'gold');
  if (!b) { TUT.busy = false; ST.busy = true; paintHUD(); return; }
  TUT.need = [[b.move.r1, b.move.c1], [b.move.r2, b.move.c2]];
  ST.hint = { a: TUT.need[0], b: TUT.need[1], until: performance.now() + 1e9 };
  sfx('hint');
  toast(T('toast_hint'));
  TUT.busy = false; TUT.can = true; ST.busy = false;
  paintHUD();
}
/* кнопка перемешивания в туториале */
async function tutShuffle() {
  if (TUT.busy) return;
  TUT.busy = true; ST.busy = true; paintHUD();
  const ok = await requestReward();
  if (!ok) { TUT.busy = false; ST.busy = true; paintHUD(); return; }
  const before = snapshotPositions();
  if (E.reshuffle(ST.grid, Math.random)) { sfx('shuffle'); await animateShuffle(before); }
  TUT.busy = false;
  ST.busy = true;
  await sleep(160);
  tutGo(4);
}


/* ===================== 3.2: шторка статистики ===================== */
let DRW_TIMER = null;
/* 3.2: подписи шторки — на обоих языках */
function paintDrawerLabels() {
  if (!$('drw-title')) return;
  $('drw-title').textContent = T('drw_title');
  $('drw-time-lbl').textContent = T('drw_time');
  $('drw-best-lbl').textContent = T('drw_best');
  $('drw-sp-lbl').textContent = T('drw_specials');
  $('drw-help').textContent = T('tut_title');
  $('drw-pause').textContent = T('pause_title');
  $('drw-restart').textContent = T('pause_restart');
  const d = $('drawer').querySelector('.drw-panel');
  if (d) d.setAttribute('aria-label', T('drw_aria'));
  $('drw-x').setAttribute('aria-label', T('btn_back'));
}
function paintDrawer() {
  const tl = $('drw-time');
  if (tl) tl.textContent = fmtTime(ST.secs || 0);
  const rt = $('drw-ruletxt');
  if (rt) rt.textContent = T('rule_' + PROG.rule + '_sub');
}
function openDrawer() {
  if (curScreen !== 'game') return;
  sfx('click');
  paintDrawer();
  const d = $('drawer');
  d.classList.remove('closing');
  d.classList.add('on');
  d.setAttribute('aria-hidden', 'false');
  if (DRW_TIMER) clearInterval(DRW_TIMER);
  DRW_TIMER = setInterval(() => {
    const tl = $('drw-time');
    if (tl) tl.textContent = fmtTime(ST.secs || 0);
  }, 500);
}
function closeDrawer(immediate) {
  const d = $('drawer');
  if (!d || !d.classList.contains('on')) return;
  if (DRW_TIMER) { clearInterval(DRW_TIMER); DRW_TIMER = null; }
  d.setAttribute('aria-hidden', 'true');
  if (immediate) { d.classList.remove('on', 'closing'); return; }
  d.classList.add('closing');
  setTimeout(() => d.classList.remove('on', 'closing'), 180);
}
function drawerOpen() { const d = $('drawer'); return !!(d && d.classList.contains('on')); }

/* ------------------------------ пауза -------------------------------- */
$('p-side').onclick = openDrawer;
$('a-side').onclick = openDrawer;
$('drw-scrim').onclick = () => { sfx('click'); closeDrawer(); };
$('drw-x').onclick = () => { sfx('click'); closeDrawer(); };
$('drw-help').onclick = () => { sfx('click'); closeDrawer(true); showScreen('help'); };
$('drw-restart').onclick = () => { sfx('click'); closeDrawer(true); $('p-restart').click(); };
$('drw-pause').onclick = () => { sfx('click'); closeDrawer(true); openPause(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawerOpen()) { closeDrawer(); } });

function openPause() {
  if (curScreen !== 'game' || ST.over || ST.busy) return;
  if (ST.mode === 'solo' && ST.turn !== 'gold') return;   /* в дуэли с ИИ — только в свой ход */
  ST.busy = true;
  $('ov-pause').classList.add('on');
}
$('btn-back').onclick = () => {
  sfx('click');
  if (curScreen === 'game') openPause();
  else showScreen('start');
};

/* ------------------------------ меню --------------------------------- */
$('b-play').onclick = () => { sfx('click'); MODE = 'solo'; ST.mode = 'solo'; if (!PROG.tut) { startTutorial(); return; } showScreen('select'); };
$('b-train').onclick = () => { sfx('click'); startTutorial(); };
$('b-museum').onclick = () => { sfx('click'); showScreen('museum'); };
$('b-hall').onclick = () => { sfx('click'); showScreen('hall'); };
$('b-help').onclick = () => { sfx('click'); showScreen('help'); };

/* ----------------------------- тема/звук ----------------------------- */
let theme = 'dark';
function applyTheme(t, save) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t);
  if (save !== false) { try { localStorage.setItem('mbduel_theme', t); } catch (e) {} }
  applyBoardVars();
  paintChrome();
  if (curScreen === 'museum') renderMuseum();
  if (curScreen === 'start') renderSides();
}
$('btn-theme').onclick = () => { sfx('click'); applyTheme(theme === 'dark' ? 'light' : 'dark'); };
$('btn-sound').onclick = () => { const on = setSound(!isSoundOn()); if (on) sfx('click'); paintChrome(); };
$('btn-lang').onclick = () => {
  sfx('click');
  setLang(lang() === 'ru' ? 'en' : 'ru');
  document.documentElement.lang = lang();
  paintStatic();
};

/* ------------------------------ клавиши ------------------------------ */
document.addEventListener('keydown', e => {
  if (curScreen !== 'game' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'Escape') { if ($('ov-pause').classList.contains('on')) $('p-resume').click(); else openPause(); }
  else if (k === 'm' || k === 'M' || k === 'ь' || k === 'Ь') $('btn-sound').click();
  else if (k === 'h' || k === 'H' || k === 'р' || k === 'Р') $('b-hint').click();
  else if (k === 'r' || k === 'R' || k === 'к' || k === 'К') $('b-shuffle').click();
});
window.addEventListener('mb:pause', () => { if (curScreen === 'game') openPause(); });
window.addEventListener('mb:resume', () => { $('ov-pause').classList.remove('on'); });

/* ------------------------------- загрузка ---------------------------- */
async function boot() {
  try { const t = localStorage.getItem('mbduel_theme'); if (t === 'light' || t === 'dark') applyTheme(t, false); } catch (e) {}
  try { const v = localStorage.getItem('mbduel_tut'); if (v) PROG.tut = 1; } catch (e) {}
  loadProg();
  setBoard(clamp(PROG.board || 0, 0, BOARDS.length - 1), true);
  document.body.dataset.board = PAL.id;
  layoutCanvas();
  paintStatic();
  showScreen('start');
  const pl = await initPlatform();
  let chose = false;
  try { chose = !!localStorage.getItem('mbduel_lang'); } catch (e) {}
  if (!chose && pl.lang === 'en') { setLang('en'); paintStatic(); }
  try {
    const c = await cloudLoad();
    if (c) {
      PROG.bestScore = Math.max(PROG.bestScore || 0, c.bestScore || 0);
      PROG.plays = Math.max(PROG.plays || 0, c.plays || 0);
      for (let i = 0; i < 10; i++) {
        /* 3.0: облако 2.x хранило плоские рекорды — кладём их в ветку 'same' */
        PROG.wins.same[i] = Math.max(PROG.wins.same[i] || 0, (c.wins && c.wins[i]) || 0);
        PROG.best.same[i] = Math.max(PROG.best.same[i] || 0, (c.best && c.best[i]) || 0);
        PROG.unlocked[i] = !!(PROG.unlocked[i] || (c.unlocked && c.unlocked[i]));
      }
      saveProg(false);
      renderSides();
    }
  } catch (e) {}
  gameReady();
  renderSides();
}
window.MB = {
  ST: ST, E: E, PROG: PROG, startMatch: startMatch, V: V,
  MP: MP, TUT: TUT, BOARDS: BOARDS,
  setBoard: function (i) { setBoard(i); buildSprites(); },
  openColors: function () { openColors(); },
  pickColor: function (i) { pickColor(i); },
  swapColors: function () { swapColors(); },
  colors: function () { return { me: myColIdx(), ai: aiColIdx() }; },
  startTutorial: startTutorial, tutGo: tutGo, wave: function () { return WAVE; },
  idle: function () { return performance.now() - lastAct; },
  pal: function () { return PAL; },          /* 2.5: палитра текущей доски (для тестов) */
  boardIdx: function () { return BOARD; },
  dbg: function () { return { loop: loop.on, tweens: TWEENS.length, busy: ST.busy, turn: ST.turn, over: ST.over }; },
  dbgTurn: function (c) { ST.turn = c; ST.busy = true; paintHUD(); beginTurn(); },
  /* для автотестов: экранные координаты центра клетки */
  end: function (w, why) { endMatch(w || compareWinner(), why || 'target'); },
  pickCell: function (x, y) { return pickCell(x, y); },
  cellXY: function (r, c) {
    const p = quadOf(r, c, .6);
    const rc = cv.getBoundingClientRect();
    return { x: rc.left + (p[0].x + p[2].x) / 2, y: rc.top + (p[0].y + p[2].y) / 2 };
  },
  best: function () { return E.bestMove(ST.grid, 'gold'); },
  /* для автотестов: выполнить свап игрока напрямую */
  play: function (mv) { return playerMove(mv); },
  undo: function () { return undoMove(); },
  showHint: function () { return showHint(); },
  hintText: function () { return $('toast').textContent; },
  streakAfter: function (m, g) { return streakAfter(m, g); }
};
boot();
