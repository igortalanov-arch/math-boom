<script>/* Мат-Бум: адаптер платформы (Яндекс.Игры SDK с локальным фолбэком) */
'use strict';
const PLAT = { ysdk: null, player: null, lang: 'ru', ready: false };
let gameplayWanted = false, gameplayMarked = false, plPaused = false;

function plDeadline(p, ms, msg) {
  let t;
  return Promise.race([p, new Promise((_, r) => { t = setTimeout(() => r(new Error(msg)), ms); })]).finally(() => clearTimeout(t));
}
function loadSdk(ms) {
  if (window.YaGames && typeof window.YaGames.init === 'function') return Promise.resolve(window.YaGames);
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = '/sdk.js'; s.async = true;
    const t = setTimeout(() => rej(new Error('sdk timeout')), ms || 6000);
    s.onload = () => { clearTimeout(t); window.YaGames ? res(window.YaGames) : rej(new Error('no YaGames')); };
    s.onerror = () => { clearTimeout(t); rej(new Error('sdk load failed')); };
    document.head.appendChild(s);
  });
}
function syncGameplay() {
  const api = PLAT.ysdk && PLAT.ysdk.features && PLAT.ysdk.features.GameplayAPI;
  if (!api) return;
  const should = gameplayWanted && !plPaused;
  try {
    if (should && !gameplayMarked) { api.start(); gameplayMarked = true; }
    else if (!should && gameplayMarked) { api.stop(); gameplayMarked = false; }
  } catch (e) {}
}
function gameReady() {
  try { PLAT.ysdk && PLAT.ysdk.features && PLAT.ysdk.features.LoadingAPI && PLAT.ysdk.features.LoadingAPI.ready(); } catch (e) {}
}
async function initPlatform() {
  try {
    if (location.protocol === 'file:') return PLAT;               // локальный запуск: гость
    await loadSdk();
    PLAT.ysdk = await plDeadline(window.YaGames.init(), 8000, 'SDK init timeout');
    const y = PLAT.ysdk;
    if (y.on) {
      y.on('game_api_pause', () => { plPaused = true; syncGameplay(); window.dispatchEvent(new Event('mb:pause')); });
      y.on('game_api_resume', () => { plPaused = false; syncGameplay(); window.dispatchEvent(new Event('mb:resume')); });
    }
    const env = (y.environment && y.environment.i18n) || {};
    PLAT.lang = (String(env.lang || 'ru').toLowerCase().startsWith('ru')) ? 'ru' : 'en';
    try { PLAT.player = await plDeadline(y.getPlayer({ scopes: false }), 4000, 'player timeout'); } catch (e) { PLAT.player = null; }
  } catch (e) { PLAT.ysdk = null; PLAT.player = null; }
  try { window.dispatchEvent(new Event('mb:platready')); } catch (e) {}
  try { document.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, { passive: false }); } catch (e) {}
  try {
    document.body.style.userSelect = 'none'; document.body.style.webkitUserSelect = 'none'; document.body.style.webkitTouchCallout = 'none';
  } catch (e) {}
  return PLAT;
}
function gameplayStart() { gameplayWanted = true; syncGameplay(); }
function gameplayStop() {
  gameplayWanted = false; gameplayMarked = false;
  try { PLAT.ysdk && PLAT.ysdk.features && PLAT.ysdk.features.GameplayAPI && PLAT.ysdk.features.GameplayAPI.stop(); } catch (e) {}
}
function showInterstitial() {
  if (!PLAT.ysdk || !PLAT.ysdk.adv) return Promise.resolve(false);
  pauseForAd();
  return new Promise(res => {
    try {
      PLAT.ysdk.adv.showFullscreenAdv({ callbacks: {
        onClose: () => { resumeForAd(); res(true); },
        onError: () => { resumeForAd(); res(false); },
        onOffline: () => { resumeForAd(); res(false); }
      }});
    } catch (e) { resumeForAd(); res(false); }
  });
}
/* rewarded video: награда (подсказка / перемешивание) */
function showRewarded() {
  if (!PLAT.ysdk || !PLAT.ysdk.adv || !PLAT.ysdk.adv.showRewardedVideo) return Promise.resolve(false);
  pauseForAd();
  return new Promise(res => {
    let reward = false;
    try {
      PLAT.ysdk.adv.showRewardedVideo({ callbacks: {
        onRewarded: () => { reward = true; },
        onClosed: () => { resumeForAd(); res(reward); },
        onError: () => { resumeForAd(); res(false); },
        onOffline: () => { resumeForAd(); res(false); }
      }});
    } catch (e) { resumeForAd(); res(false); }
  });
}
function hasRealAds() {
  return !!(PLAT.ysdk && PLAT.ysdk.adv && PLAT.ysdk.adv.showRewardedVideo);
}
async function cloudSave(obj) {
  if (!PLAT.player) return false;
  try { await PLAT.player.setData({ mbduel: obj }, true); return true; } catch (e) { return false; }
}
async function cloudLoad() {
  if (!PLAT.player) return null;
  try {
    const d = await plDeadline(PLAT.player.getData(), 5000, 'cloud timeout');
    return (d && d.mbduel) ? d.mbduel : null;
  } catch (e) { return null; }

async function lbSubmit(score, board) {
  if (!PLAT.ysdk || !PLAT.ysdk.getLeaderboards) return;
  try { const lb = await PLAT.ysdk.getLeaderboards(); await lb.setLeaderboardScore(board || 'main', score); } catch (e) {}

    const lb = await PLAT.ysdk.getLeaderboards();

<script>/* =====================================================================
   МАТ-БУМ ДУЭЛЬ 2.3 — сетевой слой (мультиплеер)
   Транспорт: VK Bridge Storage, если доступен; иначе localStorage
   (две вкладки одного браузера / демо-режим).
   Протокол:
     mbm_<code>  = { id, a:{nick}, b:{nick}|null, seed, lvl, board,
                     moves:[{r1,c1,r2,c2}], ended:'a'|'b'|null, ts }
     mbm_q_<i>   = { id, ts, lvl, board, nick }   — очередь «быстрой игры»
   Матч детерминирован: доска = newBoard(rng(seed)), ходы применяются строго
   по очереди, поэтому оба клиента видят одинаковое поле.
   ===================================================================== */
(function () {
  'use strict';

  const KEY = 'mbm_';
  const SLOTS = 8;
  const FRESH = 14000;              /* сколько мс запись в очереди считается живой */
  const STORE_LIMIT = 3800;         /* VK: не больше 4096 байт на значение */

  let bridge = null, checked = false;
  function getBridge() {
    if (checked) return bridge;
    checked = true;
    try {
      if (window.vkBridge && typeof window.vkBridge.send === 'function') bridge = window.vkBridge;
      else if (window.VKWebAppBridge && typeof window.VKWebAppBridge.send === 'function') bridge = window.VKWebAppBridge;
    } catch (e) { bridge = null; }
    return bridge;
  }
  function hasCloud() { return !!getBridge(); }

  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };

  /* --------------------------- транспорт --------------------------- */
  async function sget(k) {
    const b = getBridge();
    if (b) {
      try {
        const r = await b.send('VKWebAppStorageGet', { keys: [k] });
        const it = r && r.keys && r.keys[0];
        return it && it.value ? it.value : null;
      } catch (e) { /* падаем в локальное хранилище */ }
    }
    return LS.get(k);
  }
  async function sset(k, v) {
    if (typeof v === 'string' && v.length > STORE_LIMIT) return false;
    const b = getBridge();
    if (b) {
      try {
        await b.send('VKWebAppStorageSet', { key: k, value: v });
        return true;
      } catch (e) { /* fallback */ }
    }
    return LS.set(k, v);
  }
  async function jget(k) {
    const raw = await sget(k);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }
  async function jset(k, obj) {
    try { return await sset(k, JSON.stringify(obj)); } catch (e) { return false; }
  }

  /* ------------------------------ id ------------------------------- */
  function uid() {
    let u = null;
    try { u = sessionStorage.getItem('mbduel_sid'); } catch (e) {}
    if (!u) {
      u = 'u' + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
      try { sessionStorage.setItem('mbduel_sid', u); } catch (e) {}
    }
    return u;
  }
  const ME = uid();
  const NICK = 'Игрок ' + ME.slice(-4).toUpperCase();

  function randCode() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)];
    return s;
  }
  function seedOf(code) {
    let h = 2166136261;
    for (let i = 0; i < code.length; i++) { h ^= code.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0) || 1;
  }

  window.MBNet = {
    ME: ME, NICK: NICK, hasCloud: hasCloud, randCode: randCode, seedOf: seedOf,
    get: jget, set: jset, key: KEY, SLOTS: SLOTS, FRESH: FRESH, uid: uid
  };
})();
</script>
<script>/* =====================================================================
   МАТ-БУМ ДУЭЛЬ 2.9 — ядро игры (Match-3, без DOM)
   Поле 7x7, рефилл сверху, гравитация вниз, линии в 4 направлениях.
   Цвета: gold (игрок) / blue (ИИ). Номиналы 1..5.
   Очки: sum(values) × (0.6 + 0.1 × (len − 3)), комбо за каскад ×2/×3.
   Спецфишки: 4 в ряд — ракета (чистит ряд/столбец), 5+ — бомба (3×3).
   ===================================================================== */
(function (root) {
  'use strict';

  var N = 7;
  var DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];
  var DIRS_HV = [[0, 1], [1, 0]];
  var GOLD = 'gold', BLUE = 'blue';
  var OTHER = { gold: 'blue', blue: 'gold' };
  var ID = 1;

  /* ============ 3.0: ПРАВИЛО МАТЧИНГА (глобал, читается всеми функциями) ============
     mode: 'same' — 3+ одинаковых числа одного цвета (классика)
           'seq'  — 3+ числа подряд по порядку (2-3-4 или 4-3-2)
           'sum'  — сумма цифр в линии = sumTarget (по умолчанию 10)
     seqStrict: true — только возрастание.
     bonus: множитель темпа, чтобы все три режима набирали очки примерно одинаково. */
  var RULE = {
    mode: 'same', sumTarget: 10, seqStrict: false,
    /* 3.0: множители подобраны симулятором (src/sim): «Собери 10» даёт
       в ~2.2 раза больше линий на доску, поэтому цена линии ниже,
       а цель выше — итоговый темп у всех трёх режимов одинаковый. */
    bonus: { same: 1.0, seq: 1.15, sum: 0.75 }
  };
  var TARGETS = { same: [80, 120, 180], seq: [80, 120, 180], sum: [300, 450, 650] };
  function scoreBonus() { return RULE.bonus[RULE.mode] || 1; }

  /* ================== 3.1: РЕЗЕРВ ФИШЕК ==================
     Доска стартует полной (49 фишек), отдельно лежит пул N фишек.
     Сгоревшая фишка заменяется фишкой из пула; пул тратится только на рефилл.
       total < 0  — бесконечный пул (обучение, отладка, старые режимы)
       total = 0  — пустой с первого хода (краевой случай, в игре не используется)
       total > 0  — конечный пул
     Перемешивание и рождение спецфишки пул НЕ тратят: они переставляют
     и перекрашивают уже существующие фишки. */
  var RESERVE = { total: -1, left: -1 };
  function reserveOn() { return RESERVE.total >= 0; }
  function reserveEmpty() { return reserveOn() && RESERVE.left <= 0; }

  /* ------------------------------- utils ------------------------------- */
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;

    if (color && a.c !== color && b.c !== color) return { ok: false, why: 'enemy' };
    return { ok: true, why: '' };
  }

  var SWAP_DIRS = [[0, 1], [1, 0], [1, 1], [1, -1]];

  /* 2.9: квоты сложности. L1 — «слепой» ИИ (не видит диагонали), L3 — с блокировкой.
     Точные проценты подобраны симулятором src/sim/levels29.js. */
  var AITUNE = {
    levels: {
      l1: { blind: true, blunder: .45, weak: 2 },
      l2: { blunder: .34, weak: 4, sabotage: true, sabChance: .15 },
      l3: { blunder: 0, cands: 3, slack: 0, sabotage: false, defense: 3, deny: .8, self: .3 }
    }
  };
  function allSwaps(g, color, ortho) {
    var dirs = ortho ? DIRS_HV : SWAP_DIRS;
    var out = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var a = g[r][c];
        if (!a) continue;
        for (var d = 0; d < dirs.length; d++) {
          var r2 = r + dirs[d][0], c2 = c + dirs[d][1];
          if (!inside(r2, c2)) continue;
          var b = g[r2][c2];
          if (!b || same(a, b)) continue;
          if (color && a.c !== color && b.c !== color) continue;
          out.push({ r1: r, c1: c, r2: r2, c2: c2 });
        }
      }
    }
    return out;
  }

  /* 2.9: быстрая оценка свапа. Сначала проверяем, появилась ли вообще линия
     (меняются только две клетки) — и только потом считаем каскад.
     Это убирает ~90 % тяжёлых resolve и снимает лаг L3. */
  function scoreSwap(grid, mv, dirs) {
    var d = dirs || DIRS;
    var a = grid[mv.r1][mv.c1], b = grid[mv.r2][mv.c2];
    if (!a || !b) return { gold: 0, blue: 0 };
    var g = cloneGrid(grid);
    g[mv.r1][mv.c1] = b; g[mv.r2][mv.c2] = a;
    if (!lineAt(g, mv.r1, mv.c1, d) && !lineAt(g, mv.r2, mv.c2, d)) return { gold: 0, blue: 0 };
    return resolveInPlace(g, { dirs: d }).total;
  }

  /* лучший свап для цвета: максимум своих очков, при равенстве — меньше отдаём врагу */
  function bestMove(grid, color, dirs) {
    var ortho = !!(dirs && dirs === DIRS_HV);
    var swaps = allSwaps(grid, color, ortho), best = null;
    for (var i = 0; i < swaps.length; i++) {
      var s = scoreSwap(grid, swaps[i], dirs);
      var own = s[color];
      if (own <= 0) continue;
      var opp = s[OTHER[color]];
      if (!best || own > best.score || (own === best.score && opp < best.opp)) {
        best = { move: swaps[i], score: own, opp: opp, total: s };
      }
    }
    return best;
  }

  function hasMove(grid, color, dirs) {
    var swaps = allSwaps(grid, color, !!(dirs && dirs === DIRS_HV));
    for (var i = 0; i < swaps.length; i++) {
      if (scoreSwap(grid, swaps[i], dirs)[color] > 0) return true;
    }
    return false;
  }

  function countMoves(grid, color, limit, dirs) {
    var swaps = allSwaps(grid, color, !!(dirs && dirs === DIRS_HV)), n = 0;
    for (var i = 0; i < swaps.length; i++) {
      if (scoreSwap(grid, swaps[i], dirs)[color] > 0) { n++; if (limit && n >= limit) return n; }
    }
    return n;
  }

  /* 2.9: «почему этот свап лучший» — для подсказки с объяснением */
  function explainMove(grid, mv, color) {
    var g = cloneGrid(grid);
    var a = g[mv.r1][mv.c1], b = g[mv.r2][mv.c2];
    if (!a || !b) return null;
    g[mv.r1][mv.c1] = b; g[mv.r2][mv.c2] = a;
    var groups = mergeGroups(findGroups(g)).filter(function (x) { return !color || x.c === color; });
    if (!groups.length) return null;
    var best = groups.slice().sort(function (p, q) { return q.cells.length - p.cells.length; })[0];
    var pts = 0, len = 0, sp = null;
    for (var i = 0; i < groups.length; i++) {
      pts += groupScore(groups[i]);
      if (groups[i].cells.length > len) { len = groups[i].cells.length; }
      var s = specialOf(groups[i]);
      if (s) sp = s;
    }
    /* 3.0: режимные данные — для подсказки и предсказания очков */
    var values = [], ch = [], gn;
    for (var q = 0; q < best.cells.length; q++) {
      var qc = best.cells[q], qt = g[qc[0]][qc[1]];
      if (qt) { values.push(qt.v); ch.push(qt.v); }
    }
    for (gn = 0; gn < groups.length; gn++) {
      if (groups[gn].vals && groups[gn].vals.length) groups[gn].vals = groups[gn].vals.slice();
    }
    return {
      score: pts, len: len, dir: best.dir, special: sp, groups: groups.length,
      total: resolveInPlace(g).total,
      mode: RULE.mode, sumTarget: RULE.sumTarget, values: values, chain: ch.join('·')
    };
  }

  /* ------------------------------ AI ----------------------------------- */
  function levelCfg(level) {
    return AITUNE.levels[
      level <= 1 ? 'l1' : (level === 2 ? 'l2' : 'l3')
    ] || AITUNE.levels.l3;
  }
  function aiMove(grid, level, rand) {
    rand = rand || Math.random;
    var cfg = levelCfg(level);
    var dirs = cfg.blind ? DIRS_HV : DIRS;
    var swaps = allSwaps(grid, BLUE, !!cfg.blind);
    if (!swaps.length) return null;

    var scored = [], i, s;
    for (i = 0; i < swaps.length; i++) {
      s = scoreSwap(grid, swaps[i], dirs);
      if (s.blue > 0) scored.push({ move: swaps[i], s: s });
    }
    scored.sort(function (a, b) {
      if (b.s.blue !== a.s.blue) return b.s.blue - a.s.blue;
      return a.s.gold - b.s.gold;
    });

    /* ---------- «слепой» L1: видит только горизонтали и вертикали ---------- */
    if (cfg.blind) {
      if (!scored.length) return swaps[Math.floor(rand() * swaps.length)];
      if (rand() < (cfg.blunder || 0)) return swaps[Math.floor(rand() * swaps.length)];
      var wspan = Math.min(cfg.weak || 1, scored.length);
      return scored[Math.floor(rand() * wspan)].move;
    }

    /* ---------- L2 ---------- */
    if (level <= 2) {
      if (!scored.length) {
        if (cfg.sabotage) {
          var sab1 = sabotageMove(grid, swaps, rand);
          if (sab1) return sab1;
        }
        return swaps[Math.floor(rand() * swaps.length)];
      }
      if (rand() < (cfg.blunder || 0)) return swaps[Math.floor(rand() * swaps.length)];
      if (cfg.sabotage && rand() < (cfg.sabChance || 0)) {
        var sab2 = sabotageMove(grid, swaps, rand);
        if (sab2) return sab2;
      }
      if (!cfg.weak) return scored[0].move;
      var span2 = Math.min(cfg.weak, scored.length);
      return scored[Math.max(0, span2 - 1 - Math.floor(rand() * span2))].move;
    }

    /* ---------- L3: блокирует лучший ход игрока ---------- */
    var cands = scored.slice(0, Math.min(cfg.cands, scored.length));

    if (cfg.defense) {
      var pBest0 = bestMove(grid, GOLD);
      if (pBest0) {
        var cells0 = [pBest0.move.r1 + ':' + pBest0.move.c1, pBest0.move.r2 + ':' + pBest0.move.c2];
        var inCands = {};
        for (i = 0; i < cands.length; i++) inCands[cands[i].move.r1 + ':' + cands[i].move.c1 + '>' + cands[i].move.r2 + ':' + cands[i].move.c2] = 1;
        var defs = [];
        for (i = 0; i < swaps.length; i++) {
          var sw = swaps[i], k1 = sw.r1 + ':' + sw.c1, k2 = sw.r2 + ':' + sw.c2;
          if (inCands[k1 + '>' + k2]) continue;
          if (cells0.indexOf(k1) < 0 && cells0.indexOf(k2) < 0) continue;
          defs.push({ move: sw, s: scoreSwap(grid, sw) });
        }
        defs.sort(function (a, b) { return a.s.gold - b.s.gold; });
        for (i = 0; i < defs.length && i < cfg.defense; i++) cands.push(defs[i]);
      }
    }
    if (!cands.length) return swaps[Math.floor(rand() * swaps.length)];
    var minOwn = scored.length ? scored[0].s.blue - (cfg.slack || 0) : 0;
    var sab = cfg.sabotage ? sabotageMove(grid, swaps, rand) : null;
    if (sab) cands.push({ move: sab, s: { gold: 0, blue: 0 }, sab: true });

    var bestVal = -1e9, pick = cands[0];
    var t0 = Date.now();
    for (i = 0; i < cands.length; i++) {
      var cd = cands[i];
      if (!cd.sab && cfg.deny === 0 && cd.s.blue < minOwn) continue;
      var g2 = cloneGrid(grid);
      swapCells(g2, cd.move.r1, cd.move.c1, cd.move.r2, cd.move.c2);
      resolveInPlace(g2);
      var pb = bestMove(g2, GOLD);
      var left = pb ? pb.score : 0;
      var next = 0;
      if (cfg.self) { var nb = bestMove(g2, BLUE); next = nb ? nb.score : 0; }
      var val = cd.s.blue + (cfg.self || 0) * next - (cfg.deny || 0) * left + (cd.sab ? (cfg.sabBonus || 0) : 0);
      if (val > bestVal + .001 || (Math.abs(val - bestVal) <= .001 && cd.s.blue > (pick ? pick.s.blue : -1))) {
        bestVal = val; pick = cd;
      }
      /* бюджет времени: на слабых телефонах не даём ИИ подвешивать кадр */
      if (Date.now() - t0 > 90 && i < cands.length - 1) break;
    }
    return pick.move;
  }

  /* свап, который не даёт ИИ очков, но максимально портит лучший ход игрока */
  function sabotageMove(grid, swaps, rand) {
    var pBest = bestMove(grid, GOLD);
    if (!pBest) return null;
    var best = null, i;
    for (i = 0; i < swaps.length; i++) {
      var s = scoreSwap(grid, swaps[i]);
      if (s.blue > 0) continue;
      if (s.gold > 0) continue;
      var g2 = cloneGrid(grid);
      swapCells(g2, swaps[i].r1, swaps[i].c1, swaps[i].r2, swaps[i].c2);
      resolveInPlace(g2);
      var pb = bestMove(g2, GOLD);
      var left = pb ? pb.score : 0;
      var gain = pBest.score - left;
      if (gain > 0 && (!best || gain > best.gain || (gain === best.gain && rand() < 0.35))) {
        best = { move: swaps[i], gain: gain, left: left };
      }
    }
    return best ? best.move : null;
  }

  /* --------------------------- generation ------------------------------ */
  /* 2.9: на старте 25 фишек игрока и 24 соперника, номиналы 1..5,
     готовых линий нет, ход есть у обоих. */
  function tileVal(rand) { return 1 + Math.floor(rand() * 5); }

  function newBoard(rand) {
    rand = rand || Math.random;
    var best = null, attempt, g, gm, bm;
    for (attempt = 0; attempt < 120; attempt++) {
      g = emptyGrid();
      var goldLeft = Math.ceil(N * N / 2), blueLeft = N * N - goldLeft;
      var cells = [];
      for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) cells.push([r, c]);
      shuffleArr(cells, rand);
      for (var i = 0; i < cells.length; i++) {
        var rr = cells[i][0], cc = cells[i][1];
        var col;
        if (!goldLeft) col = BLUE;
        else if (!blueLeft) col = GOLD;
        else col = rand() < goldLeft / (goldLeft + blueLeft) ? GOLD : BLUE;
        if (col === GOLD) goldLeft--; else blueLeft--;
        var v = tileVal(rand), tries = 0;
        while (makesLineAt(g, rr, cc, v, col) && tries++ < 40) v = tileVal(rand);
        g[rr][cc] = tile(v, col);
      }
      if (findGroups(g).length) continue;
      gm = countMoves(g, GOLD, 6); bm = countMoves(g, BLUE, 6);
      if (!gm || !bm) continue;
      var scoreV = Math.min(gm, 6) + Math.min(bm, 6) - Math.abs(gm - bm) * 0.25;
      if (!best || scoreV > best.scoreV) best = { g: g, scoreV: scoreV };
      if (attempt > 8 && scoreV >= 6) return g;
    }
    if (best) return best.g;
    var g2 = emptyGrid();
    for (var r2 = 0; r2 < N; r2++) for (var c2 = 0; c2 < N; c2++) g2[r2][c2] = tile(tileVal(rand), rand() < .5 ? GOLD : BLUE);
    return g2;
  }

  /* ------------------- перемешивание (2.9: без forceTriple) ------------ */
  /* Если расклад номиналов не даёт цвету линии — номиналы НЕ меняем:
     партия просто закончится по «фишек мало / ходов нет». */
  function packPositions(n) {
    var out = [];
    for (var r = N - 1; r >= 0 && out.length < n; r--) {
      for (var c = 0; c < N && out.length < n; c++) out.push([r, c]);
    }
    return out;
  }

  function canEverLine(g, color) {
    var cnt = {}, r, c, t;
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) {
      t = g[r][c];
      if (t && t.c === color) cnt[t.v] = (cnt[t.v] || 0) + 1;
    }
    for (var k in cnt) if (cnt[k] >= 3) return true;
    return false;
  }

  /* поставит ли фишка (v,color) в (r,c) готовую линию из 3+ (по текущему правилу) */
  function makesLineAt(g, r, c, v, color) {
    if (RULE.mode !== 'same') {
      var prev = g[r][c];
      g[r][c] = { v: v, c: color, i: -1 };
      var res = hasRunAt(g, r, c, DIRS);
      g[r][c] = prev;
      return res;
    }
    for (var d = 0; d < DIRS.length; d++) {
      var dr = DIRS[d][0], dc = DIRS[d][1], n = 1, k, rr, cc, t;
      for (k = 1; k < N; k++) {
        rr = r - dr * k; cc = c - dc * k;
        if (!inside(rr, cc)) break;
        t = g[rr][cc];
        if (!t || t.v !== v || t.c !== color) break;
        n++;
      }
      for (k = 1; k < N; k++) {
        rr = r + dr * k; cc = c + dc * k;
        if (!inside(rr, cc)) break;
        t = g[rr][cc];
        if (!t || t.v !== v || t.c !== color) break;
        n++;
      }
      if (n >= 3) return true;
    }
    return false;
  }

  /* раскладка «без готовых линий»: каждая фишка ставится жадно */
  function placeNoLines(tiles, pos, rand) {
    var g = emptyGrid(), pool = shuffleArr(tiles.slice(), rand), i, j;
    for (i = 0; i < pos.length; i++) {
      var r = pos[i][0], c = pos[i][1], pick = -1;
      for (j = 0; j < pool.length; j++) {
        if (!makesLineAt(g, r, c, pool[j].v, pool[j].c)) { pick = j; break; }
      }
      if (pick < 0) pick = 0;
      g[r][c] = pool[pick];
      pool.splice(pick, 1);
    }
    return g;
  }

  /* «почти линия»: три клетки в ряд + соседняя с третьей */
  function patternCells(pos, busy) {
    for (var i = 0; i + 2 < pos.length; i++) {
      var a = pos[i], b = pos[i + 1], c = pos[i + 2];
      if (a[0] !== b[0] || b[0] !== c[0]) continue;
      if (b[1] !== a[1] + 1 || c[1] !== b[1] + 1) continue;
      if (busy[a[0] + ':' + a[1]] || busy[b[0] + ':' + b[1]] || busy[c[0] + ':' + c[1]]) continue;
      for (var j = 0; j < pos.length; j++) {
        var q = pos[j];
        if (busy[q[0] + ':' + q[1]]) continue;
        if (q[0] === a[0] && q[1] === a[1]) continue;
        if (q[0] === b[0] && q[1] === b[1]) continue;
        if (q[0] === c[0] && q[1] === c[1]) continue;
        if (Math.abs(q[0] - c[0]) > 1 || Math.abs(q[1] - c[1]) > 1) continue;
        return [a, b, c, q];
      }
    }
    return null;
  }

  /* Строит раскладку, где у ОБОИХ цветов гарантированно есть ход */
  function buildGuaranteed(tiles, pos, rand) {
    var byKey = {}, i, t, k;
    for (i = 0; i < tiles.length; i++) {
      t = tiles[i]; k = t.c + t.v;
      (byKey[k] = byKey[k] || []).push(i);
    }
    var gKey = null, bKey = null;
    for (k in byKey) {
      if (byKey[k].length < 3) continue;
      if (k.charAt(0) === 'g' && !gKey) gKey = k;
      if (k.charAt(0) === 'b' && !bKey) bKey = k;
    }
    if (!gKey || !bKey) return null;

    var used = {}, cells = {};
    function take(key) {
      var arr = byKey[key], out = [];
      for (var j = 0; j < arr.length && out.length < 3; j++) {
        if (used[arr[j]]) continue;
        used[arr[j]] = 1; out.push(arr[j]);
      }
      return out;
    }
    function blocker(key) {
      for (var j = 0; j < tiles.length; j++) {
        if (used[j]) continue;
        if (tiles[j].c + tiles[j].v === key) continue;
        used[j] = 1; return j;
      }
      return -1;
    }
    var gA = take(gKey), bA = take(bKey);
    if (gA.length < 3 || bA.length < 3) return null;

    var cG = patternCells(pos, cells);
    if (!cG) return null;
    cG.forEach(function (p) { cells[p[0] + ':' + p[1]] = 1; });
    var cB = patternCells(pos, cells);
    if (!cB) return null;
    cB.forEach(function (p) { cells[p[0] + ':' + p[1]] = 1; });
    var gX = blocker(gKey), bX = blocker(bKey);
    if (gX < 0 || bX < 0) return null;

    var base = emptyGrid();
    base[cG[0][0]][cG[0][1]] = tiles[gA[0]];
    base[cG[1][0]][cG[1][1]] = tiles[gA[1]];
    base[cG[3][0]][cG[3][1]] = tiles[gA[2]];
    base[cG[2][0]][cG[2][1]] = tiles[gX];
    base[cB[0][0]][cB[0][1]] = tiles[bA[0]];
    base[cB[1][0]][cB[1][1]] = tiles[bA[1]];
    base[cB[3][0]][cB[3][1]] = tiles[bA[2]];
    base[cB[2][0]][cB[2][1]] = tiles[bX];

    var rest = [], free = [], j2;
    for (j2 = 0; j2 < tiles.length; j2++) if (!used[j2]) rest.push(j2);
    for (j2 = 0; j2 < pos.length; j2++) {
      if (!cells[pos[j2][0] + ':' + pos[j2][1]]) free.push(pos[j2]);
    }
    if (rest.length > free.length) return null;
    var pool = shuffleArr(rest.map(function (k2) { return tiles[k2]; }), rand);
    for (j2 = 0; j2 < free.length; j2++) {
      var cell = free[j2], pick = -1;
      for (var k3 = 0; k3 < pool.length; k3++) {
        if (!makesLineAt(base, cell[0], cell[1], pool[k3].v, pool[k3].c)) { pick = k3; break; }
      }
      if (pick < 0) pick = 0;
      base[cell[0]][cell[1]] = pool[pick];
      pool.splice(pick, 1);
    }
    return findGroups(base).length ? null : base;
  }

  /* Перемешивание: плотный блок снизу + ход гарантированно есть у обоих.
     Возвращает false, если расклад не удался (тогда партия заканчивается). */
  function reshuffle(grid, rand) {
    rand = rand || Math.random;
    var tiles = [], r, c, i;
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) if (grid[r][c]) tiles.push(grid[r][c]);
    if (tiles.length < 3) return false;
    var pos = packPositions(tiles.length);

    var perfect = null, fallback = null, fbV = -1, attempt, g, gm, bm;
    for (attempt = 0; attempt < 24; attempt++) {
      g = placeNoLines(tiles, pos, rand);
      if (findGroups(g).length) continue;
      gm = hasMove(g, GOLD) ? 1 : 0;
      bm = hasMove(g, BLUE) ? 1 : 0;
      if (gm && bm) { perfect = g; break; }
      if (gm + bm > fbV) { fbV = gm + bm; fallback = g; }
    }
    if (!perfect) perfect = buildGuaranteed(tiles, pos, rand);
    var res = perfect || fallback;
    if (res && (RULE.mode === 'same' || (hasMove(res, GOLD) && hasMove(res, BLUE)))) {
      for (r = 0; r < N; r++) for (c = 0; c < N; c++) grid[r][c] = res[r][c];
      return true;
    }
    /* 3.1 РЕЗЕРВ: при пустом пуле доска пустеет намеренно — «оживлять» её
       целой новой доской нельзя, иначе игрок получит 49 фишек из воздуха.
       Возвращаем false, и партия корректно закончится по «фишки кончились». */
    if (reserveEmpty()) return false;
    /* 3.0: в seq/sum «гарантированная» раскладка классики не работает —
       ход есть далеко не всегда. Тогда раскладываем доску заново генератором
       (он сам проверяет, что ход есть у обоих) и считаем перемешивание удавшимся:
       лучше слегка сменить номиналы, чем оборвать партию по «ходов нет». */
    var fresh = newBoard(rand);
    if (!fresh) return false;
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) grid[r][c] = fresh[r][c];
    return true;
  }

  /* ------------------------------ export ------------------------------- */
  var E = {
    N: N, GOLD: GOLD, BLUE: BLUE, OTHER: OTHER, DIRS: DIRS, DIRS_HV: DIRS_HV,
    rng: mulberry32, resetIds: resetIds,

function startWave() {

    const cells = [];
    let ok = true;
    for (let i = 0; i < len; i++) {
      const r = r0 + d[0] * i, c = c0 + d[1] * i;
      if (r < 0 || r >= N || c < 0 || c >= N || !ST.grid[r][c]) { ok = false; break; }
      cells.push([r, c]);

      return;
    }
  }

/* 3.0: «живая доска» с подпрыгиванием фишек отключена — игроков это раздражало.

   падение, взрывы. */
const WAVE_ON = false;

  if (!WAVE_ON) { if (WAVE) endWave(); return; }
  if (busyUi()) { if (WAVE) endWave(); lastAct = Math.max(lastAct, now - WAVE_IDLE + 1200); return; }
  if (!WAVE) {
    if (now - lastAct > WAVE_IDLE) startWave();
    return;
  }
  const span = WAVE.cells.length * WAVE_STEP;
  const e = now - WAVE.t0;
  if (e > span + WAVE_GAP) { WAVE.t0 = now; return; }     /* пока игрок не тронул доску — повторяем */
  WAVE.cells.forEach(([r, c], i) => {
    const t = ST.grid[r] && ST.grid[r][c];
    if (!t) return;
    const p = (e - i * WAVE_STEP) / WAVE_STEP;
    if (p > 0 && p < 1) {
      t.lift = Math.sin(Math.PI * p) * V.ch * .86;
      t.sc = 1 + Math.sin(Math.PI * p) * .07;

}

/* ------------------------------ отрисовка ---------------------------- */
function draw() {
  if (!V.w) return;
  ctx.clearRect(0, 0, V.w, V.h);
  const sh = shakeAmp();
  ctx.save();
  if (sh > 0) ctx.translate((Math.random() * 2 - 1) * sh, (Math.random() * 2 - 1) * sh);
  drawGlow();
  drawMotes();
  if (ST.grid) {
    drawSlab();
    drawSockets();
    const tiles = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const t = ST.grid[r][c];
      if (t) tiles.push({ t, r, c });
    }
    tiles.sort((a, b) => (a.r + a.t.or) - (b.r + b.t.or) || a.c - b.c);
    for (const it of tiles) drawTile(it.t, it.r, it.c);
    drawAiPair();
    drawSelect();
    drawTutLock();
    drawHintArrow();
    drawPrediction();
    drawEffects();

function drawGlow() {
  const g = ctx.createRadialGradient(V.ox, V.oy, V.cw * .4, V.ox, V.oy, V.cw * 5.2);
  g.addColorStop(0, PAL.ambient[0]);

/* ------------- кэш спрайтов фишек (быстрее, чем градиенты каждый кадр) --------- */
let SPR = { key: '', map: {} };
function spriteKey() { return PAL.id + '-' + Math.round(V.cw) + 'x' + Math.round(V.ch) + 'x' + Math.round(V.sh); }
function buildSprites() {
  const key = spriteKey();
  if (SPR.key === key) return;
  const cw = V.cw, ch = V.ch, sh = V.sh, th = ch * .17;
  const pad = Math.max(5, cw * .07);
  const W = Math.ceil(cw * 1.10 + pad * 2 + 2);
  const H = Math.ceil(ch + th + pad * 2 + 2);
  const map = {};
  /* верхняя грань — трапеция той же формы, что и клетка (верх чуть уже низа),
     нижние/боковые грани — смещение вниз-вправо на sh/th (как у наклонённой доски) */
  const topPts = (scale) => {
    const w1 = cw * .985 * scale, w2 = cw * 1.015 * scale, hh = ch * scale;
    return [
      { x: -w1 / 2, y: -hh / 2 }, { x: w1 / 2, y: -hh / 2 },
      { x: w2 / 2, y: hh / 2 }, { x: -w2 / 2, y: hh / 2 }

  };
  const pathOf = (ctx2, arr, rad) => {
    ctx2.beginPath();
    for (let i = 0; i < 4; i++) {
      const prev = arr[(i + 3) % 4], cur = arr[i], next = arr[(i + 1) % 4];
      const v1 = { x: prev.x - cur.x, y: prev.y - cur.y }, v2 = { x: next.x - cur.x, y: next.y - cur.y };
      const l1 = Math.hypot(v1.x, v1.y) || 1, l2 = Math.hypot(v2.x, v2.y) || 1;
      const rr = Math.min(rad, l1 * .45, l2 * .45);
      const a = { x: cur.x + v1.x / l1 * rr, y: cur.y + v1.y / l1 * rr };
      const b = { x: cur.x + v2.x / l2 * rr, y: cur.y + v2.y / l2 * rr };
      if (i === 0) ctx2.moveTo(a.x, a.y); else ctx2.lineTo(a.x, a.y);
      ctx2.quadraticCurveTo(cur.x, cur.y, b.x, b.y);
    }
    ctx2.closePath();
  };
  ['gold', 'blue'].forEach(col => {
    const st = TS[col];
    for (let v = 1; v <= 5; v++) {
      const cv2 = document.createElement('canvas');
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cv2.width = Math.ceil(W * dpr); cv2.height = Math.ceil(H * dpr);
      const g2 = cv2.getContext('2d');
      g2.scale(dpr, dpr);
      g2.translate(W / 2, pad + ch / 2);
      const T = topPts(1);
      const off = { x: sh * .55, y: th };
      const B = T.map(p => ({ x: p.x + off.x, y: p.y + off.y }));
      /* нижняя грань */
      g2.fillStyle = st.side; pathOf(g2, B, cw * .16); g2.fill();
      /* правая грань */
      g2.fillStyle = st.fside;
      g2.beginPath(); g2.moveTo(T[1].x, T[1].y); g2.lineTo(T[2].x, T[2].y);
      g2.lineTo(B[2].x, B[2].y); g2.lineTo(B[1].x, B[1].y); g2.closePath(); g2.fill();
      /* левая грань */
      g2.fillStyle = st.lside;
      g2.beginPath(); g2.moveTo(T[3].x, T[3].y); g2.lineTo(T[2].x, T[2].y);
      g2.lineTo(B[2].x, B[2].y); g2.lineTo(B[3].x, B[3].y); g2.closePath(); g2.fill();
      /* верхняя грань */
      const gr = g2.createLinearGradient(0, -ch / 2, 0, ch / 2);
      gr.addColorStop(0, st.top1); gr.addColorStop(1, st.top2);
      g2.fillStyle = gr; pathOf(g2, T, cw * .16); g2.fill();
      g2.strokeStyle = 'rgba(0,0,0,.16)'; g2.lineWidth = 1; g2.stroke();
      /* блик */
      g2.strokeStyle = st.line; g2.lineWidth = Math.max(1, cw * .018); g2.globalAlpha = .45;
      pathOf(g2, T.map(p => ({ x: p.x * .975, y: p.y * .94 })), cw * .14); g2.stroke(); g2.globalAlpha = 1;
      /* маркер цвета */
      g2.beginPath(); g2.arc(0, -ch * .36, cw * .027, 0, 7); g2.fillStyle = st.dot; g2.fill();
      /* цифра */
      const fs = cw * .44;
      g2.textAlign = 'center'; g2.textBaseline = 'middle';
      g2.font = '900 ' + fs + 'px "Segoe UI",Roboto,Arial,sans-serif';
      g2.fillStyle = 'rgba(0,0,0,.22)';
      g2.fillText(v, 0, fs * .09);
      g2.fillStyle = st.num;
      g2.fillText(v, 0, fs * .045);
      map[col + v] = { cv: cv2, w: W, h: H, pad: pad, ch: ch };
    }

function drawSlab() {
  const pad = .40, ext = V.ch * .46;
  const outer = [corner(-pad, -pad), corner(-pad, N - 1 + pad), corner(N - 1 + pad, N - 1 + pad), corner(N - 1 + pad, -pad)];
  const front = [outer[1], outer[2], { x: outer[2].x, y: outer[2].y + ext }, { x: outer[1].x, y: outer[1].y + ext }];
  const leftF = [outer[0], outer[1], { x: outer[1].x, y: outer[1].y + ext }, { x: outer[0].x, y: outer[0].y + ext }];
  const rightF = [outer[2], outer[3], { x: outer[3].x, y: outer[3].y + ext }, { x: outer[2].x, y: outer[2].y + ext }];
  /* мягкая тень под платформой */
  ctx.save();
  for (let i = 3; i >= 1; i--) {
    ctx.globalAlpha = .07 + .05 * (3 - i);
    ctx.fillStyle = '#000';
    const sp = V.cw * .07 * i;
    ctx.beginPath();
    roundPath(outer.map(p => ({ x: p.x + (i % 2 ? sp : -sp) * .25, y: p.y + ext + sp })), V.cw * (.22 + i * .03));
    ctx.fill();
  }
  ctx.restore();
  const quad = (pts, fill) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < 4; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath(); ctx.fill(); };
  /* торцы платформы: передняя и боковые грани */
  quad(rightF, PAL.slab.right);
  quad(leftF, PAL.slab.left);
  const gf = ctx.createLinearGradient(0, outer[1].y, 0, outer[1].y + ext);
  gf.addColorStop(0, PAL.slab.front[0]); gf.addColorStop(.35, PAL.slab.front[1]); gf.addColorStop(1, PAL.slab.front[2]);
  quad(front, gf);
  /* верх платформы */
  const g = ctx.createLinearGradient(0, outer[0].y, 0, outer[2].y);
  g.addColorStop(0, PAL.slab.top[0]); g.addColorStop(.5, PAL.slab.top[1]); g.addColorStop(1, PAL.slab.top[2]);
  ctx.fillStyle = g;
  ctx.beginPath(); roundPath(outer, V.cw * .22); ctx.fill();
  /* кант платформы (в обучении приглушаем, чтобы не спорил с затемнением) */
  const dimTut = (typeof TUT !== 'undefined' && TUT.on && TUT.step === 2);
  ctx.strokeStyle = dimTut ? 'rgba(255,255,255,.05)' : PAL.slab.rim;
  ctx.lineWidth = Math.max(1.6, V.cw * .02);
  ctx.stroke();
  /* световой кант по переднему ребру */
  ctx.beginPath(); ctx.moveTo(outer[1].x, outer[1].y + 1); ctx.lineTo(outer[2].x, outer[2].y + 1);
  ctx.strokeStyle = PAL.slab.edge; ctx.lineWidth = Math.max(1.2, V.cw * .014); ctx.stroke();
  /* внутренний кант */
  const inner0 = outer.map(p => ({ x: p.x + (V.ox - p.x) * .014, y: p.y + (V.oy - p.y) * .014 }));
  ctx.strokeStyle = PAL.slab.edge;
  ctx.lineWidth = Math.max(1, V.cw * .012);
  ctx.beginPath(); roundPath(inner0, V.cw * .21); ctx.stroke();
}
function drawSockets() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (ST.grid[r][c]) continue;
    const pts = quadOf(r, c, .90);
    const hole = pts.map(p => ({ x: p.x, y: p.y + V.ch * .05 }));
    ctx.fillStyle = 'rgba(2,5,12,.5)';
    ctx.beginPath(); roundPath(hole, V.cw * .15); ctx.fill();
    ctx.fillStyle = 'rgba(4,8,16,.55)';
    ctx.beginPath(); roundPath(pts, V.cw * .15); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 1;
    ctx.stroke();
  }

function drawTile(t, r, c) {
  const dr = t.or || 0, dc = t.oc || 0;
  const ap = t.ap == null ? 1 : t.ap;
  if (ap <= 0) return;
  let s = (t.sc || 1) * (0.55 + 0.45 * easeOut(clamp(ap, 0, 1)));
  let alpha = clamp(ap, 0, 1);
  if (TUT.on && TUT.lock && !tutIn(r, c)) alpha *= .16;
  if (t.pop > 0) {
    s *= 1 + .2 * Math.sin(Math.PI * t.pop);
    alpha *= 1 - Math.max(0, (t.pop - .55) / .45);
  }
  const rr = r + dr, cc = c + dc;
  /* эффект 1: squash & stretch при приземлении (−7% по вертикали, +5.5% по горизонтали) */
  const sqz = t.sq || 0;
  const sqx = 1 + .055 * sqz, sqy = 1 - .07 * sqz;
  const lift2 = t.lift || 0, s2 = s;
  /* тень */
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(0,0,0,.17)';
  const shq = quadOf(rr, cc, s * 1.06, 0).map(p => ({ x: p.x + V.cw * .035, y: p.y + V.ch * .13 }));
  ctx.beginPath(); roundPath(shq, V.cw * .18); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.20)';
  const shq2 = quadOf(rr, cc, s * 1.0, 0).map(p => ({ x: p.x + V.cw * .02, y: p.y + V.ch * .1 }));
  ctx.beginPath(); roundPath(shq2, V.cw * .16); ctx.fill();
  /* спрайт */
  const sp = SPR.map[t.c + t.v];
  if (sp) {
    const p = corner(rr, cc);
    const k = kRow(rr) / kRow(CTR);
    ctx.save();
    ctx.translate(p.x, p.y - lift2);
    ctx.scale(s2 * k * sqx, s2 * sqy);
    ctx.globalAlpha = alpha;
    /* верхняя грань спрайта центрируется точно по клетке (раньше уезжала вниз на ~28px) */
    ctx.drawImage(sp.cv, -sp.w / 2, -sp.pad - sp.ch / 2, sp.w, sp.h);
    ctx.restore();

  if (t.blm > 0) drawBloom(rr, cc, t, s2 * sqx, alpha, lift2);

  if (!t.sp && !TUT.on && (r === 0 || c === 0 || r === N - 1 || c === N - 1)) {

/* 3.0: свечение цифры и всей грани перед сбросом */

  const a = Math.max(0, Math.min(1, t.blm));

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .55 * a * alpha;
  const g = ctx.createRadialGradient(p.x, p.y - lift, 0, p.x, p.y - lift, V.cw * .66);
  g.addColorStop(0, 'rgba(255,252,235,.95)');

  g.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y - lift, V.cw * .66, 0, 7); ctx.fill();
  ctx.restore();
  const fs = Math.max(12, V.cw * .47 * s);
  ctx.save();
  ctx.globalAlpha = Math.min(1, a * 1.2) * alpha;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + fs + 'px "Segoe UI",Roboto,Arial,sans-serif';
  ctx.shadowColor = 'rgba(255,246,210,.95)';

/* 3.0: rim light на фишках по краю доски — свет с внешней стороны */
function drawRim(r, c, s, alpha, lift, gr, gc) {
  const pts = quadOf(r, c, s, lift);
  const seg = [];
  if (gr === 0) seg.push([pts[0], pts[1]]);
  if (gr === N - 1) seg.push([pts[3], pts[2]]);
  if (gc === 0) seg.push([pts[0], pts[3]]);
  if (gc === N - 1) seg.push([pts[1], pts[2]]);

  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = .42 * alpha;
  ctx.strokeStyle = 'rgba(255,248,225,.95)';
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1.1, V.cw * .022);

    ctx.beginPath();
    ctx.moveTo(seg[i][0].x, seg[i][0].y);

/* ================= 2.9: отрисовка спецфишек ================= */
function drawSpecialMark(r, c, t, s, alpha, lift) {
  const pts = quadOf(r, c, s, lift || 0);
  const g = GLOW[t.c] || GLOW.gold;
  const pulse = .55 + .45 * Math.sin(performance.now() / 260 + t.i);
  const cx = (pts[0].x + pts[2].x) / 2, cy = (pts[0].y + pts[2].y) / 2;
  ctx.save();
  ctx.globalAlpha = alpha;
  /* светящаяся кромка плитки — цифра остаётся читаемой */
  ctx.beginPath(); roundPath(pts.map(p => ({ x: cx + (p.x - cx) * .86, y: cy + (p.y - cy) * .84 })), V.cw * .13 * s);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(' + g.core + ',' + (.6 + .4 * pulse) + ')';
  ctx.lineWidth = Math.max(2, V.cw * .06 * s);

  const u = Math.max(5, V.cw * .105 * s);
  ctx.beginPath(); ctx.arc(bx, by, u * 1.15, 0, 7);
  ctx.fillStyle = 'rgba(10,14,22,.72)'; ctx.fill();
  ctx.strokeStyle = 'rgba(' + g.core + ',.9)'; ctx.lineWidth = Math.max(1.2, u * .16); ctx.stroke();
  ctx.fillStyle = '#fff';
  if (t.sp === 'rocket') {
    /* двойная стрелка: направление выстрела */
    const vert = t.rd === 'v';
    ctx.beginPath();
    for (let k = 0; k < 2; k++) {
      const o = (k - .5) * u * .95;
      if (vert) {
        ctx.moveTo(bx - u * .55, by + o + u * .30); ctx.lineTo(bx, by + o - u * .22); ctx.lineTo(bx + u * .55, by + o + u * .30);
      } else {
        ctx.moveTo(bx + o - u * .12, by - u * .55); ctx.lineTo(bx + o + u * .40, by); ctx.lineTo(bx + o - u * .12, by + u * .55);

    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.4, u * .22); ctx.lineCap = 'round';
    ctx.beginPath();
    for (let k = 0; k < 4; k++) {

      ctx.moveTo(bx + Math.cos(a) * u * .58, by + Math.sin(a) * u * .58);

  }

    ai:   { rgb: '120,190,255', edge: dark ? 'rgba(228,244,255,.98)' : 'rgba(20,52,96,.80)', w: Math.max(2.6, V.cw * .05), fill: .30, glow: .60 },
    hint: { rgb: '120,255,185', edge: dark ? 'rgba(226,255,240,.98)' : 'rgba(8,88,58,.85)', w: Math.max(2.8, V.cw * .05), fill: .38, glow: .90 },

function cellCenter(r, c) {
  const q = quadOf(r, c, 1, 0);
  return { x: (q[0].x + q[2].x) / 2, y: (q[0].y + q[2].y) / 2 };
}
/* максимальные прямые отрезки внутри группы: по ним рисуем «лучи» */
function runsOf(cells) {
  const set = new Set(cells.map(([r, c]) => r * 10 + c));
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]], out = [];
  for (const [r, c] of cells) for (const [dr, dc] of dirs) {
    if (set.has((r - dr) * 10 + (c - dc))) continue;      /* не начало отрезка */
    const run = []; let rr = r, cc = c;
    while (set.has(rr * 10 + cc)) { run.push([rr, cc]); rr += dr; cc += dc; }
    if (run.length >= 3) out.push(run);
  }

}
/* 3.0: текст собранной линии — свой для каждого правила */
function rowText(gr, run) {
  const vals = run.map(([r, c]) => {
    const t = ST.grid && ST.grid[r] && ST.grid[r][c];
    return t ? t.v : 0;
  });
  if (PROG.rule === 'seq') return T('fx_seq', { s: vals.join('·') });
  if (PROG.rule === 'sum') return T('fx_sum', { s: vals.join('+'), t: vals.reduce((a, v) => a + v, 0) });
  return T('fx_row', { n: run.length });
}
/* свечение по линии + всплывающие «N в ряд» (цвет — по владельцу фишек) */
function pushMatchFx(groups) {
  let wi = 0;
  for (const gr of groups) {
    for (const run of runsOf(gr.cells)) {
      const a = cellCenter(run[0][0], run[0][1]);
      const b = cellCenter(run[run.length - 1][0], run[run.length - 1][1]);
      let dx = b.x - a.x, dy = b.y - a.y;
      const L = Math.hypot(dx, dy) || 1;
      dx /= L; dy /= L;
      const ext = V.cw * .36;
      BEAMS.push({
        x1: a.x - dx * ext, y1: a.y - dy * ext,
        x2: b.x + dx * ext, y2: b.y + dy * ext,
        color: gr.c, t: 0, life: .82
      });
      const quads = run.map(([r, c]) => quadOf(r, c, 1, 0));
      const xs = quads.map(q => (q[0].x + q[2].x) / 2);
      const topY = Math.min.apply(null, quads.map(q => Math.min(q[0].y, q[1].y)));
      WORDS.push({
        x: xs.reduce((s2, v) => s2 + v, 0) / xs.length, y: topY - V.ch * .48,
        text: rowText(gr, run), color: gr.c,

function drawMatchFx() {

  for (const b of BEAMS) {

    const g = GLOW[b.color] || GLOW.gold;
    const grow = Math.min(1, b.t / .17);
    const fade = b.t > b.life - .2 ? Math.max(0, (b.life - b.t) / .2) : 1;
    const cx = (b.x1 + b.x2) / 2, cy = (b.y1 + b.y2) / 2;
    const x1 = cx + (b.x1 - cx) * grow, y1 = cy + (b.y1 - cy) * grow;

    const p = Math.min(1, w.t / w.life);
    const e = 1 - Math.pow(1 - Math.min(1, p / .85), 2.2);
    const g = GLOW[w.color] || GLOW.gold;

    ctx.strokeText(w.text, w.x, y);

/* 3.1: тосты на порогах 25% / 10% / 0% — по одному разу за партию */
function checkReserveMilestones() {
  if (E.isInfiniteReserve() || TUT.on) return;
  const total = E.getReserveTotal();
  if (total <= 0) return;
  const left = E.getReserve();
  const frac = left / total;
  if (left === 0 && ST.reserveMilestone !== 'empty') {
    ST.reserveMilestone = 'empty';
    toast(T('reserve_empty'), 3200);
    sfx('reserveLow');
  } else if (frac <= 0.1 && ST.reserveMilestone !== 'tenth' && ST.reserveMilestone !== 'empty') {
    ST.reserveMilestone = 'tenth';
    toast(T('reserve_tenth'), 2800);
    sfx('reserveLow');
  } else if (frac <= 0.25 && !ST.reserveMilestone) {
    ST.reserveMilestone = 'quarter';
    toast(T('reserve_quarter'), 2600);
    sfx('reserveLow');
  }
}

    '<button class="ghost" id="mp-joinl" type="button">' + T('mp_join') + '</button>' +
    '</div>' +
    '<p class="mphi">' + T('mp_rating', { r: rated, w: w, l: l }) +
    (MBNet.hasCloud() ? '' : '<br>' + T('mp_local_note')) + '</p>';

    sfx('click');

    if (res === 'fail') { $('mp-body').innerHTML = '<p>' + T('mp_fail') + '</p>'; return; }

  };

    if (!code) { toast(T('mp_fail')); return; }
    mpWaitHost();
  };
  $('mp-joinl').onclick = () => {
    sfx('click');
    $('mp-body').innerHTML =
      '<p>' + T('mp_enter_code') + '</p>' +
      '<input id="mp-code" maxlength="5" inputmode="latin" autocomplete="off" placeholder="ABCDE">' +
      '<div class="btns"><button class="primary" id="mp-doj" type="button">' + T('mp_enter') + '</button></div>' +
      '<p class="mphi" id="mp-ruleprev"></p>' +
      '<p class="mphi" id="mp-err"></p>';
    /* 3.0 (п.8.4 ТЗ): гость видит правило партии ещё до нажатия «ВОЙТИ» */
    let prevT = 0;
    const previewRule = () => {
      clearTimeout(prevT);
      prevT = setTimeout(async () => {
        const el = $('mp-ruleprev');
        const code = ($('mp-code') && $('mp-code').value || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!el) return;
        if (code.length < 4) { el.innerHTML = ''; return; }
        let st = null;
        try { st = await MBNet.get(MBNet.key + code); } catch (e) {}
        if (!el) return;
        if (!st) { el.innerHTML = ''; return; }
        const r = (RULES3.indexOf(st.rule) >= 0) ? st.rule : 'same';
        el.innerHTML = T('mp_rule_preview', { r: ruleShort(r) });
      }, 260);
    };
    $('mp-code').addEventListener('input', previewRule);
    $('mp-doj').onclick = async () => {
      sfx('click');

      if (!r.ok) { $('mp-err').textContent = T(r.why === 'full' ? 'mp_err_full' : 'mp_err_none'); return; }
      $('ov-mp').classList.remove('on');

function idleTouch() {

async function beginTurn() {

  if (TUT.on) { ST.busy = TUT.step !== 1; paintHUD(); return; }
  if ($('ov-tut').classList.contains('on')) { ST.busy = true; paintHUD(); return; }
  if (ST.mode === 'hot') {

}
async function ensureMove(color) {
  if (color === 'ai') color = 'blue';
  if (E.hasMove(ST.grid, color)) return true;
  /* 2.5: ходов на линии нет — доска перемешивается заново и раскладывается так,
     чтобы вариант был и у игрока, и у соперника. Партия заканчивается по «ходам нет»
     только если фишек на доске уже физически не хватает на линию. */
  if (E.countTiles(ST.grid) < 6) { endMatch(compareWinner(), endReasonByBoard()); return false; }
  let ok = false;
  for (let k = 0; k < 3 && !ok; k++) {
    const before = snapshotPositions();
    /* 2.3: в онлайне автошейк обязан совпасть у обоих — сид из номера события */
    const seed = (ST.mode === 'mp') ? MP.rsSeed(MP.seq) : 0;
    const applied = ST.mode === 'mp'
      ? E.reshuffle(ST.grid, E.rng(seed))
      : E.reshuffle(ST.grid, Math.random);
    if (!applied) break;
    if (ST.mode === 'mp') await MP.pushEvent({ rs: 1 });
    await animateShuffle(before);
    ok = E.hasMove(ST.grid, color) && E.hasMove(ST.grid, E.OTHER[color]);
  }
  if (ok) { sfx('shuffle'); toast(T(color === 'gold' ? 'toast_nomoves' : 'toast_ai_nomoves')); return true; }
  /* 3.1: перемешать не удалось — при пустом резерве это «фишки кончились»,
     иначе просто «доступных ходов больше нет» */
  /* «фишки кончились» пишем только если доска действительно почти пуста;
     иначе честнее «доступных ходов больше нет» */
  endMatch(compareWinner(), (endReasonByBoard() === 'reserve' && E.countTiles(ST.grid) < 6) ? 'reserve' : 'dead');
  return false;
}
function snapshotPositions() {
  const m = {};
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const t = ST.grid[r][c]; if (t) m[t.i] = { r, c }; }
  return m;
}
async function animateShuffle(before) {
  const list = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = ST.grid[r][c];
    if (t && before[t.i]) {
      t.fr = before[t.i].r; t.fc = before[t.i].c; t.tr = r; t.tc = c;
      list.push(t);
    }
  }
  if (!list.length) return;
  await tween(320, p => {
    const e = easeInOut(p);
    list.forEach(t => {
      t.or = (t.fr - t.tr) * (1 - e); t.oc = (t.fc - t.tc) * (1 - e);
      t.lift = Math.sin(Math.PI * p) * V.ch * .35;
      t.sc = 1 + Math.sin(Math.PI * p) * .06;
    });
  });
  list.forEach(t => { t.or = t.oc = t.lift = 0; t.sc = 1; });
}
async function animateSwapTiles(a, b, mv, dur) {
  const ar = mv.r1, ac = mv.c1, br = mv.r2, bc = mv.c2;
  let lastP = 0;
  await tween(dur, p => {
    const e = easeInOut(p), l = Math.sin(Math.PI * p) * V.ch * .18;
    a.or = (br - ar) * e; a.oc = (bc - ac) * e; a.lift = l;
    b.or = (ar - br) * e; b.oc = (ac - bc) * e; b.lift = l;
    /* 3.0 (эффект 12): лёгкий след из затухающих частиц */
    if (p - lastP > .26 || lastP === 0) {
      lastP = p;
      [[a, ar, ac], [b, br, bc]].forEach(([t, r0, c0]) => {
        if (!t) return;
        const cc0 = cellCenter(r0 + (t.or || 0), c0 + (t.oc || 0));
        const sp = (t.c === 'gold' ? PAL.p : PAL.a).spark;
        for (let k = 0; k < 2; k++) {
          PARTICLES.push({
            x: cc0.x + (Math.random() - .5) * V.cw * .34,
            y: cc0.y + (Math.random() - .5) * V.ch * .34,
            vx: (Math.random() - .5) * 26, vy: (Math.random() - .5) * 26,
            life: .15 + Math.random() * .12, max: .27,
            size: V.cw * (.045 + Math.random() * .04),
            g: 0, dr: .90,
            color: sp[Math.random() < .5 ? 0 : 1]
          });
        }
      });
    }
  });
  a.or = a.oc = a.lift = 0; b.or = b.oc = b.lift = 0;
}
async function performSwap(mv, who) {
  idleTouch(); ST.busy = true; ST.selected = null; ST.hint = null; paintHUD();
  const a = ST.grid[mv.r1][mv.c1], b = ST.grid[mv.r2][mv.c2];
  if (!a || !b) return 0;
  sfx('swap');
  await animateSwapTiles(a, b, mv, 165);
  E.swapCells(ST.grid, mv.r1, mv.c1, mv.r2, mv.c2);
  /* 2.9: рефилл + спецфишки. В онлайне генератор новых фишек детерминированный —
     сид считается из кода партии и номера хода, а не из MP.seq (у хоста и гостя
     он меняется в разном порядке и доски разъезжались). */
  const refRand = (ST.mode === 'mp')
    ? E.rng((MBNet.seedOf(MP.code || 'X') ^ Math.imul(ST.moves + 1, 2654435761)) >>> 0)
    : Math.random;
  const plan = E.resolvePlan(ST.grid, { refill: true, rand: refRand, swap: [[mv.r1, mv.c1], [mv.r2, mv.c2]] });
  /* новые фишки уже лежат в плане — до анимации прячем их, чтобы не появлялись раньше времени */
  plan.phases.forEach(ph => ph.refills.forEach(x => { x.t.ap = 0; x.t.or = 0; }));
  /* 2.6: who может быть 'ai' — очки считаются по цвету, иначе gained всегда undefined
     и ИИ никогда не получал вторую сборку */
  const col = (who === 'ai') ? 'blue' : who;
  const gained = plan.total[col] || 0;
  ST.lastGain = gained;
  ST.lastCombo = plan.phases.reduce((m, ph) => Math.max(m, ph.combo || 1), 1);
  if (plan.phases.length) await runPhases(plan.phases);
  checkReserveMilestones();          /* 3.1: пороги резерва */
  paintReserve();
  ST.moves++;
  return gained;
}
async function runPhases(phases) {
  ST.maxWaves = Math.max(ST.maxWaves || 0, phases.length);
  for (let i = 0; i < phases.length; i++) {
    const ph = phases[i];
    ST.maxCombo = Math.max(ST.maxCombo || 1, ph.combo || 1);
    ph.groups.forEach(gr => { ST.maxLen = Math.max(ST.maxLen || 0, gr.cells.length); });
    /* 2.9: комбо за каскад + 3.0: плашка «🔥 ×N» в углу */
    if (ph.combo > 1) { toast(T('toast_cascade_x', { x: ph.combo })); sfx('combo', ph.combo); showComboBadge(ph.combo); }
    else if (i > 0) { toast(T('toast_cascade')); sfx('cascade', i); }
    /* эффект 3: slow-motion на большом каскаде (×3 и выше) */
    if ((ph.combo || 1) >= 3) SLOW.t = 200;
    const maxLen = Math.max.apply(null, ph.groups.map(g => g.cells.length));
    if (maxLen >= 4) sfx('triple'); else sfx('clear', ph.groups[0] ? ph.groups[0].v : 3);
    /* 2.2: сначала «любуемся» линией — свечение + «N в ряд», плитки ещё на месте */
    pushMatchFx(ph.groups);
    if (ph.combo > 1) pushComboFx(ph.combo);
    await sleep(560);
    ph.groups.forEach(gr => {
      const cs = gr.cells;
      let sr = 0, sc = 0;
      cs.forEach(([r, c]) => { sr += r; sc += c; });
      floatAt(sr / cs.length, sc / cs.length, '+' + gr.pts, gr.c);
    });
    /* 2.9: спецфишка рождается в клетке и остаётся на доске */
    let mySpecials = 0;
    ph.spawns.forEach(sp => {
      const t = ST.grid[sp.r] && ST.grid[sp.r][sp.c];
      if (t) { t.sp = sp.type; t.rd = sp.rd; t.born = 1; }
      burstAt(sp.r, sp.c, sp.c2);
      sfx('special');
      if (sp.c2 === myColor()) {
        mySpecials++;
        if (sp.type === 'rocket') ST.rockets = (ST.rockets || 0) + 1;
        else ST.bombs = (ST.bombs || 0) + 1;
      }
    });
    ST.specTurn = Math.max(ST.specTurn || 0, mySpecials);
    /* 2.9: детонация ракет и бомб */
    ph.blasts.forEach(b => { pushBlastFx(b); sfx(b.type === 'bomb' ? 'boom' : 'rocket'); });
    if (ph.blasts.length) {
      sfx('boom');
      /* эффект 5: тряска экрана при детонации бомбы */
      if (ph.blasts.some(b => b.type === 'bomb')) shakeScreen(4, 150);
      else shakeScreen(2, 110);
      await sleep(120);
    }
    const tiles = ph.removed.map(([r, c]) => ST.grid[r][c]).filter(Boolean);
    ph.removed.forEach(([r, c]) => burstAt(r, c, ST.grid[r][c] ? ST.grid[r][c].c : 'gold'));
    /* эффект 6: цифры «расцветают» на 150 мс перед сбросом */
    ph.removed.forEach(([r, c]) => { const t = ST.grid[r][c]; if (t) t.blm = 1; });
    await tween(200, p => { tiles.forEach(t => { t.pop = p; }); });
    ph.removed.forEach(([r, c]) => { ST.grid[r][c] = null; });
    /* очки */
    ST.score.gold += ph.pts.gold; ST.score.blue += ph.pts.blue;
    paintHUD();
    if (ph.pts.gold || ph.pts.blue) bumpScore(ph.pts.gold ? 'gold' : 'blue');
    /* падение */
    if (ph.falls.length) {
      const byId = {};
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const t = ST.grid[r][c]; if (t) byId[t.i] = t; }
      let maxD = 1;
      ph.falls.forEach(f => {
        const t = byId[f.i];
        if (t) { t.or0 = f.from - f.to; t.or = t.or0; t.oc = 0; maxD = Math.max(maxD, f.from - f.to); }
      });
      E.gravity(ST.grid);
      const moving = ph.falls.map(f => byId[f.i]).filter(Boolean);
      sfx('fall', maxD);
      await tween(150 + maxD * 55, p => {
        const e = easeIn(p);
        moving.forEach(t => { t.or = (t.or0 || 0) * (1 - e); });
      });
      moving.forEach(t => { t.or = 0; t.or0 = 0; t.sq = 1; });
      /* эффект 2: пыль при приземлении */
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        const t = ST.grid[r][c];
        if (t && moving.indexOf(t) >= 0) dustAt(r, c, t.c, 3);
      }
    }
    /* 2.9: рефилл — новые фишки ссыпаются сверху */
    if (ph.refills.length) {
      ph.refills.forEach(x => { ST.grid[x.r][x.c] = x.t; x.t.ap = 0; x.t.or = -3.2; });
      sfx('fall', 3);
      await tween(210, p => {
        const e = easeOut(p);
        ph.refills.forEach(x => { x.t.ap = e; x.t.or = -3.2 * (1 - e); });
      });
      ph.refills.forEach(x => { x.t.ap = 1; x.t.or = 0; x.t.sq = 1; });
      ph.refills.forEach(x => { if (Math.random() < .55) dustAt(x.r, x.c, x.t.c, 2); });
    }
    await sleep(40);
  }
}
/* 2.9: эффект детонации — ракета чистит ряд/столбец, бомба — квадрат 3×3 */
function pushBlastFx(b) {
  if (b.type === 'rocket') {
    const horiz = b.rd !== 'v';
    const a = cellCenter(b.at[0], b.at[1]);
    const far = horiz ? { x: 0, y: a.y } : { x: a.x, y: 0 };
    const far2 = horiz ? { x: V.w, y: a.y } : { x: a.x, y: V.h };
    BEAMS.push({ x1: far.x, y1: far.y, x2: far2.x, y2: far2.y, color: b.color, t: 0, life: .55 });
  } else {
    const a = cellCenter(b.at[0], b.at[1]);
    RINGS.push({ x: a.x, y: a.y, r: V.cw * .3, sp: V.cw * 5.5, life: .5, max: .5, color: 'rgba(' + (GLOW[b.color] || GLOW.gold).beam + ',.85)' });
  }
  b.cells.forEach(([r, c]) => burstAt(r, c, b.color));
}
/* 2.9: «×2» в центре доски при каскаде */
function pushComboFx(x) {
  const p = corner(CTR, CTR);
  FLOATS.push({
    x: p.x, y: p.y - V.ch * .4, text: '×' + x, color: '#ffe9b0',
    size: Math.round(V.cw * .95), life: 1.15, max: 1.15, vy: -V.ch * .55
  });
}
function bumpScore(which) {
  const el = which === 'gold' ? $('p-score') : $('a-score');
  if (!el) return;
  /* 2.9 (техдолг #10): Web Animations есть не везде — старым Safari оставляем CSS-класс */
  try {
    if (typeof el.animate === 'function') {
      el.animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
      return;
    }
  } catch (e) {}
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 280);
}

/* 2.9: один откат за партию — возвращает доску и счёт к состоянию перед своим свапом */
function takeUndo() {
  if (TUT.on || ST.mode === 'mp') return;
  if (!ST.undoLeft) return;
  ST.undo = {
    grid: E.cloneGrid(ST.grid),
    score: { gold: ST.score.gold, blue: ST.score.blue },
    turn: ST.turn, streak: ST.streak, moves: ST.moves,
    reserve: E.getReserve(),                   /* 3.1: резерв тоже откатывается */
    reserveMilestone: ST.reserveMilestone
  };
}
async function undoMove() {
  if (!ST.undo || ST.busy || ST.over || !ST.undoLeft) return;
  if (TUT.on || ST.mode === 'mp') return;
  const u = ST.undo;
  ST.undo = null; ST.undoLeft = 0;
  ST.grid = prepTiles(u.grid);
  ST.score = { gold: u.score.gold, blue: u.score.blue };
  ST.turn = u.turn; ST.streak = u.streak; ST.moves = u.moves;
  if (typeof u.reserve === 'number' && typeof E.setReserveLeft === 'function') E.setReserveLeft(u.reserve);
  ST.reserveMilestone = u.reserveMilestone;
  ST.reservePrev = null;
  ST.selected = null; ST.hint = null; ST.busy = false; ST.finished = false;
  clearFx(); paintHUD(); layoutCanvas(); buildSprites();
  sfx('desel'); toast(T('toast_undo'));
  beginTurn();
}

/* ------------------------------- ходы -------------------------------- */
/* 2.6: правило двух сборок — одинаковое для игрока и для соперника во всех режимах.
   Собрал линию — ход остаётся, можно собрать вторую как награду; после второй ход переходит. */
function streakAfter(mover, gained) {
  if (!gained) { ST.streak = 0; return false; }
  ST.streak++;
  if (ST.streak >= CAP) { ST.streak = 0; return false; }
  return true;
}
/* 2.6: лог ходов для автотестов (в браузере его нет) */
function logMove(mover, gained, keep) {
  try { if (typeof window.MBLOG === 'function') window.MBLOG({ mover: mover, gained: gained, keep: !!keep, turn: ST.turn, streak: ST.streak }); } catch (e) {}
}
function afterMove(mover, gained) {
  if (checkEnd()) return;
  idleTouch();
  const keep = streakAfter(mover, gained);
  if (keep) {
    ST.turn = mover;
    toast(ST.lastCombo > 1 ? T('toast_cascade_x', { x: ST.lastCombo }) : T('toast_combo'));
    sfx('streak', ST.streak || 2);          /* 3.2: свой звук серии */
  } else {
    ST.turn = other(mover);
    if (gained > 0 && mover === 'gold') toast(T('toast_cap'));
    else if (!gained && mover === 'gold' && !ST.training) toast(T('toast_fail'));
  }
  if (ST.training) { ST.turn = 'gold'; ST.streak = 0; }
  logMove(mover, gained, keep);
  beginTurn();
}
/* 3.1: почему закончились фишки — резерв исчерпан или краевой случай */
function endReasonByBoard() { return E.reserveEmpty() ? 'reserve' : 'empty'; }
function checkEnd() {
  if (ST.over) return true;
  if (TUT.on) return false;
  const g = ST.score.gold, b = ST.score.blue;
  if (g >= ST.target || b >= ST.target) {
    endMatch(g === b ? 'draw' : (g > b ? 'gold' : 'blue'), 'target');
    return true;
  }
  const tiles = E.countTiles(ST.grid);
  /* 3.1: резерв исчерпан и доска почти пуста → финал «фишки кончились» */
  if (!E.isInfiniteReserve() && E.getReserve() === 0 && tiles < 6) {
    endMatch(compareWinner(), 'reserve');
    return true;
  }
  /* защита: доска опустела раньше времени (краевой случай) */
  if (tiles < 6) { endMatch(compareWinner(), 'empty'); return true; }
  return false;
}
function compareWinner() {
  const g = ST.score.gold, b = ST.score.blue;
  return g === b ? 'draw' : (g > b ? 'gold' : 'blue');
}
async function aiTurn() {
  let guard = 0;
  while (ST.turn === 'blue' && !ST.over && guard++ < 8) {
    if (!await ensureMove('blue')) return;
    const mv = E.aiMove(ST.grid, LEVELS[ST.level].ai, Math.random);
    if (!mv) { ST.turn = 'gold'; break; }
    await highlightPair(mv, 'blue');
    const gained = await performSwap(mv, 'ai');
    if (checkEnd()) return;
    const keepAI = streakAfter('blue', gained);
    if (keepAI) {
      ST.turn = 'blue';
      toast(ST.lastCombo > 1 ? T('toast_cascade_x', { x: ST.lastCombo }) : T('toast_combo'));
    } else {
      ST.turn = 'gold';
      if (gained > 0) toast(T('toast_ai_cap'));
    }
    logMove('blue', gained, keepAI);
    await sleep(160);
  }

}
async function highlightPair(mv, color) {

  await sleep(340);

}
function endMatch(winner, reason) {
  if (ST.over && ST.finished) return;

  ST.over = true; ST.busy = true; ST.selected = null; ST.hint = null;
  if (WAVE) endWave();
  paintHUD();
  MP.stopPoll();
  const g = Math.round(ST.score.gold), b = Math.round(ST.score.blue);

  if (ST.mode === 'hot') {                       /* двое за одним устройством */
    sfx(winner === 'gold' ? 'win' : (winner === 'blue' ? 'lose' : 'draw'));
    setTimeout(() => showFinale(winner, reason, g, b), 520);
    return;
  }
  if (ST.mode === 'mp') {                        /* онлайн-дуэль */
    const mine = MP.color();
    const win = winner === mine;
    if (winner !== 'draw') {
      const mp = PROG.mp = PROG.mp || { rating: 1000, w: 0, l: 0 };
      if (win) { mp.rating = clamp((mp.rating || 1000) + 12, 0, 9999); mp.w = (mp.w || 0) + 1; }
      else { mp.rating = clamp((mp.rating || 1000) - 8, 0, 9999); mp.l = (mp.l || 0) + 1; }

    setTimeout(() => showFinale(winner, reason, g, b), 520);
    return;
  }

  const win = winner === 'gold';
  if (win) {
    sfx('win');
    /* 3.0: победы и рекорды пишутся в ветку текущего правила */
    const rl = PROG.wins[PROG.rule] || (PROG.wins[PROG.rule] = {});
    const bl = PROG.best[PROG.rule] || (PROG.best[PROG.rule] = {});
    rl[ST.rival] = (rl[ST.rival] || 0) + 1;
    bl[ST.rival] = Math.max(bl[ST.rival] || 0, g);

/* 3.0: XP, достижения и конфетти на финале (общая часть для всех режимов) */

function achCount() { return ACH.filter(a => PROG.ach[a.id]).length; }

/* --------------------------- подсказка / шейк ------------------------ */
/* 2.9: подсказка объясняет, ПОЧЕМУ свап лучший */
function hintReason(mv, col) {
  const ex = E.explainMove(ST.grid, mv, col);
  if (!ex) return T('toast_hint');
  const dirKey = ex.dir === 'h' ? 'dir_h' : (ex.dir === 'v' ? 'dir_v' : 'dir_d');
  let sp = '';
  if (ex.special === 'rocket') sp = ' ' + T('hint_sp_rocket');
  else if (ex.special === 'bomb') sp = ' ' + T('hint_sp_bomb');
  /* 3.0: тексты по правилу — последовательность и сумма объясняются словами */
  const mode = ex.mode || PROG.rule;
  if (mode === 'seq') return T('hint_seq', { s: ex.chain || '', dir: T(dirKey), p: ex.score }) + sp;
  if (mode === 'sum') return T('hint_sum', { s: (ex.values || []).join('+'), t: ex.sumTarget || 10, dir: T(dirKey), p: ex.score }) + sp;
  return T('hint_reason', { n: ex.len, dir: T(dirKey), p: ex.score }) + sp;
}
function showHint() {
  const col = myColor();
  const b = E.bestMove(ST.grid, col);
  if (!b) {
    toast(T('toast_nomoves'));
    return false;
  }
  ST.hint = { a: [b.move.r1, b.move.c1], b: [b.move.r2, b.move.c2], until: performance.now() + 8000 };
  ST.hintPair = [b.move.r1 * N + b.move.c1, b.move.r2 * N + b.move.c2];
  sfx('hint');
  toast(hintReason(b.move, col), 5400);
  setTimeout(() => { if (ST.hint && performance.now() >= ST.hint.until) ST.hint = null; }, 8200);
  return true;
}

/* -------------------------------- ввод ------------------------------- */
function pickCell(x, y) {
  if (!V.cw) return null;
  const rr = Math.round((y - V.oy) / V.ch + CTR);
  if (rr < 0 || rr > N - 1) return null;
  const kk = kRow(rr);
  const cc = Math.round((x - V.ox - (rr - CTR) * V.sh) / (V.cw * kk) + CTR);
  if (cc < 0 || cc > N - 1) return null;
  return { r: rr, c: cc };
}
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
let pointer = { down: false, cell: null, moved: false, x0: 0, y0: 0 };
/* 2.4: правило свапа в дуэли —
     • своя  + своя   — можно;
     • своя  + чужая  — можно;
     • чужая + чужая  — НИКОГДА (ни игрок, ни ИИ).
   Реализовано в ядре: canSwap(..., color) и allSwaps(grid, color). */
function myColor() {
  if (ST.mode === 'hot') return ST.turn;
  if (ST.mode === 'mp') return MP.color();
  return 'gold';
}
function canPlay() {
  if (curScreen !== 'game' || ST.busy || ST.over) return false;
  if (TUT.on) return !!TUT.can;
  if (ST.mode === 'hot') return true;
  if (ST.mode === 'mp') return MP.myTurn();
  return ST.turn === 'gold';
}
/* ад, в котором нельзя двигать фишки в туториале */
function tutBlocks(r, c) {
  if (!TUT.on || !TUT.lock) return false;
  return !(TUT.lock.some(p => p[0] === r && p[1] === c));
}
function playerTrySwap(r1, c1, r2, c2) {
  const who = myColor();
  if (TUT.on && TUT.lock) {
    const okPair = (tutIn(r1, c1) && tutIn(r2, c2));
    if (!okPair) { sfx('err'); toast(T('tut_need_pair')); return false; }
  }
  const chk = E.canSwap(ST.grid, r1, c1, r2, c2, who);
  if (chk.ok) { playerMove({ r1: r1, c1: c1, r2: r2, c2: c2 }); return true; }
  if (chk.why === 'enemy') { sfx('err'); toast(T('toast_enemy_swap')); }
  return false;
}
function tutIn(r, c) { return !!TUT.lock && TUT.lock.some(p => p[0] === r && p[1] === c); }
cv.addEventListener('pointerdown', e => {
  audio();
  idleTouch();                       /* 2.3: любое касание доски останавливает волну */
  if (!canPlay()) return;
  const p = pointerPos(e);
  const cell = pickCell(p.x, p.y);
  if (!cell || !ST.grid[cell.r][cell.c]) return;
  pointer = { down: true, cell, moved: false, x0: p.x, y0: p.y, id: e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  clearPred();
  /* 3.0: на мобиле предсказание показывается при долгом нажатии */
  clearTimeout(pointer.holdT);
  pointer.holdT = setTimeout(() => {
    if (pointer.down && !pointer.moved && pointer.cell) predictAt(pointer.cell.r, pointer.cell.c, 0);
  }, 420);
  /* повторный тап по той же фишке — снять выбор */
  if (ST.selected && ST.selected.r === cell.r && ST.selected.c === cell.c) {
    pointer.down = false;
    ST.selected = null;
    sfx('desel');
    return;
  }
  /* второй тап по соседней (в т.ч. диагональной) фишке — свап */
  if (ST.selected) {
    const sel = ST.selected;
    /* 2.4: правило цвета — в свапе обязательно участвует СВОЯ фишка */
    const chk = E.canSwap(ST.grid, sel.r, sel.c, cell.r, cell.c, myColor());
    if (chk.ok) {
      pointer.down = false;
      playerTrySwap(sel.r, sel.c, cell.r, cell.c);
      return;
    }
    if (chk.why === 'enemy') { sfx('err'); toast(T('toast_enemy_swap')); }
  }
  ST.selected = { r: cell.r, c: cell.c };
  ST.hint = null;
  sfx('sel');
  paintHUD();
});
cv.addEventListener('pointermove', e => {
  const p = pointerPos(e);
  if (pointer.down) {
    if (Math.abs(p.x - pointer.x0) + Math.abs(p.y - pointer.y0) > 12) pointer.moved = true;
  } else {
    const hc = pickCell(p.x, p.y);
    ST.hover = hc;
    cv.style.cursor = hc && ST.grid && ST.grid[hc.r] && ST.grid[hc.r][hc.c] && canPlay() ? 'pointer' : 'default';
    /* 3.0 (п.6 UI): на десктопе подсказываем очки свапа под курсором */
    const key = hc ? (hc.r + ':' + hc.c) : '';
    if (key !== PRE.key) {
      PRE.key = key;
      if (hc && hc.r === PRE.r && hc.c === PRE.c) { /* уже посчитано */ }
      else if (hc) predictAt(hc.r, hc.c, 90);
      else clearPred();
    }
  }
});
cv.addEventListener('pointerup', e => {
  const wasDown = pointer.down, from = pointer.cell, moved = pointer.moved;
  clearTimeout(pointer.holdT);
  pointer.down = false; pointer.cell = null;
  if (!wasDown || !canPlay()) return;
  const p = pointerPos(e);
  const cell = pickCell(p.x, p.y);
  if (!cell || !ST.grid[cell.r][cell.c]) return;
  if (cell.r === from.r && cell.c === from.c) return;         /* тап: выбор уже сделан */
  if (E.isAdjacent(from.r, from.c, cell.r, cell.c)) {
    playerTrySwap(from.r, from.c, cell.r, cell.c);            /* свайп, в т.ч. по диагонали */
  } else if (moved) {
    ST.selected = { r: cell.r, c: cell.c };
    sfx('sel');
  }
});
cv.addEventListener('pointercancel', () => { clearTimeout(pointer.holdT); pointer.down = false; });
async function playerMove(mv) {
  if (ST.busy || ST.over) return;
  if (!canPlay()) return;
  const who = myColor();
  /* 2.4: последний барьер — игрок никогда не двигает две фишки соперника */
  const legal = E.canSwap(ST.grid, mv.r1, mv.c1, mv.r2, mv.c2, who);
  if (!legal.ok) {
    sfx('err');
    if (legal.why === 'enemy') toast(T('toast_enemy_swap'));
    ST.busy = false; paintHUD();
    return;
  }
  idleTouch();
  takeUndo();                       /* 2.9: запоминаем состояние для отката */
  ST.busy = true; ST.selected = null; ST.hint = null; paintHUD();
  const gained = await performSwap(mv, who);
  if (TUT.on) { await tutAfterMove(mv, gained); return; }
  if (ST.mode === 'mp') MP.push(mv);
  afterMove(who, gained);
}
